<style>
  /* ================= F04 · ESPERA O ALARME — ep. 059 (bed POV, ceiling at night) ================= */
  :root { --f4-ink: #f2f0ff; --f4-dim: #bdb8d8; --f4-lime: #c6ff3d; --f4-gold: #ffd166; --f4-mag: #e879f9; }

  #cone { position: absolute; left: 0; top: 0; width: 100%; height: 100%;

  #standShine { position: absolute; left: -80px; right: -80px; top: 1452px; height: 150px; clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);

  #stamp .s2 { font-family: "Instrument Serif", serif; font-style: italic; font-size: 96px; color: var(--f4-ink); margin-top: 10px; }

  .dex img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-d { position: absolute; left: 6%; width: 60%; height: 16%; border-radius: 8px; background: rgba(255,255,255,.2); }
  .bonusT { position: absolute; left: 90px; width: 790px; top: 330px; text-align: center; font-family: "Anton", sans-serif; font-size: 108px; line-height: 1.04; color: var(--f4-ink); text-transform: uppercase; }
  .bonusC { position: absolute; left: 90px; width: 790px; top: 940px; text-align: center; }
  .chip { display: inline-block; padding: 14px 30px; border-radius: 999px; font: 800 50px "Inter", sans-serif; background: var(--f4-gold); color: #1a1205; }

  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(244,214,255,1) 0%, rgba(192,132,252,.85) 30%, rgba(168,85,247,0) 70%); mix-blend-mode: screen; }

  .ask b { color: var(--f4-lime); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }

  #blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45; }

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="20" data-fps="30">
  <div class="f4-set">

      <div id="rays"></div>
      <div id="printWrap">
        <div class="f4-print" id="print">
          <img src="kit/img/prints/mega-scizor-8-alarms--alarms.png" alt="" />

        <div class="mark" id="mk2" style="left:3%; top:38.5%; width:86%"></div>
        <div class="mark" id="mk3" style="left:3%; top:63.5%; width:38%"></div>

<script>
  const tl = gsap.timeline({ paused: true });
  const D = 20;
  const b = KZ.beats(130);            // beat 0.4615 s, bar 1.846 s

  /* build-time DOM: 8 mega badges (generic gem icon, not official art) */
  (function () {
    const gem = '<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6ff"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M32 4 L56 22 L32 60 L8 22 Z" fill="url(#g)"/><path d="M8 22 H56 M20 22 L32 60 L44 22 M20 22 L32 4 L44 22" stroke="#2a0b45" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>';
    ["bA", "bB"].forEach(function (rid, r) {
      const row = document.getElementById(rid);
      for (let i = 0; i < 4; i++) {
        const d = document.createElement("div"); d.className = "bdg"; d.id = "m" + (r * 4 + i + 1);
        d.innerHTML = gem + "<span>MEGA</span>"; row.appendChild(d);
      }
    });
  })();

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#setCam", { x: 0, y: 0, rotation: -0.8, scale: 1.02 }, { x: -20, y: -26, rotation: 0.8, scale: 1.07, duration: D, ease: "sine.inOut" }, 0);
  tl.fromTo("#grain", { x: 0, y: 0 }, { x: -120, y: 96, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);

  function glow(at, peak) {   // the ceiling lights up from the phone
    tl.fromTo("#cone", { opacity: peak || 1 }, { opacity: 0.3, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
    tl.fromTo("#standShine", { opacity: 1 }, { opacity: 0.4, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
    KZ.shake(tl, "#phoneFlat", at, 5, 0.3, Math.round(at * 100));
  }

  /* S1 hook */
  glow(0.0, 1);
  tl.fromTo("#h1", { scale: 1.16, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);   // frame 0 already readable
  KZ.slam(tl, "#h2", 0.14, 1.7);
  KZ.slam(tl, "#h3", 0.28, 1.9);
  glow(b(1), 0.9); glow(b(2), 0.95); glow(b(3), 1);
  KZ.shake(tl, "#s1in", b(2), 6, 0.25, 11);
  tl.to("#s1in", { scale: 1.05, duration: 1.4, ease: "sine.inOut" }, 0.4);
  tl.to("#s1in", { y: -60, opacity: 0, duration: 0.18, ease: "power2.in" }, 1.846 - 0.2);

  /* S2 build: 8 alarms in two real minutes, faster each time */
  const S2 = 1.846;
  tl.fromTo("#hid", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, S2);
  tl.fromTo("#rl1", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, S2 + 0.2);
  const times = [2.45, 3.0, 3.5, 3.92, 4.55, 4.95, 5.3, 5.6];
  times.forEach(function (t, i) {
    if (i === 4) tl.fromTo("#rl2", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, t - 0.2);
    tl.fromTo("#m" + (i + 1), { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(2.6)" }, t);
    glow(t, 0.75 + i * 0.03);
    KZ.shake(tl, "#grid", t, 4 + i, 0.16, 20 + i);
  });
  tl.to("#grid", { scale: 1.04, duration: 1.5, ease: "sine.in" }, 5.6);
  tl.fromTo("#ask1", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, b(13));
  tl.to("#ask1", { scale: 1.06, duration: 0.9, ease: "sine.in" }, b(13) + 0.3);

  /* blackout + silence */
  tl.fromTo("#hush", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 7.0);
  tl.set("#hush", { opacity: 0 }, 7.385);

  /* S3 reveal */
  const R = 7.385;
  KZ.flash(tl, "#flash", R, 0.95);
  tl.fromTo("#roomTint", { opacity: 0 }, { opacity: 0.85, duration: 0.6, ease: "power2.out" }, R);
  tl.fromTo("#rays", { opacity: 0, rotation: 0, scale: 0.7 }, { opacity: 1, rotation: 30, scale: 1, duration: 2.8, ease: "power1.out" }, R);
  tl.fromTo("#printWrap", { scale: 1.2, filter: "blur(32px) brightness(2.2)" }, { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.7, ease: "power3.out" }, R);
  KZ.shake(tl, "#printWrap", R + 0.02, 6, 0.22, 91);
  KZ.pop(tl, "#tag3", R + 0.35, 0.35);
  (function () {
    const field = document.getElementById("sparkField");
    const cols = ["#ffd166", "#ffffff", "#e879f9", "#c6ff3d"];
    const pr = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const parts = [];
    for (let i = 0; i < 24; i++) {
