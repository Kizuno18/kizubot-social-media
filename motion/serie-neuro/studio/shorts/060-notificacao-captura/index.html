<script>
  const tl = gsap.timeline({ paused: true });
  const D = 17;
  const b = KZ.beats(124);            // beat 0.4839 s, bar 1.935 s
  const BAR = b(4);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#setCam", { x: -12, y: 0, scale: 1.03 }, { x: 12, y: -24, scale: 1.08, duration: D, ease: "sine.inOut" }, 0);
  tl.fromTo("#grain", { x: 0, y: 0 }, { x: -120, y: 96, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);

  function buzz(at, seed, amp) {
    KZ.shake(tl, "#phoneBuzz", at, amp || 9, 0.3, seed);
    tl.fromTo("#phoneGlow", { opacity: 1 }, { opacity: 0.55, duration: 0.45, ease: "power2.out", immediateRender: false }, at);
    tl.fromTo("#screen", { filter: "brightness(1.5)" }, { filter: "brightness(1)", duration: 0.35, ease: "power2.out", immediateRender: false }, at);
  }

  /* STAGE */
  tl.fromTo("#phoneRot", { rotation: -7 }, { rotation: 0, duration: 0.8, ease: "power3.inOut" }, BAR + 0.05);
  tl.fromTo("#phoneRig", { y: 0, scale: 1 }, { y: -560, scale: 1.0, duration: 0.8, ease: "power3.inOut" }, BAR + 0.05);
  tl.fromTo("#stageCam", { scale: 1, y: 0 }, { scale: 1.32, y: -120, duration: 1.0, ease: "power3.inOut" }, BAR + 0.85);
  buzz(0.0, 3, 11); buzz(b(1), 5); buzz(b(2), 8); buzz(b(3), 11);
  buzz(BAR + b(3), 13, 6);

  /* S1 hook */
  tl.fromTo("#h1", { scale: 1.2, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  KZ.slam(tl, "#h2", 0.14, 1.6);
  KZ.slam(tl, "#h3", 0.3, 1.9);
  KZ.shake(tl, "#h3", b(2), 7, 0.3, 21);
  tl.to("#s1in", { scale: 1.04, duration: 1.4, ease: "sine.inOut" }, 0.4);
  tl.to("#s1in", { y: -60, opacity: 0, duration: 0.18, ease: "power2.in" }, BAR - 0.2);

  /* ACT 1: the notification (a real alarm -> alert sound) */
  const A1 = 3.871;
  KZ.flash(tl, "#flash", A1, 0.7);
  tl.fromTo("#setDim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, A1);
  KZ.slam(tl, "#a1t", A1, 1.5);
  tl.fromTo("#p1Wrap", { y: 90, scale: 1.1, filter: "blur(18px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, A1 + 0.05);
  KZ.pop(tl, "#tag1", A1 + 0.35, 0.3);
  tl.fromTo("#hl1", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, A1 + b(1.5));
  tl.to("#p1Wrap", { scale: 1.04, duration: 1.3, ease: "sine.inOut" }, A1 + 0.55);
  tl.to("#a1in", { opacity: 0, x: -120, duration: 0.18, ease: "power2.in" }, 5.806 - 0.2);

  /* DEPOIS… (heartbeats, then silence) */
  const DP = 5.806;
  tl.fromTo("#dpT", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, DP);
  tl.fromTo("#ghostWrap", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 0.94, duration: 0.24, ease: "power2.out" }, DP + 0.0);
  KZ.pop(tl, "#ghostQ", DP + 0.3, 0.35);
  [0.25, 0.73, 1.2].forEach(function (o, i) {
    tl.fromTo("#ghostWrap", { scale: 0.99 + i * 0.02 }, { scale: 0.94 + i * 0.02, duration: 0.4, ease: "power2.out", immediateRender: false }, DP + o);
    KZ.shake(tl, "#dpIn", DP + o, 4 + i * 3, 0.2, 31 + i);
  });
  tl.fromTo("#hush", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 7.35);
  tl.set("#hush", { opacity: 0 }, 7.742);

  /* ACT 2: the capture — card flips in on the drop */
  const R = 7.742;
  KZ.flash(tl, "#flash", R, 0.95);
  tl.fromTo("#roomTint", { opacity: 0 }, { opacity: 0.9, duration: 0.6, ease: "power2.out" }, R);
  tl.fromTo("#rays", { opacity: 0, rotation: 0, scale: 0.7 }, { opacity: 1, rotation: 35, scale: 1, duration: 3.9, ease: "power1.out" }, R);
  tl.fromTo("#p2Wrap", { rotationY: -100, scale: 0.8, filter: "blur(10px)" }, { rotationY: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.4)" }, R);
  KZ.shake(tl, "#flipStage", R + 0.55, 6, 0.22, 91);
  KZ.slam(tl, "#a2t", R + 0.1, 1.5);
  KZ.pop(tl, "#tag2", R + 0.5, 0.3);
  (function () {
    const field = document.getElementById("sparkField");
    const cols = ["#ffd166", "#ffffff", "#ffe8a3", "#c6ff3d", "#d8b4fe"];
    const pr = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const parts = [];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement("div"); el.className = "spark";
