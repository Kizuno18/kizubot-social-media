    return '<svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><clipPath id="' + id + 'cL"><ellipse cx="235" cy="300" rx="50" ry="40"/></clipPath><clipPath id="' + id + 'cR"><ellipse cx="365" cy="300" rx="50" ry="40"/></clipPath>' +

      '<g class="pupils"><circle cx="240" cy="306" r="13" fill="#000"/><circle cx="360" cy="306" r="13" fill="#000"/></g>' +
      '<g clip-path="url(#' + id + 'cL)"><path class="lid" d="M175 110 L295 110 L295 262 Q235 282 175 262 Z" fill="' + skin + '" stroke="#000" stroke-width="7"/></g>' +
      '<g clip-path="url(#' + id + 'cR)"><path class="lid" d="M305 110 L425 110 L425 262 Q365 282 305 262 Z" fill="' + skin + '" stroke="#000" stroke-width="7"/></g>' +
      '<path d="M300 318 Q288 360 298 372 Q309 377 318 368" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<path class="mouth1" d="M266 406 Q300 432 334 406" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>' +
      '<path class="mouth2" opacity="0" d="M258 414 Q274 400 290 414 Q306 428 322 412 Q334 402 344 412" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>' +
      '<path d="M136 286 Q138 76 300 68 Q462 76 464 286" stroke="#15151a" stroke-width="24" fill="none"/>' +

      '<ellipse cx="300" cy="600" rx="380" ry="430" fill="url(#' + id + 'g)" style="mix-blend-mode:screen"/>' +
    '</svg>';
  }
  function sleeperSVG() {
    const skin = "#e9b48c";
    return '<svg viewBox="0 0 360 384" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-10 180 200)">' +

  }
  function clockSVG(id) {
    let ticks = "";
    for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180; ticks += '<line x1="' + (100 + Math.sin(a) * 72) + '" y1="' + (100 - Math.cos(a) * 72) + '" x2="' + (100 + Math.sin(a) * 84) + '" y2="' + (100 - Math.cos(a) * 84) + '" stroke="#000" stroke-width="' + (i % 3 ? 4 : 8) + '" stroke-linecap="round"/>'; }

  (function () {
    const r = KZ.rng(73), host = document.getElementById("stks");
    const spots = [[84, 930], [476, 1000], [84, 1090], [476, 1160], [84, 1250], [476, 1310]];
    spots.forEach(function (p, i) {
      const d = document.createElement("div");
      d.className = "m-stk sm"; d.id = "sm" + i; d.textContent = "SÓ MAIS UMA";
      d.style.left = p[0] + "px"; d.style.top = p[1] + "px"; d.style.fontSize = (62 + Math.round(r() * 10)) + "px"; d.style.opacity = 0;
      d.dataset.rot = Math.round((r() * 2 - 1) * 14);
      host.appendChild(d);
    });
  })();

  const tl = gsap.timeline({ paused: true });
  const D = 19.38;
  const b = KZ.beats(130);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  KZ.drift(tl, "#bg", D, 30, 40, 4.6);
  function setClock(id, h, m) { // seek-safe absolute set of the hands
    tl.set("#" + id + " .hh", { rotation: (h % 12) * 30 + m * 0.5, svgOrigin: "100 100" }, 0);
    tl.set("#" + id + " .mh", { rotation: m * 6, svgOrigin: "100 100" }, 0);
  }
  setClock("ck0", 22, 0); setClock("ckT", 22, 30); setClock("ckB", 22, 0);

  // ---------- S1 hook ----------
  tl.fromTo("#capA", { scale: 1.12 }, { scale: 1, duration: 0.22, ease: "power4.out" }, 0);
  tl.fromTo("#fr1", { rotation: 2, scale: 1.04 }, { rotation: 0.6, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo("#p0", { y: 140 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.05);
  tl.fromTo("#p0 .lid", { y: -14 }, { y: -24, duration: 0.2 }, b(1));
  KZ.punch(tl, "#ck0", b(2), 1.15);
  KZ.punch(tl, "#fr1", b(3), 1.03);
  tl.to("#s1in", { x: -1100, duration: 0.18, ease: "power3.in" }, 1.85 - 0.18);

  // ---------- S2 expectativa x realidade ----------
  const T2 = 1.85;
  tl.fromTo("#frT", { y: -700 }, { y: 0, duration: 0.32, ease: "power3.out" }, T2);
  tl.fromTo("#tagE", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, T2 + 0.2);
  tl.fromTo("#sT", { y: 0 }, { y: 6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 10 }, T2);
  tl.fromTo(["#tz1", "#tz2"], { y: 20, opacity: 0 }, { y: -20, opacity: 1, duration: 0.6, stagger: 0.2, ease: "power1.out" }, T2 + 0.3);
  tl.fromTo("#frB", { y: 700 }, { y: 0, duration: 0.32, ease: "power3.out" }, T2 + b(2));
  tl.fromTo("#tagR", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, T2 + b(2) + 0.2);
  // the clock spins 22:00 -> 05:30 while "só mais uma" piles up
  const SP = T2 + b(2.5), SPD = 3.6;
  tl.to("#ckB .mh", { rotation: 7.5 * 360, svgOrigin: "100 100", duration: SPD, ease: "power2.inOut" }, SP);
  tl.to("#ckB .hh", { rotation: 300 + 225, svgOrigin: "100 100", duration: SPD, ease: "power2.inOut" }, SP);
  tl.fromTo("#tchip", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, SP);
  [1, 2, 3].forEach(function (k) { const at = SP + SPD * [0, 0.42, 0.7, 1][k]; tl.set("#tc" + (k - 1), { opacity: 0 }, at); tl.set("#tc" + k, { opacity: 1 }, at); KZ.punch(tl, "#tchip", at, 1.15); });
  for (let i = 0; i < 6; i++) {
    const el = "#sm" + i, rot = +document.getElementById("sm" + i).dataset.rot, at = T2 + b(3 + i);
    tl.fromTo(el, { opacity: 0, scale: 2, rotation: rot * 2 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.18, ease: "power4.out" }, at);
  }
  tl.to("#pB .bags", { opacity: 0.6, duration: 0.4 }, T2 + b(4));
  tl.to("#pB .lid", { y: 20, duration: 0.4 }, T2 + b(4));
  tl.to("#pB .mouth1", { opacity: 0, duration: 0.05 }, T2 + b(5));
  tl.to("#pB .mouth2", { opacity: 1, duration: 0.05 }, T2 + b(5));
  tl.to("#pB .bags", { opacity: 1, duration: 0.4 }, T2 + b(7));
  tl.to("#pB .veins", { opacity: 1, duration: 0.3 }, T2 + b(7));
  tl.to("#pB .lid", { y: 42, duration: 0.4 }, T2 + b(8));
  // 06:00 alarm -> zombie
  tl.fromTo("#alarm", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, T2 + b(10));
  KZ.shake(tl, "#alarm", T2 + b(10) + 0.1, 16, 0.7, 13);
  tl.fromTo("#zombie", { opacity: 0, scale: 2.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.25, ease: "power4.out" }, T2 + b(11));
  KZ.shake(tl, "#s2in", T2 + b(11) + 0.05, 12, 0.3, 5);
  tl.to("#s2in", { scale: 0.85, opacity: 0, duration: 0.16, ease: "power2.in" }, 7.38 - 0.16);

  // ---------- S3 OU... ----------
  const T3 = 7.38;
  tl.fromTo("#ou1", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, T3);
  tl.fromTo("#ou2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T3 + b(1));
  tl.fromTo("#ou3", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T3 + b(2));
  tl.to("#s3in", { scale: 1.06, duration: 1.6, ease: "sine.in" }, T3);

  // ---------- S4 você x seu char (the drop) ----------
  const T4 = 9.23;
  KZ.flash(tl, "#flash", T4, 0.8);
  tl.fromTo("#frV", { y: -600 }, { y: 0, duration: 0.3, ease: "power3.out" }, T4);
  tl.fromTo("#tagV", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, T4 + 0.15);
  tl.fromTo("#frC", { y: 700 }, { y: 0, duration: 0.3, ease: "power3.out" }, T4 + 0.1);
  tl.fromTo("#tagC", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, T4 + 0.3);
  tl.fromTo("#sV", { y: 0 }, { y: 6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 6 }, T4);
  tl.fromTo(["#vz1", "#vz2"], { y: 20, opacity: 0 }, { y: -20, opacity: 1, duration: 0.6, stagger: 0.2, ease: "power1.out" }, T4 + 0.3);
  tl.fromTo("#pchar", { x: 0 }, { x: 760, duration: 3.3, ease: "none" }, T4 + 0.2);
  tl.fromTo("#pchar", { y: 0 }, { y: -10, duration: 0.15, ease: "steps(1)", yoyo: true, repeat: 21 }, T4 + 0.2);
  tl.fromTo("#lt1", { y: 20, opacity: 0 }, { y: -40, opacity: 1, duration: 0.4, ease: "power2.out" }, T4 + 0.8);
  tl.to("#lt1", { opacity: 0, duration: 0.2 }, T4 + 1.4);
  tl.fromTo("#lt2", { y: 20, opacity: 0 }, { y: -40, opacity: 1, duration: 0.4, ease: "power2.out" }, T4 + 2.1);
  tl.to("#lt2", { opacity: 0, duration: 0.2 }, T4 + 2.7);
  tl.fromTo("#kb", { x: -400 }, { x: 0, duration: 0.35, ease: "power3.out" }, T4 + 0.6);
  KZ.pop(tl, "#cp1", T4 + b(4));
  KZ.pop(tl, "#cp2", T4 + b(5));
  tl.to("#s4in", { x: -1100, duration: 0.18, ease: "power3.in" }, 12.92 - 0.18);

  // ---------- S5 the real print ----------
  const T5 = 12.92;
  KZ.slam(tl, "#capN", T5, 1.5);
  tl.fromTo("#photo", { y: 700, rotation: -12 }, { y: 0, rotation: -4, duration: 0.5, ease: "back.out(1.3)" }, T5 + 0.3);
  tl.fromTo("#card1", { x: 900, rotation: 8 }, { x: 0, rotation: 1.5, duration: 0.4, ease: "power3.out" }, T5 + 1.2);
  tl.fromTo("#tag1", { scale: 0.3, opacity: 0, rotation: 3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)", rotation: 3 }, T5 + 0.65);
  tl.to("#s5in", { opacity: 0, scale: 0.94, duration: 0.18, ease: "power2.in" }, 16.62 - 0.18);

  // ---------- S6 end card ----------
  const T6 = 16.62;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T6 + 0.04);
  KZ.eyePulse(tl, "#eye2", T6 + 0.13, 3);
  KZ.rise(tl, "#endUrl", T6 + 0.45, 0.35, 30);
  KZ.rise(tl, "#endAsk", T6 + 0.8, 0.4, 40);
  tl.to("#endLogo", { scale: 1.04, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, T6 + 0.6);
  tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.in" }, D - 0.34);

  window.__timelines["main"] = tl;
</script>
