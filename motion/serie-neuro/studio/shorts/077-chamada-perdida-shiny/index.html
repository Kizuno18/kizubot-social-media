<head>

<style>
  /* ===== F08 Ligação Recebida — ep. 077: missed call (loss red) -> KizuBot (gain violet) ===== */
  :root {

  }
  #root { background: #070305; }
  #wallLoss { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(95% 55% at 50% 32%, #3d0a14 0%, #14060a 58%, #070305 100%); }
  #wallGain { position: absolute; inset: 0; overflow: hidden; opacity: 0; background: radial-gradient(95% 55% at 50% 36%, #3b1470 0%, #0f0819 60%, #07050d 100%); }

  #bk1 { width: 900px; height: 900px; left: -300px; top: 900px; background: radial-gradient(circle, rgba(239, 68, 68, 0.28) 0%, rgba(239, 68, 68, 0) 62%); }
  #bk2 { width: 700px; height: 700px; right: -260px; top: -120px; background: radial-gradient(circle, rgba(244, 63, 94, 0.3) 0%, rgba(244, 63, 94, 0) 62%); }

  #bk4 { width: 900px; height: 900px; right: -380px; top: 900px; background: radial-gradient(circle, rgba(198, 255, 61, 0.14) 0%, rgba(198, 255, 61, 0) 62%); }
  .vig { position: absolute; inset: 0; background: radial-gradient(120% 75% at 50% 45%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.6) 100%); }

  /* S1 missed-call notification (generic) */
  #mc { position: absolute; left: 110px; top: 292px; width: 760px; height: 612px; border-radius: 54px; background: rgba(30, 12, 17, 0.88);
    border: 2px solid rgba(248, 113, 113, 0.38); box-shadow: 0 40px 140px rgba(239, 68, 68, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.07); }

  /* big kinetic lines */

  /* S3 despawn tile */
  #tile { position: absolute; left: 240px; top: 430px; width: 600px; height: 600px; border-radius: 46px; overflow: hidden; background-color: #151017;
    background-image: linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
    background-size: 75px 75px; border: 2px solid rgba(255, 255, 255, 0.09); box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5); }
  #tileChip { position: absolute; left: 30px; top: 28px; padding: 10px 22px; border-radius: 999px; background: rgba(251, 191, 36, 0.16); border: 2px solid rgba(251, 191, 36, 0.6);

  /* S4 turn */
  #avT { position: absolute; left: 450px; top: 300px; width: 180px; height: 180px; }
  #avTc { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 38%, #3a1d6b 0%, #1a1030 70%); border: 5px solid rgba(255, 255, 255, 0.22); box-shadow: 0 20px 70px rgba(124, 58, 237, 0.6); }
  #avTc img { position: absolute; left: 0; top: 17px; width: 180px; }
  #avTe { position: absolute; left: 68px; top: 55px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  .sonar { position: absolute; inset: 0; border-radius: 50%; border: 5px solid rgba(198, 255, 61, 0.7); opacity: 0; }
  #turn { top: 520px; font-size: 112px; }

  /* S5 real alarm print */
  .ptag { position: absolute; left: 0; right: 0; top: 262px; text-align: center; }
  .ptag span { display: inline-block; padding: 9px 22px; border-radius: 999px; background: rgba(8, 6, 16, 0.85); border: 2px solid var(--c-lav);
    font: 700 30px/1 var(--f-ui); letter-spacing: 0.04em; color: var(--c-lav); text-transform: uppercase; }
  .alab { position: absolute; left: 160px; font: 800 76px/1 var(--f-cap); letter-spacing: -0.01em; }
  #labA { top: 330px; color: var(--c-gold); }

  .bub { position: absolute; left: 160px; width: 760px; overflow: hidden; border-radius: 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); background: #1d1f22; }

  #bub2 { top: 702px; height: 147px; }
  .bub img { position: absolute; left: 0; width: 760px; display: block; }
  #bub1 img { top: -17px; }
  #bub2 img { top: -163px; }
  .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 30px var(--f-ui); color: #777; background: repeating-linear-gradient(45deg, #222 0 20px, #2a2a2a 20px 40px); }
  .tsbox { position: absolute; width: 112px; height: 50px; border-radius: 14px; border: 4px solid var(--c-gold); box-shadow: 0 0 24px rgba(251, 191, 36, 0.6); opacity: 0; }
  #sameChip { position: absolute; left: 0; right: 0; top: 900px; text-align: center; }
  #sameChip span { display: inline-block; padding: 18px 38px; border-radius: 999px; background: var(--c-gold); color: #1c1402; font: 800 58px/1 var(--f-cap); }

  /* S6 payoff */
  #pay { top: 540px; font-size: 118px; }
  #waChip { position: absolute; left: 0; right: 0; top: 860px; text-align: center; }
  #waChip span { display: inline-flex; align-items: center; gap: 16px; padding: 18px 34px; border-radius: 999px; background: rgba(74, 222, 128, 0.14); border: 3px solid rgba(74, 222, 128, 0.75);
    font: 700 46px/1 var(--f-ui); color: #dcfce7; }

  /* end card */
  #endWrap { position: absolute; inset: 0; }
  #logoBox { position: absolute; left: 240px; top: 360px; width: 600px; }
  #logoBox img { display: block; width: 600px; }
  #eyeEnd { position: absolute; left: 186px; top: 4px; width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #endUrl { position: absolute; left: 0; right: 0; top: 936px; text-align: center; font: 700 66px/1 var(--f-ui); color: var(--c-ink); }
  #endAsk { position: absolute; left: 110px; right: 110px; top: 1050px; text-align: center; font: 800 76px/1.1 var(--f-cap); color: var(--c-ink); }
  #endAsk .ln { display: block; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="17.31" data-fps="30">
  <div id="wallLoss"><div class="bok" id="bk1"></div><div class="bok" id="bk2"></div><div class="vig"></div></div>
  <div id="wallGain"><div class="bok" id="bk3"></div><div class="bok" id="bk4"></div><div class="vig"></div></div>

  <!-- S1 hook: missed call from SHINY (0 - 2.769) -->
  <section id="s1" class="clip" data-start="0" data-duration="2.769">
    <div id="s1in" style="position:absolute; inset:0">
      <div id="mc">
        <div id="mcHead">
          <div id="mcIco"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/><path d="M15 3l6 6M21 3l-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>
          <div id="mcAgo">agora</div>
        </div>
        <div id="mcName">SHINY</div>
        <div id="mcL1">1 chamada</div>
        <div id="mcL2">perdida.</div>
        <svg class="tw" id="tw1" style="left:64px; top:150px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fde68a"/></svg>
        <svg class="tw" id="tw2" style="left:650px; top:120px; width:40px; height:40px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fde68a"/></svg>
        <svg class="tw" id="tw3" style="left:676px; top:300px; width:30px; height:30px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fde68a"/></svg>
      </div>
    </div>
  </section>

  <!-- S2 "Sem alarme, é assim:" (2.769 - 4.615) -->
  <section id="s2" class="clip" data-start="2.769" data-duration="1.846">
    <div class="big" id="sem" style="top:600px"><div class="ln"><span style="color:var(--c-red)">Sem alarme,</span></div><div class="ln">é assim:</div></div>
  </section>

  <!-- S3 the shiny despawns (4.615 - 7.385) -->
  <section id="s3" class="clip" data-start="4.615" data-duration="2.77">
    <div id="s3in" style="position:absolute; inset:0">
      <div id="tile">
        <div id="tileChip">shiny</div>
        <svg id="cd" viewBox="0 0 480 480"><circle cx="240" cy="240" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/><circle id="cdArc" cx="240" cy="240" r="200" fill="none" stroke="#ef4444" stroke-width="14" stroke-linecap="round" stroke-dasharray="1256.6" stroke-dashoffset="0" transform="rotate(-90 240 240)"/></svg>
        <svg id="star" viewBox="0 0 24 24"><defs><radialGradient id="sg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fffbe6"/><stop offset="0.5" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></radialGradient></defs><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="url(#sg)"/></svg>
        <div id="ghost"></div>
        <div id="puffs"></div>
      </div>
      <div id="late"><div class="ln">…tarde</div><div class="ln">demais.</div></div>
    </div>
  </section>

  <!-- S4 turn (7.385 - 9.231) -->
  <section id="s4" class="clip" data-start="7.385" data-duration="1.846">
    <div id="s4in" style="position:absolute; inset:0">
      <div id="avT"><div class="sonar" id="so1"></div><div class="sonar" id="so2"></div><div class="sonar" id="so3"></div><div id="avTc"><img src="kit/img/brand/kizubot-head.png" alt="" /><div id="avTe"></div></div></div>
      <div class="big" id="turn"><div class="ln"><span style="color:var(--c-lav)">Com KizuBot,</span></div><div class="ln">o zap avisa</div><div class="ln"><span style="color:var(--c-lime)">na hora:</span></div></div>
    </div>
  </section>

  <!-- S5 real alarm (9.231 - 12.462) -->
  <section id="s5" class="clip" data-start="9.231" data-duration="3.231">
    <div id="s5in" style="position:absolute; inset:0">
      <div class="ptag" id="tag5"><span>print real de cliente</span></div>
      <div class="alab" id="labA">SHINY DETECTADO</div>
      <div class="bub" id="bub1"><img src="kit/img/prints/shiny-cubone--alarm.png" alt="" /></div>
      <div class="alab" id="labB">CAPTURADO</div>
      <div class="bub" id="bub2"><img src="kit/img/prints/shiny-cubone--alarm.png" alt="" /></div>
      <div class="tsbox" id="ts1" style="left:774px; top:508px"></div>
      <div class="tsbox" id="ts2" style="left:774px; top:791px"></div>
      <div id="sameChip"><span>16:42 → 16:42</span></div>
    </div>
  </section>

  <!-- S6 payoff (12.462 - 14.308) -->
  <section id="s6" class="clip" data-start="12.462" data-duration="1.846">
    <div id="s6in" style="position:absolute; inset:0">
      <div class="big" id="pay"><div class="ln">Nem precisou</div><div class="ln"><span style="color:var(--c-lime)">atender.</span></div></div>
      <div id="waChip"><span><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>alarme no WhatsApp</span></div>
    </div>
  </section>

  <!-- S7 end card (14.308 - 17.31) -->
  <section id="s7" class="clip" data-start="14.308" data-duration="3.002">
    <div id="endWrap">
      <div id="logoBox"><img id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" /><div id="eyeEnd"></div></div>
      <div id="endUrl">kizubot.com</div>
      <div id="endAsk"><div class="ln">Já perdeu algum</div><div class="ln"><span style="color:var(--c-gold)">shiny</span> assim?</div></div>
    </div>

  <div id="flash"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 17.31;
  const b = KZ.beats(130);            // beat 0.4615 s, bar 1.846 s
  const T_MISS = b(4), T_S2 = b(6), T_S3 = b(10), T_POOF = b(13.5), T_LATE = b(14), T_S4 = b(16);
  const T_DROP = b(20), T_B2 = b(23), T_HL = b(25), T_S6 = b(27), T_EC = b(31);

  function splitCap(capEl) {
    const words = [];
    capEl.querySelectorAll(".ln").forEach(function (ln) {
      const nodes = Array.prototype.slice.call(ln.childNodes);
      ln.textContent = "";
      nodes.forEach(function (nd) {
        if (nd.nodeType === 3) {
          nd.textContent.split(/(\s+)/).forEach(function (tok) {
            if (!tok) return;
            if (/^\s+$/.test(tok)) { ln.appendChild(document.createTextNode(" ")); return; }
            const s = document.createElement("span"); s.className = "w"; s.textContent = tok; ln.appendChild(s); words.push(s);
          });
        } else { nd.classList.add("w"); ln.appendChild(nd); words.push(nd); }
      });
    });
    return words;
  }
  function lines(sel, times, style) {
    const lns = document.querySelectorAll(sel + " .ln");
    lns.forEach(function (ln, i) {
      if (style === "slam") tl.fromTo(ln, { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, times[i]);
      else tl.fromTo(ln, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(1.8)" }, times[i]);
    });
  }

  // ambient drift
  KZ.drift(tl, "#bk1", D, 50, -40, 5.5);
  KZ.drift(tl, "#bk2", D, -40, 50, 6.5);
  KZ.drift(tl, "#bk3", D, 60, 40, 6.0);
  KZ.drift(tl, "#bk4", D, -50, -40, 5.0);

  // ---------- S1 hook (readable from frame 0) ----------
  tl.fromTo("#mc", { y: -60, scale: 1.04 }, { y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
  KZ.shake(tl, "#s1in", 0.02, 7, 0.4, 3);
  KZ.shake(tl, "#s1in", b(2), 7, 0.4, 4);
  ["#tw1", "#tw2", "#tw3"].forEach(function (t, i) {
    tl.fromTo(t, { scale: 0.2, rotation: 0, opacity: 0 }, { scale: 1, rotation: 90, opacity: 1, duration: 0.5, ease: "back.out(2)", yoyo: true, repeat: 3 }, 0.1 + i * 0.22);
  });
  tl.fromTo("#mcIco", { scale: 1 }, { scale: 1.12, duration: 0.23, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
  // missed: buzz + red pulse on "perdida."
  KZ.flash(tl, "#flash", T_MISS, 0.35, "#ef4444");
  KZ.shake(tl, "#mc", T_MISS, 16, 0.35, 9);
  tl.fromTo("#mcL2", { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power3.out", immediateRender: false }, T_MISS);
  tl.to("#mcL2", { scale: 1, duration: 0.4, ease: "power2.out" }, T_MISS + 0.12);
  tl.to("#mcName", { opacity: 0.45, duration: 0.5, ease: "power1.inOut" }, T_MISS + 0.2);
  tl.to("#s1in", { y: -80, opacity: 0, duration: 0.18, ease: "power2.in" }, T_S2 - 0.18);

  // ---------- S2 ----------
  lines("#sem", [T_S2, T_S2 + b(1)], "slam");
  tl.to("#sem", { opacity: 0, scale: 0.92, duration: 0.16, ease: "power2.in" }, T_S3 - 0.16);

  // ---------- S3 despawn while the clock runs ----------
  tl.fromTo("#tile", { scale: 0.85, opacity: 0, y: 60 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, T_S3);
  tl.fromTo("#star", { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, T_S3 + 0.1);
  tl.to("#star", { rotation: 30, duration: 1.4, ease: "none" }, T_S3 + 0.55);
  tl.fromTo("#cdArc", { strokeDashoffset: 0 }, { strokeDashoffset: 1256.6, duration: T_POOF - (T_S3 + 0.25), ease: "none" }, T_S3 + 0.25);
  tl.to("#star", { scale: 0, opacity: 0, duration: 0.22, ease: "power3.in" }, T_POOF);
  tl.fromTo("#ghost", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, T_POOF + 0.1);
  (function () {
    const host = document.getElementById("puffs"); const r = KZ.rng(77); const P = [];
    for (let i = 0; i < 16; i++) { const e = document.createElement("i"); host.appendChild(e); const a = r() * Math.PI * 2, sp = 160 + r() * 260; P.push({ el: e, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp }); }
    const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: 0.8, duration: 0.8, ease: "none", onUpdate: function () {
      P.forEach(function (p) {
        const t = o.t, x = 289 + p.vx * t, y = 289 + p.vy * t + 120 * t * t;
        p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + (1 - t).toFixed(2) + ")";
        p.el.style.opacity = t <= 0 ? 0 : Math.max(0, 1 - t / 0.75).toFixed(3);
      });
    } }, T_POOF);
  })();
  tl.to("#tile", { opacity: 0.32, scale: 0.96, duration: 0.25, ease: "power2.out" }, T_LATE);
  lines("#late", [T_LATE, T_LATE + 0.16], "slam");
  KZ.shake(tl, "#late", T_LATE + 0.18, 10, 0.25, 6);
  tl.to("#s3in", { opacity: 0, duration: 0.15, ease: "power2.in" }, T_S4 - 0.15);

  // ---------- S4 turn: loss red -> brand violet ----------
  tl.fromTo("#wallGain", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, T_S4);
  tl.fromTo("#avT", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, T_S4);
  KZ.eyePulse(tl, "#avTe", T_S4 + 0.2, 3);
  ["#so1", "#so2", "#so3"].forEach(function (s, i) {
    tl.fromTo(s, { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out" }, T_S4 + 0.3 + i * 0.42);
  });

  tl.to(["#bub1", "#bub2"], { scale: 1.015, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_B2 + 0.5);
  tl.to("#s5in", { opacity: 0, y: -50, duration: 0.18, ease: "power2.in" }, T_S6 - 0.18);
