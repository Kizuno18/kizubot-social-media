<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>079 Videochamada: sua hunt</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F08 Ligação Recebida — ep. 079: video call with your hunt (charcoal + teal), funk ===== */
  :root {
    --c-ink: #f5f7fa; --c-sub: #a3adbd; --c-teal: #2dd4bf; --c-teal-2: #14b8a6; --c-lime: #c6ff3d; --c-red: #ef4444; --c-lav: #d8b4fe;
    --f-ui: "Sora", "Inter", sans-serif; --f-cap: "Bricolage Grotesque", "Inter", sans-serif;
  }
  #root { background: #06080b; }
  #base { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 40%, #0f2a2c 0%, #070b0e 65%, #040506 100%); }
  #vBgWrap { position: absolute; inset: 0; overflow: hidden; }
  #vBg { position: absolute; left: -80px; top: -80px; width: 1240px; height: 2080px; object-fit: cover; filter: blur(34px) brightness(0.42) saturate(1.2); }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 6, 8, 0.55) 0%, rgba(4, 6, 8, 0.15) 40%, rgba(4, 6, 8, 0.7) 100%); }
  #vio { position: absolute; inset: 0; opacity: 0; background: radial-gradient(90% 55% at 50% 40%, #3b1470 0%, #0f0819 62%, #06040c 100%); }

  /* call window (untimed wrapper; the timed media goes inside) */
  #vwin { position: absolute; left: 60px; top: 540px; width: 960px; height: 703px; border-radius: 44px; overflow: hidden; background: #111;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 255, 255, 0.08); }
  #vFront { position: absolute; left: 0; top: 0; width: 960px; height: 703px; object-fit: cover; transform-origin: 54% 60%; }
  .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 36px var(--f-ui); color: #6b7280; background: repeating-linear-gradient(45deg, #1b2024 0 22px, #22282d 22px 44px); }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); }
  #lt { position: absolute; left: 28px; bottom: 28px; padding: 10px 20px; border-radius: 14px; background: rgba(0, 0, 0, 0.62); border: 2px solid rgba(45, 212, 191, 0.6);
    font: 700 30px/1 var(--f-ui); color: #ccfbf1; opacity: 0; }
  #focus { position: absolute; left: 380px; top: 362px; width: 220px; height: 220px; border-radius: 50%; border: 6px solid var(--c-teal); box-shadow: 0 0 40px rgba(45, 212, 191, 0.6); opacity: 0; }

  /* incoming */
  #h1 { position: absolute; left: 0; right: 0; top: 246px; text-align: center; font: 800 98px/1.04 var(--f-cap); color: var(--c-teal); letter-spacing: -0.01em; }
  #h2 { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font: 800 156px/1 var(--f-cap); color: var(--c-ink); letter-spacing: -0.02em; }
  #callAv { position: absolute; left: 450px; top: 801px; width: 180px; height: 180px; }
  .rip { position: absolute; inset: 0; border-radius: 50%; border: 5px solid rgba(45, 212, 191, 0.8); }
  #avc { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 38%, #3a1d6b 0%, #1a1030 70%); border: 5px solid rgba(255, 255, 255, 0.25); }
  #avc img { position: absolute; left: 0; top: 17px; width: 180px; }
  #avcEye { position: absolute; left: 68px; top: 55px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #slide { position: absolute; left: 160px; top: 1272px; width: 700px; height: 124px; border-radius: 62px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.16); overflow: hidden; }
  #slideTx { position: absolute; left: 130px; right: 30px; top: 0; height: 120px; display: flex; align-items: center; justify-content: center; font: 700 36px/1 var(--f-ui); color: #cbd5e1; }
  #knob { position: absolute; left: 8px; top: 6px; width: 108px; height: 108px; border-radius: 50%; background: #22c55e; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.5); }
  #knob svg { width: 56px; height: 56px; }

  /* in-call chrome */
  #top { position: absolute; left: 90px; top: 238px; height: 80px; display: flex; align-items: center; gap: 20px; opacity: 0; }
  #live { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; background: var(--c-red); font: 800 30px/1 var(--f-ui); color: #fff; letter-spacing: 0.06em; }
  #live i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  #topName { font: 800 54px/1 var(--f-cap); color: var(--c-ink); }
  #timer { font: 700 38px/1 var(--f-ui); color: var(--c-sub); font-variant-numeric: tabular-nums; }
  #pip { position: absolute; left: 768px; top: 388px; width: 210px; height: 270px; border-radius: 30px; overflow: hidden; opacity: 0;
    background: radial-gradient(circle at 50% 35%, #3a1d6b 0%, #170c2c 80%); border: 4px solid rgba(255, 255, 255, 0.85); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55); }
  #pip img { position: absolute; left: -10px; top: 40px; width: 230px; }
  #pipEye { position: absolute; left: 77px; top: 78px; width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }

  .cap { position: absolute; left: 110px; right: 190px; top: 1100px; text-align: center; font: 800 72px/1.08 var(--f-cap); color: var(--c-ink); letter-spacing: -0.015em; }
  .cap .ln { display: block; }
  .cap .w { display: inline-block; }
  #claim { position: absolute; left: 110px; right: 190px; top: 1110px; text-align: center; opacity: 0; }
  #claim span { display: inline-flex; align-items: center; gap: 16px; padding: 22px 36px; border-radius: 999px; background: var(--c-lime); color: #172005; font: 800 60px/1 var(--f-cap); }

  /* end card */
  #endWrap { position: absolute; inset: 0; }
  #logoBox { position: absolute; left: 240px; top: 360px; width: 600px; }
  #logoBox img { display: block; width: 600px; }
  #eyeEnd { position: absolute; left: 186px; top: 4px; width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #endUrl { position: absolute; left: 0; right: 0; top: 938px; text-align: center; font: 700 66px/1 var(--f-ui); color: var(--c-ink); }
  #endAsk { position: absolute; left: 110px; right: 110px; top: 1048px; text-align: center; font: 800 64px/1.12 var(--f-cap); color: var(--c-ink); }
  #endAsk .ln { display: block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="13.15" data-fps="30">
  <div id="base"></div>
  <div id="vBgWrap"><video id="vBg" src="kit/video/rypherior.mp4" muted playsinline data-start="0" data-duration="10.154" data-media-start="6.05"></video></div>
  <div id="shade"></div>
  <div id="vio"></div>

  <!-- call window: untimed wrapper, timed media inside -->
  <div id="vwin"><video id="vFront" src="kit/video/rypherior.mp4" muted playsinline data-start="0" data-duration="10.154" data-media-start="6"></video><div id="dim"></div><div id="focus"></div><div id="lt">gameplay real do KizuBot</div></div>

  <!-- in-call chrome (untimed) -->
  <div id="top"><div id="live"><i></i>AO VIVO</div><div id="topName">Sua hunt</div><div id="timer">00:00</div></div>
  <div id="pip"><img src="kit/img/brand/kizubot-head.png" alt="" /><div id="pipEye"></div></div>

  <!-- S1 incoming video call (0 - 1.846) -->
  <section id="s1" class="clip" data-start="0" data-duration="1.846">
    <div id="s1in" style="position:absolute; inset:0">
      <div id="h1">VIDEOCHAMADA:</div>
      <div id="h2">SUA HUNT.</div>
      <div id="callAv"><div class="rip" id="rp1"></div><div class="rip" id="rp2"></div><div id="avc"><img src="kit/img/brand/kizubot-head.png" alt="" /><div id="avcEye"></div></div></div>
      <div id="slide"><div id="slideTx">deslize pra atender</div><div id="knob"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h9A1.5 1.5 0 0 1 15 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 3 16.5z"/><path d="M16 10l5-3v10l-5-3z"/></svg></div></div>
    </div>
  </section>

  <!-- S2 captions (1.846 - 10.154) -->
  <section id="s2" class="clip" data-start="1.846" data-duration="8.308">
    <div class="cap" id="q1"><div class="ln">Quer ver</div><div class="ln"><span style="color:var(--c-teal)">ao vivo?</span></div></div>
    <div class="cap" id="q2"><div class="ln">Dá pra acompanhar</div><div class="ln">pelo <span style="color:var(--c-lime)">celular.</span></div></div>
    <div class="cap" id="q3"><div class="ln">Olha ele lá.</div></div>
    <div id="claim"><span>acesso pelo celular ✓</span></div>
  </section>

  <!-- S3 end card (10.154 - 13.15) -->
  <section id="s3" class="clip" data-start="10.154" data-duration="2.996">
    <div id="endWrap">
      <div id="logoBox"><img id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" /><div id="eyeEnd"></div></div>
      <div id="endUrl">kizubot.com</div>
      <div id="endAsk"><div class="ln">Você ficaria</div><div class="ln">assistindo a <span style="color:var(--c-teal)">hunt?</span></div></div>
    </div>
  </section>

  <div id="flash"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 13.15;
  const b = KZ.beats(130);               // beat 0.4615 s, bar 1.846 s
  const T_ANS = b(4), T_Q1 = b(5), T_Q2 = b(9), T_LOOK = b(14), T_CLAIM = b(18), T_EC = b(22);

  function splitCap(capEl) {
    const words = [];
    capEl.querySelectorAll(".ln").forEach(function (ln) {
      const nodes = Array.prototype.slice.call(ln.childNodes); ln.textContent = "";
      nodes.forEach(function (nd) {
        if (nd.nodeType === 3) {
          nd.textContent.split(/(\s+)/).forEach(function (tok) {
            if (!tok) return;
            if (/^\s+$/.test(tok)) { ln.appendChild(document.createTextNode(" ")); return; }
            const s = document.createElement("span"); s.className = "w"; s.textContent = tok; ln.appendChild(s); words.push(s);
          });
        } else { nd.classList.add("w"); ln.appendChild(nd); words.push(nd); }
      });
    });
    return words;
  }
  function say(sel, at, gap, exitAt) {
    splitCap(document.querySelector(sel)).forEach(function (w, i) {
      tl.fromTo(w, { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: "back.out(2)" }, at + i * gap);
    });
    if (exitAt) tl.to(sel, { opacity: 0, y: -36, duration: 0.16, ease: "power2.in" }, exitAt);
  }

  // ---------- S1 incoming (frame 0 readable) ----------
  tl.fromTo("#h2", { scale: 1.08 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);
  tl.fromTo("#vwin", { scale: 0.96 }, { scale: 1, duration: 1.6, ease: "sine.out" }, 0);
  [0, 2].forEach(function (k, n) {
    ["#rp1", "#rp2"].forEach(function (r, i) {
      tl.fromTo(r, { scale: 1, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: n === 0 }, b(k) + i * 0.16);
    });
    KZ.eyePulse(tl, "#avcEye", b(k) + 0.05, 1);
    KZ.shake(tl, "#callAv", b(k), 6, 0.35, 40 + k);
  });
  tl.fromTo("#slideTx", { opacity: 0.55 }, { opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.1);
  tl.fromTo("#knob", { x: 0 }, { x: 576, duration: 0.42, ease: "power3.inOut" }, T_ANS - 0.5);
  tl.to(["#h1", "#h2"], { y: -60, opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.03 }, T_ANS - 0.2);
  tl.to(["#callAv", "#slide"], { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, T_ANS - 0.16);

  // ---------- answer: window snaps into the call layout, video lights up ----------
  tl.to("#vwin", { y: -200, duration: 0.42, ease: "expo.inOut" }, T_ANS - 0.12);
  tl.fromTo("#dim", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, T_ANS);
  KZ.flash(tl, "#flash", T_ANS, 0.35);
  tl.fromTo("#top", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T_ANS + 0.1);
  tl.fromTo("#pip", { opacity: 0, scale: 0.6, x: 60 }, { opacity: 1, scale: 1, x: 0, duration: 0.42, ease: "back.out(1.8)" }, T_ANS + 0.2);
  KZ.eyePulse(tl, "#pipEye", T_ANS + 0.5, 2);
  tl.fromTo("#lt", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, T_Q1 + 0.3);
  tl.fromTo("#live i", { opacity: 1 }, { opacity: 0.2, duration: 0.46, ease: "sine.inOut", yoyo: true, repeat: 17 }, T_ANS);

  // ---------- captions ----------
  say("#q1", T_Q1, 0.14, T_Q2 - 0.16);
  say("#q2", T_Q2, 0.12, T_LOOK - 0.16);
  // the drop: push into the action
  tl.to("#vFront", { scale: 1.55, duration: 0.5, ease: "expo.out" }, T_LOOK);
  tl.fromTo("#focus", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, T_LOOK + 0.12);
  tl.to("#focus", { scale: 1.08, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, T_LOOK + 0.5);
  say("#q3", T_LOOK, 0.12, T_CLAIM - 0.16);
  KZ.flash(tl, "#flash", T_LOOK, 0.4);
  tl.to("#focus", { opacity: 0, duration: 0.2 }, T_CLAIM - 0.1);
  tl.to("#vFront", { scale: 1.12, duration: 0.6, ease: "power3.inOut" }, T_CLAIM - 0.1);
  tl.fromTo("#claim", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, T_CLAIM);
  tl.to("#claim", { scale: 1.04, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_CLAIM + 0.6);

  // ---------- hand-off: the robot self-view becomes the end card ----------
  tl.to(["#top", "#claim"], { opacity: 0, duration: 0.2, ease: "power2.in" }, T_EC - 0.24);
  tl.to("#vwin", { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, T_EC - 0.3);
  tl.to("#pip", { x: -228, y: 120, scale: 1.9, opacity: 0, duration: 0.42, ease: "power3.in" }, T_EC - 0.38);
  tl.to("#vio", { opacity: 1, duration: 0.4, ease: "power2.out" }, T_EC - 0.2);
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T_EC);
  KZ.eyePulse(tl, "#eyeEnd", T_EC + 0.1, 3);
  KZ.rise(tl, "#endUrl", T_EC + 0.4, 0.35, 30);
  KZ.rise(tl, "#endAsk", T_EC + 0.75, 0.4, 30);
  tl.to("#logoBox", { y: -14, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_EC + 0.6);
  // loop seam: back to the dark incoming-call world
  tl.to("#endWrap", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.34);
  tl.to("#vio", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.34);

  // call timer (pure function of time)
  (function () {
    const el = document.getElementById("timer"); const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const e = Math.max(0, Math.min(o.t, T_EC) - T_ANS);
      el.textContent = "00:" + String(Math.floor(e)).padStart(2, "0");
    } }, 0);
  })();

  window.__timelines["main"] = tl;
</script>
</body>
</html>
