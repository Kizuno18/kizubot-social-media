<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>080 Despertador: 03:00 SHINY</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F08 Ligação Recebida — ep. 080: 3 a.m. alarm clock (night navy + amber), trap ===== */
  :root {
    --c-ink: #f8f6ff; --c-sub: #9fa6c3; --c-amb: #fbbf24; --c-amb-2: #f59e0b; --c-lime: #c6ff3d; --c-lav: #d8b4fe;
    --f-ui: "Sora", "Inter", sans-serif; --f-cap: "Bricolage Grotesque", "Inter", sans-serif;
  }
  #root { background: #04060f; }
  #night { position: absolute; inset: 0; background: linear-gradient(180deg, #08122b 0%, #060a1a 50%, #03040b 100%); }
  #amb { position: absolute; left: -160px; top: 120px; width: 1400px; height: 1100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(245, 158, 11, 0.32), rgba(245, 158, 11, 0)); }
  #vio { position: absolute; inset: 0; opacity: 0; background: radial-gradient(90% 55% at 50% 40%, #3b1470 0%, #0f0819 62%, #06040c 100%); }
  .star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #dbe4ff; }
  .aring { position: absolute; left: 140px; top: 120px; width: 800px; height: 800px; border-radius: 50%; border: 4px solid rgba(251, 191, 36, 0.55); opacity: 0; }

  .lbl { font: 700 30px/1 var(--f-ui); letter-spacing: 0.26em; text-transform: uppercase; color: #fcd9a0; }
  #alLbl { position: absolute; left: 0; right: 0; top: 262px; text-align: center; }
  #time { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 400 240px/1 var(--f-ui); color: var(--c-ink); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  #time .col { display: inline-block; }
  #alName { position: absolute; left: 0; right: 0; top: 572px; text-align: center; font: 800 160px/1 var(--f-cap); letter-spacing: -0.02em;
    background: linear-gradient(180deg, #fff6cf 0%, #fbbf24 55%, #d97706 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 34px rgba(251, 191, 36, 0.5)); }
  .tw { position: absolute; }
  #snz { position: absolute; left: 270px; top: 1040px; width: 540px; height: 150px; border-radius: 75px; background: linear-gradient(180deg, #fcd34d, #f59e0b);
    display: flex; align-items: center; justify-content: center; gap: 18px; font: 800 70px/1 var(--f-cap); color: #2a1702; box-shadow: 0 20px 60px rgba(245, 158, 11, 0.45), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
  #stp { position: absolute; left: 360px; top: 1222px; width: 360px; height: 116px; border-radius: 58px; border: 3px solid rgba(255, 255, 255, 0.35);
    display: flex; align-items: center; justify-content: center; font: 700 52px/1 var(--f-ui); color: var(--c-ink); }

  /* S2 snooze tease */
  #snzQ { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font: 800 176px/1 var(--f-cap); color: var(--c-amb); letter-spacing: -0.02em; text-shadow: 0 0 60px rgba(251, 191, 36, 0.35); }
  #snz2 { position: absolute; left: 200px; top: 860px; width: 680px; height: 180px; border-radius: 90px; background: linear-gradient(180deg, #fcd34d, #f59e0b);
    display: flex; align-items: center; justify-content: center; gap: 22px; font: 800 84px/1 var(--f-cap); color: #2a1702; box-shadow: 0 24px 70px rgba(245, 158, 11, 0.5), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
  #snzRip { position: absolute; left: 200px; top: 860px; width: 680px; height: 180px; border-radius: 90px; border: 6px solid #fde68a; opacity: 0; }
  #finger { position: absolute; left: 600px; top: 1010px; width: 150px; height: 150px; }

  .big { position: absolute; left: 90px; right: 90px; text-align: center; font: 800 120px/1.05 var(--f-cap); letter-spacing: -0.02em; color: var(--c-ink); }
  .big .ln { display: block; }

  /* S4 real print */
  .ptag { position: absolute; left: 0; right: 0; text-align: center; }
  .ptag span { display: inline-block; padding: 9px 22px; border-radius: 999px; background: rgba(8, 6, 16, 0.85); border: 2px solid var(--c-lav);
    font: 700 30px/1 var(--f-ui); letter-spacing: 0.04em; color: var(--c-lav); text-transform: uppercase; }
  #card { position: absolute; left: 240px; top: 350px; width: 600px; height: 637px; border-radius: 30px; overflow: hidden; transform-origin: 50% 0%;
    border: 4px solid rgba(251, 191, 36, 0.8); box-shadow: 0 0 0 10px rgba(251, 191, 36, 0.1), 0 40px 120px rgba(251, 191, 36, 0.3); background: #1b1b22; }
  #card img { display: block; width: 100%; }
  .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 34px var(--f-ui); color: #777; background: repeating-linear-gradient(45deg, #222 0 20px, #2a2a2a 20px 40px); }
  #muk { position: absolute; left: 0; right: 0; top: 1018px; text-align: center; font: 800 96px/1 var(--f-cap); color: var(--c-amb); text-shadow: 0 0 40px rgba(251, 191, 36, 0.4); }
  #quote { position: absolute; left: 120px; top: 790px; width: 760px; height: 239px; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); background: #1b1b22; }
  #quote img { display: block; width: 100%; }
  #qbox { position: absolute; left: 112px; top: 902px; width: 250px; height: 124px; border-radius: 22px; border: 5px solid var(--c-amb); box-shadow: 0 0 30px rgba(251, 191, 36, 0.5); opacity: 0; }
  #sparks i { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; display: block; opacity: 0;
    background: radial-gradient(circle, #fff7d6 0%, #fbbf24 42%, rgba(251, 191, 36, 0) 72%); }

  /* end card */
  #endWrap { position: absolute; inset: 0; }
  #logoBox { position: absolute; left: 240px; top: 350px; width: 600px; }
  #logoBox img { display: block; width: 600px; }
  #eyeEnd { position: absolute; left: 186px; top: 4px; width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #endUrl { position: absolute; left: 0; right: 0; top: 928px; text-align: center; font: 700 66px/1 var(--f-ui); color: var(--c-ink); }
  #endAsk { position: absolute; left: 110px; right: 110px; top: 1040px; text-align: center; font: 800 68px/1.1 var(--f-cap); color: var(--c-ink); }
  #endAsk .ln { display: block; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="14.48" data-fps="30">
  <div id="night"></div>
  <div id="stars"></div>
  <div id="amb"></div>
  <div id="vio"></div>
  <div class="aring" id="ar1"></div><div class="aring" id="ar2"></div><div class="aring" id="ar3"></div>

  <!-- S1 alarm ringing (0 - 1.655) -->
  <section id="s1" class="clip" data-start="0" data-duration="1.655">
    <div id="s1in" style="position:absolute; inset:0">
      <div class="lbl" id="alLbl">despertador</div>
      <div id="time">03<span class="col" id="colon">:</span>00</div>
      <div id="alName">SHINY</div>
      <svg class="tw" id="tw1" style="left:250px; top:560px; width:56px; height:56px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fde68a"/></svg>
      <svg class="tw" id="tw2" style="left:790px; top:700px; width:40px; height:40px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fde68a"/></svg>
      <div id="snz"><span>Soneca</span><span>💤</span></div>
      <div id="stp">Parar</div>
    </div>
  </section>

  <!-- S2 "SONECA?" (1.655 - 3.310) -->
  <section id="s2" class="clip" data-start="1.655" data-duration="1.655">
    <div id="s2in" style="position:absolute; inset:0">
      <div id="snzQ">SONECA?</div>
      <div id="snzRip"></div>
      <div id="snz2"><span>Soneca</span><span>💤</span></div>
      <svg id="finger" viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l5.2 1.3c1 .3 1.6 1.2 1.5 2.2l-.6 5.2c-.1 1-1 1.8-2 1.8h-5.6c-.6 0-1.2-.3-1.6-.8L5 15.5c-.5-.7-.4-1.6.3-2.1.6-.4 1.4-.4 2 .1L9 15z" fill="#fff" stroke="#1d2238" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
  </section>

  <!-- S3 (3.310 - 4.966) -->
  <section id="s3" class="clip" data-start="3.31" data-duration="1.656">
    <div class="big" id="np" style="top:330px"><div class="ln">Não precisa:</div><div class="ln">ele já</div><div class="ln" style="color:var(--c-lime); font-size:140px">capturou.</div></div>
  </section>

  <!-- S4 real print: card then quote (4.966 - 9.931) -->
  <section id="s4" class="clip" data-start="4.966" data-duration="4.965">
    <div id="s4in" style="position:absolute; inset:0">
      <div class="ptag" id="tag4" style="top:290px"><span>print real de cliente</span></div>
      <div id="card"><img src="kit/img/prints/shiny-muk--card.png" alt="" /></div>
      <div id="muk">SHINY MUK ✓</div>
      <div id="quote"><img src="kit/img/prints/shiny-muk--quote.png" alt="" /></div>
      <div id="qbox"></div>
      <div id="sparks"></div>
    </div>
  </section>

  <!-- S5 punchline (9.931 - 11.586) -->
  <section id="s5" class="clip" data-start="9.931" data-duration="1.655">
    <div class="big" id="pun" style="top:520px; font-size:112px"><div class="ln">Ele tava AFK.</div><div class="ln" style="color:var(--c-lime); font-size:136px">O bot não.</div></div>
  </section>

  <!-- S6 end card (11.586 - 14.48) -->
  <section id="s6" class="clip" data-start="11.586" data-duration="2.894">
    <div id="endWrap">
      <div id="logoBox"><img id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" /><div id="eyeEnd"></div></div>
      <div id="endUrl">kizubot.com</div>
      <div id="endAsk"><div class="ln">Levantaria às 3h</div><div class="ln">por um <span style="color:var(--c-amb)">shiny?</span></div></div>
    </div>
  </section>

  <div id="flash"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 14.48;
  const b = KZ.beats(145);              // beat 0.4138 s, bar 1.655 s
  const T_SNZ = b(4), T_PRESS = b(7), T_NP = b(8), T_CAP = b(10), T_DROP = b(12), T_Q = b(18), T_PUN = b(24), T_EC = b(28);

  // starfield (deterministic)
  (function () {
    const host = document.getElementById("stars"); const r = KZ.rng(80);
    for (let i = 0; i < 46; i++) {
      const s = document.createElement("div"); s.className = "star";
      s.style.left = (r() * 1080).toFixed(0) + "px"; s.style.top = (r() * 1500).toFixed(0) + "px";
      s.style.opacity = (0.25 + r() * 0.6).toFixed(2); host.appendChild(s);
      if (i % 3 === 0) tl.fromTo(s, { opacity: 0.15 }, { opacity: 0.9, duration: 0.6 + r(), ease: "sine.inOut", yoyo: true, repeat: 5 }, r() * 2);
    }
  })();

  // ---------- S1 alarm ringing (frame 0 readable) ----------
  [0, 2, 4, 6].forEach(function (k, n) {
    const t0 = b(k);
    ["#ar1", "#ar2", "#ar3"].forEach(function (r, i) {
      tl.fromTo(r, { scale: 0.45, opacity: 0.8 }, { scale: 1.15, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: n === 0 }, t0 + i * 0.12);
    });
    if (k < 4) KZ.shake(tl, "#s1in", t0, 7, 0.36, 20 + k);
  });
  tl.fromTo("#amb", { opacity: 0.6, scale: 0.95 }, { opacity: 1, scale: 1.05, duration: 0.41, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
  tl.fromTo("#colon", { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "none", yoyo: true, repeat: 3 }, 0.62);
  tl.fromTo("#time", { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);
  ["#tw1", "#tw2"].forEach(function (t, i) {
    tl.fromTo(t, { scale: 0.2, rotation: 0, opacity: 0 }, { scale: 1, rotation: 90, opacity: 1, duration: 0.45, ease: "back.out(2)", yoyo: true, repeat: 1 }, 0.1 + i * 0.3);
  });
  tl.fromTo("#snz", { scale: 1 }, { scale: 1.05, duration: 0.41, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
  tl.to(["#alLbl", "#time", "#alName", "#tw1", "#tw2", "#stp"], { y: -70, opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.02 }, T_SNZ - 0.22);
  tl.to("#snz", { scale: 1.2, y: -120, opacity: 0, duration: 0.22, ease: "power2.in" }, T_SNZ - 0.22);

  // ---------- S2 snooze tease + press ----------
  tl.fromTo("#snzQ", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, T_SNZ);
  tl.fromTo("#snz2", { scale: 0.7, opacity: 0, y: 60 }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, T_SNZ + 0.08);
  KZ.shake(tl, "#snzQ", T_SNZ + 0.4, 6, 0.3, 31);
  KZ.shake(tl, "#snz2", b(6), 6, 0.3, 32);
  tl.fromTo("#finger", { x: 260, y: 260, rotation: 20, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T_SNZ + 0.5);
  tl.to("#finger", { scale: 0.88, y: 10, duration: 0.08, ease: "power2.in" }, T_PRESS - 0.08);
  tl.to("#snz2", { scale: 0.9, duration: 0.08, ease: "power2.in" }, T_PRESS - 0.08);
  tl.to("#snz2", { scale: 1, duration: 0.25, ease: "back.out(3)" }, T_PRESS);
  tl.to("#finger", { scale: 1, y: 0, duration: 0.2, ease: "power2.out" }, T_PRESS);
  tl.fromTo("#snzRip", { scale: 1, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 0.45, ease: "power2.out" }, T_PRESS);
  tl.to("#amb", { opacity: 0.25, duration: 0.35, ease: "power2.out" }, T_PRESS + 0.05);
  tl.to("#s2in", { opacity: 0, scale: 0.94, duration: 0.18, ease: "power2.in" }, T_NP - 0.18);

  // ---------- S3 ----------
  const npL = document.querySelectorAll("#np .ln");
  tl.fromTo(npL[0], { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, T_NP);
  tl.fromTo(npL[1], { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, T_CAP);
  tl.fromTo(npL[2], { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, T_CAP + b(0.75));
  tl.to("#np", { opacity: 0, scale: 1.2, duration: 0.18, ease: "power2.in" }, T_DROP - 0.2);

  // ---------- S4 the proof (drop) ----------
  KZ.flash(tl, "#flash", T_DROP, 0.65);
  tl.to("#amb", { opacity: 1, duration: 0.3, ease: "power2.out" }, T_DROP);
  KZ.rise(tl, "#tag4", T_DROP + 0.1, 0.3, 20);
  tl.fromTo("#card", { y: 140, scale: 0.86, opacity: 0, rotation: 3 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "expo.out" }, T_DROP);
  tl.fromTo("#muk", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, T_DROP + 0.45);
  tl.to("#card", { scale: 1.03, duration: 1.75, ease: "sine.inOut" }, T_DROP + 0.45);
  // card shrinks up, quote slides in beneath
  tl.to("#muk", { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, T_Q - 0.25);
  tl.to("#card", { scale: 0.62, duration: 0.45, ease: "power3.inOut" }, T_Q - 0.2);
  tl.fromTo("#quote", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, T_Q + 0.05);
  tl.fromTo("#qbox", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, T_Q + b(2));
  tl.to("#qbox", { scale: 1.06, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, T_Q + b(2) + 0.35);
  tl.to("#s4in", { opacity: 0, y: -50, duration: 0.18, ease: "power2.in" }, T_PUN - 0.18);
  // gold sparks around the card
  (function () {
    const host = document.getElementById("sparks"); const r = KZ.rng(81); const P = [];
    for (let i = 0; i < 20; i++) { const e = document.createElement("i"); host.appendChild(e); const a = r() * Math.PI * 2, sp = 420 + r() * 480; P.push({ el: e, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 220, d: r() * 0.1, s: 0.6 + r() }); }
    const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: 1.2, duration: 1.2, ease: "none", onUpdate: function () {
      P.forEach(function (p) {
        const t = Math.max(0, o.t - p.d), x = 528 + p.vx * t, y = 640 + p.vy * t + 650 * t * t;
        p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + p.s.toFixed(2) + ")";
        p.el.style.opacity = t <= 0 ? 0 : Math.max(0, 1 - t / 1.1).toFixed(3);
      });
    } }, T_DROP + 0.05);
  })();

  // ---------- S5 punchline ----------
  const puL = document.querySelectorAll("#pun .ln");
  tl.fromTo(puL[0], { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, T_PUN);
  tl.fromTo(puL[1], { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, T_PUN + b(1.5));
  KZ.shake(tl, "#pun", T_PUN + b(1.5) + 0.05, 9, 0.22, 7);
  tl.to("#pun", { opacity: 0, scale: 0.94, duration: 0.18, ease: "power2.in" }, T_EC - 0.18);

  // ---------- S6 end card ----------
  tl.to("#vio", { opacity: 1, duration: 0.4, ease: "power2.out" }, T_EC - 0.1);
  tl.to("#amb", { opacity: 0, duration: 0.4 }, T_EC - 0.1);
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T_EC);
  KZ.eyePulse(tl, "#eyeEnd", T_EC + 0.1, 3);
  KZ.rise(tl, "#endUrl", T_EC + 0.4, 0.35, 30);
  KZ.rise(tl, "#endAsk", T_EC + 0.75, 0.4, 30);
  tl.to("#logoBox", { y: -14, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_EC + 0.6);
  // loop seam: back to the 3 a.m. night (frame 0 background)
  tl.to("#endWrap", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.34);
  tl.to("#vio", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.34);
  tl.to("#amb", { opacity: 0.6, duration: 0.3, ease: "power1.in" }, D - 0.34);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
