<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>082 Relatório de loot</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F09 Satisfatório — ep. 082: liquid loot bars count up to a real alarm, card flips to the print, loops ===== */
  :root {
    --s-ink: #f6f2ff; --s-dim: #9188ab; --s-gold: #fcd34d; --s-lav: #d8b4fe;
    --f-soft: "Fredoka", "Baloo 2", sans-serif;
  }
  #root { background: #0b0714; }
  #bg { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 58%, #2a1650 0%, #130a24 55%, #090511 100%); }
  #halo { position: absolute; left: 40px; top: 560px; width: 1000px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(251, 191, 36, 0.12), rgba(251, 191, 36, 0)); }

  #title { position: absolute; left: 0; right: 0; top: 256px; text-align: center; font: 700 122px/1.04 var(--f-soft); color: var(--s-ink); letter-spacing: -0.01em; }
  #title .ln { display: block; }
  #title .acc { color: var(--s-gold); }
  .ptag { position: absolute; left: 0; right: 0; top: 534px; text-align: center; opacity: 0; }
  .ptag span { display: inline-block; padding: 8px 20px; border-radius: 999px; background: rgba(8, 6, 16, 0.85); border: 2px solid var(--s-lav);
    font: 700 30px/1 "Sora", sans-serif; letter-spacing: 0.04em; color: var(--s-lav); text-transform: uppercase; }

  #stage3d { position: absolute; left: 110px; top: 590px; width: 780px; height: 804px; perspective: 2200px; }
  #card { position: absolute; inset: 0; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; border-radius: 56px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
    background: linear-gradient(180deg, #221739 0%, #170f28 100%);
    box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.07), inset 0 -4px 0 rgba(0, 0, 0, 0.3); }
  #back { transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
  #back .pimg { position: relative; width: 640px; height: 634px; border-radius: 26px; overflow: hidden; background: #1b1b22; }
  #back .pimg img { display: block; width: 100%; }
  .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 30px "Sora", sans-serif; color: #6b7280; background: repeating-linear-gradient(45deg, #1d1f26 0 20px, #24262e 20px 40px); }

  #head { position: absolute; left: 34px; right: 40px; top: 22px; height: 64px; display: flex; align-items: center; }
  #kchip { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: linear-gradient(180deg, #8b5cf6, #6d28d9);
    color: #fff; font: 700 32px/1 var(--f-soft); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.22); }
  #kchip img { width: 40px; height: 40px; border-radius: 50%; background: #2e1b52; object-fit: cover; object-position: 50% 10%; }
  #tot { margin-left: auto; display: flex; align-items: baseline; gap: 14px; }
  #tot small { font: 700 34px/1 var(--f-soft); color: var(--s-dim); }
  #totN { font: 700 64px/1 var(--f-soft); color: var(--s-gold); font-variant-numeric: tabular-nums; display: inline-block; }

  .row { position: absolute; left: 30px; right: 30px; height: 100px; border-radius: 50px; overflow: hidden; background: #2b2142;
    box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(255, 255, 255, 0.05); }
  .row .fill { position: absolute; inset: 0; border-radius: 50px; }
  .row .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 50px 50px 30px 30px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0)); }
  .row .lab { position: absolute; left: 34px; top: 0; height: 100px; display: flex; align-items: center; font: 700 50px/1 var(--f-soft); color: var(--s-ink); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); white-space: nowrap; }
  .row .val { position: absolute; right: 34px; top: 0; height: 100px; display: flex; align-items: center; font: 700 56px/1 var(--f-soft); color: var(--s-ink); font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }

  /* end lockup */
  #lock { position: absolute; inset: 0; }
  #logoBox { position: absolute; left: 300px; top: 560px; width: 480px; }
  #logoBox img { display: block; width: 480px; }
  #eyeEnd { position: absolute; left: 146px; top: 2px; width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #endUrl { position: absolute; left: 0; right: 0; top: 1016px; text-align: center; font: 700 64px/1 var(--f-soft); color: var(--s-ink); }
  #endAsk { position: absolute; left: 110px; right: 150px; top: 1110px; text-align: center; font: 700 62px/1.12 var(--f-soft); color: var(--s-ink); }
  #endAsk .ln { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="12.89" data-fps="30">
  <div id="bg"></div>
  <div id="halo"></div>

  <div id="stage" style="position:absolute; inset:0">
    <div id="title"><div class="ln">RELATÓRIO</div><div class="ln acc">DE LOOT.</div></div>
    <div class="ptag" id="tag"><span>print real de cliente</span></div>
    <div id="stage3d">
      <div id="card">
        <div class="face" id="front">
          <div id="head"><span id="kchip"><img src="kit/img/brand/kizubot-head.png" alt="" />KizuBot</span><div id="tot"><small>total</small><span id="totN">0</span></div></div>
          <div id="rows"></div>
        </div>
        <div class="face" id="back"><div class="pimg"><img src="kit/img/prints/alarme-12335-itens--alarm.png" alt="" /></div></div>
      </div>
    </div>
  </div>

  <!-- end lockup: 9.375 - 12.1875 -->
  <section id="end" class="clip" data-start="9.375" data-duration="2.8125">
    <div id="lock">
      <div id="logoBox"><img id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" /><div id="eyeEnd"></div></div>
      <div id="endUrl">kizubot.com</div>
      <div id="endAsk"><div class="ln">Qual barra você</div><div class="ln">queria ver cheia?</div></div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 12.89;
  const b = KZ.beats(128);               // beat 0.469 s
  const T_TOTAL = b(12), T_FLIP = b(14), T_EC = b(20), T_LOOP = b(26);
  // the real numbers from the customer's KizuBot alarm (sum = 12335)
  const ITEMS = [
    { n: "Screw", v: 11616, c: "linear-gradient(90deg,#6d28d9,#a855f7)", at: b(2), d: 1.6 },
    { n: "Electric Box", v: 542, c: "linear-gradient(90deg,#b45309,#f59e0b)", at: b(4), d: 1.3 },
    { n: "Electric Rat Tail", v: 115, c: "linear-gradient(90deg,#be123c,#fb7185)", at: b(5.5), d: 1.2 },
    { n: "Electric Tail", v: 45, c: "linear-gradient(90deg,#15803d,#4ade80)", at: b(7), d: 1.1 },
    { n: "Thunder Stone", v: 12, c: "linear-gradient(90deg,#0e7490,#22d3ee)", at: b(8.5), d: 1.0 },
    { n: "Sheep Wool", v: 5, c: "linear-gradient(90deg,#475569,#94a3b8)", at: b(10), d: 0.75 }
  ];
  const rowsEl = document.getElementById("rows");
  const rows = ITEMS.map(function (it, i) {
    const r = document.createElement("div"); r.className = "row"; r.style.top = (104 + i * 116) + "px";
    r.innerHTML = '<div class="fill" style="background:' + it.c + '"></div><div class="lab">' + it.n + '</div><div class="val">0</div>';
    rowsEl.appendChild(r);
    return { el: r, fill: r.querySelector(".fill"), val: r.querySelector(".val") };
  });

  // ambient + frame-0 motion
  tl.fromTo("#stage3d", { y: 0 }, { y: -8, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
  tl.fromTo("#title", { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo("#halo", { opacity: 0.7 }, { opacity: 1, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

  // fills: each bar is a counter that is full exactly when it reaches the real value
  rows.forEach(function (r, i) {
    const it = ITEMS[i];
    tl.fromTo(r.fill, { xPercent: -100 }, { xPercent: 0, duration: it.d, ease: it.v < 50 ? "none" : "power2.inOut" }, it.at);
    tl.fromTo(r.el, { scale: 1 }, { scale: 1.03, duration: 0.12, ease: "power2.out" }, it.at + it.d);
    tl.to(r.el, { scale: 1, duration: 0.3, ease: "power2.inOut" }, it.at + it.d + 0.12);
  });

  // total lands
  tl.fromTo("#totN", { scale: 1 }, { scale: 1.35, duration: 0.14, ease: "power2.out", immediateRender: false }, T_TOTAL);
  tl.to("#totN", { scale: 1, duration: 0.4, ease: "back.out(2)" }, T_TOTAL + 0.14);
  tl.fromTo("#halo", { scale: 1 }, { scale: 1.25, duration: 0.6, ease: "power2.out", immediateRender: false }, T_TOTAL);

  // proof: the card flips to the real alarm
  tl.fromTo("#card", { rotationY: 0 }, { rotationY: 180, duration: 0.7, ease: "power3.inOut" }, T_FLIP);
  tl.fromTo("#tag", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, T_FLIP + 0.5);

  // end lockup
  tl.to(["#stage3d", "#title", "#tag"], { opacity: 0.12, scale: 0.94, duration: 0.4, ease: "power2.inOut" }, T_EC - 0.2);
  tl.fromTo("#endLogo", { scale: 0.4, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.8)" }, T_EC);
  KZ.eyePulse(tl, "#eyeEnd", T_EC + 0.15, 3);
  KZ.rise(tl, "#endUrl", T_EC + 0.42, 0.4, 26);
  KZ.rise(tl, "#endAsk", T_EC + 0.78, 0.45, 26);
  tl.to("#logoBox", { y: -10, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_EC + 0.55);
  tl.to("#lock", { opacity: 0, scale: 0.96, duration: 0.2, ease: "power2.in" }, T_LOOP - 0.2);

  // loop seam: flip back to the bars and drain them in one wave -> frame 0
  tl.to(["#stage3d", "#title"], { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, T_LOOP - 0.05);
  tl.to("#tag", { opacity: 0, duration: 0.15 }, T_LOOP - 0.05);
  tl.to("#card", { rotationY: 360, duration: 0.5, ease: "power3.inOut" }, T_LOOP - 0.05);
  rows.forEach(function (r, i) { tl.to(r.fill, { xPercent: -100, duration: 0.36, ease: "power2.inOut" }, T_LOOP + 0.05 + (5 - i) * 0.03); });

  // counters (pure function of time)
  (function () {
    const tot = document.getElementById("totN"); const o = { t: 0 };
    function eased(p, lin) { return lin ? p : (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2); }
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const t = o.t; let sum = 0;
      ITEMS.forEach(function (it, i) {
        let p = Math.max(0, Math.min(1, (t - it.at) / it.d));
        if (t >= T_LOOP + 0.05) p = Math.max(0, 1 - (t - (T_LOOP + 0.05 + (5 - i) * 0.03)) / 0.36);
        const v = Math.round(it.v * eased(p, it.v < 50));
        rows[i].val.textContent = v.toLocaleString("pt-BR");
        sum += v;
      });
      tot.textContent = sum.toLocaleString("pt-BR");
    } }, 0);
  })();

  window.__timelines["main"] = tl;
</script>
</body>
</html>
