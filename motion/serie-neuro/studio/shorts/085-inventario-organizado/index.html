<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>085 Inventário se arrumando sozinho</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F09 Satisfatório — ep. 085: a messy bag sorts itself row by row (arc swaps), loops back to the mess ===== */
  :root {
    --s-ink: #f6f2ff; --s-dim: #9188ab; --s-lime: #c6ff3d; --s-gold: #fcd34d; --s-lav: #d8b4fe;
    --f-soft: "Fredoka", "Baloo 2", sans-serif;
  }
  #root { background: #0a0612; }
  #bg { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 60%, #26134a 0%, #120a22 55%, #08050f 100%); }
  #spot { position: absolute; left: 40px; top: 640px; width: 1000px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0)); }

  .tblock { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: var(--f-soft); font-weight: 700; color: var(--s-ink); }
  .tblock .ln { display: block; line-height: 1.04; letter-spacing: -0.01em; }
  #hook .l1, #hook .l3 { font-size: 122px; }
  #hook .l2 { font-size: 100px; color: var(--s-lav); }
  #cap .c1 { font-size: 64px; color: var(--s-lav); margin-bottom: 10px; }
  #cap .c2 { font-size: 126px; color: var(--s-lime); }
  #cap { top: 270px; }

  #bag { position: absolute; left: 140px; top: 656px; width: 800px; height: 740px; border-radius: 56px;
    background: linear-gradient(180deg, #231739 0%, #180f29 100%);
    box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.07), inset 0 -4px 0 rgba(0, 0, 0, 0.3); }
  #bagHead { position: absolute; left: 40px; right: 40px; top: 26px; height: 60px; display: flex; align-items: center; gap: 14px; font: 700 34px/1 var(--f-soft); color: var(--s-lav); }
  #bagHead svg { width: 44px; height: 44px; }
  #cnt { margin-left: auto; color: var(--s-ink); font-variant-numeric: tabular-nums; }
  #cnt small { color: var(--s-dim); font-size: 34px; }
  #grid { position: absolute; left: 46px; top: 110px; width: 708px; height: 588px; }
  .slot { position: absolute; width: 108px; height: 108px; border-radius: 26px; background: #2a2040;
    box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(255, 255, 255, 0.05); }
  .rowglow { position: absolute; left: -10px; width: 728px; height: 124px; border-radius: 32px; border: 3px solid rgba(198, 255, 61, 0.65); box-shadow: 0 0 30px rgba(198, 255, 61, 0.35); opacity: 0; }
  .it { position: absolute; left: 0; top: 0; width: 108px; height: 108px; }
  .it .arc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .it svg { width: 82px; height: 82px; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45)); }

  #kchip { display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; height: 46px; padding: 0 16px 0 6px; border-radius: 23px; background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: #fff; font: 700 30px/1 var(--f-soft); box-shadow: inset 0 2px 0 rgba(255,255,255,.22); }
  #kchip img { width: 34px; height: 34px; border-radius: 50%; background: #2e1b52; object-fit: cover; object-position: 50% 10%; }

  /* end lockup */
  #lock { position: absolute; inset: 0; }
  #logoBox { position: absolute; left: 300px; top: 560px; width: 480px; }
  #logoBox img { display: block; width: 480px; }
  #eyeEnd { position: absolute; left: 146px; top: 2px; width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 232, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  #endUrl { position: absolute; left: 0; right: 0; top: 1016px; text-align: center; font: 700 64px/1 var(--f-soft); color: var(--s-ink); }
  #endAsk { position: absolute; left: 110px; right: 150px; top: 1112px; text-align: center; font: 700 66px/1.12 var(--f-soft); color: var(--s-ink); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="14.33" data-fps="30">
  <div id="bg"></div>
  <div id="spot"></div>

  <div id="stage" style="position:absolute; inset:0">
    <div class="tblock" id="hook"><div class="ln l1">INVENTÁRIO</div><div class="ln l2">SE ARRUMANDO</div><div class="ln l3">SOZINHO…</div></div>
    <div class="tblock" id="cap"><div class="ln c1">Farm 100% AFK:</div><div class="ln c2">TUDO NO</div><div class="ln c2">LUGAR.</div></div>
    <div id="bag">
      <div id="bagHead"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Bag<span id="kchip"><img src="kit/img/brand/kizubot-head.png" alt="" />KizuBot</span><div id="cnt"><span id="cntN">0</span><small>/30 no lugar</small></div></div>
      <div id="grid"></div>
    </div>
  </div>

  <!-- end lockup: 10.667 - 13.333 -->
  <section id="end" class="clip" data-start="10.667" data-duration="2.666">
    <div id="lock">
      <div id="logoBox"><img id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" /><div id="eyeEnd"></div></div>
      <div id="endUrl">kizubot.com</div>
      <div id="endAsk">Sua bag é assim?</div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 14.33;
  const b = KZ.beats(90);               // beat 0.667 s, bar 2.667 s
  const P = [b(2), b(4), b(6), b(8)];   // swap phases (rows 0-3), row 4 locks at b(10)
  const T_LOCK4 = b(10), T_WAVE = b(11), T_CAP = b(12), T_EC = b(16), T_LOOP = b(20);
  const S = 108, G = 12;                // slot size / gap
  const SX = function (s) { return (s % 6) * (S + G); };
  const SY = function (s) { return Math.floor(s / 6) * (S + G); };

  // generic item icons (no game art): ruby, coin, leaf, drop, berry  -> rainbow rows
  const ICON = [
    '<svg viewBox="0 0 24 24"><path d="M7 3h10l4 6-9 12L3 9z" fill="#ef4444"/><path d="M7 3l2 6h6l2-6M3 9h18M9 9l3 12 3-12" fill="none" stroke="#fecaca" stroke-width="1" opacity=".7"/><path d="M8 4.5l1.3 3.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#f59e0b"/><circle cx="12" cy="12" r="7" fill="#fcd34d"/><path d="M12 7.5l1.3 2.8 3 .3-2.3 2 .7 3-2.7-1.6-2.7 1.6.7-3-2.3-2 3-.3z" fill="#f59e0b"/><path d="M7.5 8a6 6 0 0 1 3-2.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".8"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M5 19C4 11 9 4 20 4c0 11-7 16-15 15z" fill="#4ade80"/><path d="M5 19L15 9" stroke="#14532d" stroke-width="1.6" stroke-linecap="round"/><path d="M9 15h3.5M11.5 12.5H15" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" opacity=".6"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 2.5C9 7 5.5 10.5 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.5 15 7 12 2.5z" fill="#3b82f6"/><path d="M9 14.5a3 3 0 0 0 2 3" stroke="#bfdbfe" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7.5" fill="#a855f7"/><path d="M12 6.5c0-2 1.5-3.5 4-3.5-0.3 2.3-1.8 3.5-4 3.5z" fill="#4ade80"/><circle cx="9.3" cy="11.5" r="1.8" fill="#e9d5ff" opacity=".85"/></svg>'
  ];

  // deterministic messy arrangement
  const rnd = KZ.rng(85);
  let types = [];
  for (let t = 0; t < 5; t++) for (let k = 0; k < 6; k++) types.push(t);
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const tmp = types[i]; types[i] = types[j]; types[j] = tmp; }
  const grid = document.getElementById("grid");
  for (let s = 0; s < 30; s++) { const d = document.createElement("div"); d.className = "slot"; d.style.left = SX(s) + "px"; d.style.top = SY(s) + "px"; grid.appendChild(d); }
  const glows = [];
  for (let r = 0; r < 5; r++) { const g = document.createElement("div"); g.className = "rowglow"; g.style.top = (r * (S + G) - 8) + "px"; grid.appendChild(g); glows.push(g); }
  const items = types.map(function (t, s) {
    const el = document.createElement("div"); el.className = "it";
    el.innerHTML = '<div class="arc">' + ICON[t] + '</div>';
    grid.appendChild(el);
    return { el: el, arc: el.querySelector(".arc"), type: t, slot: s, home: s, rot: (rnd() * 2 - 1) * 18, dx: (rnd() * 2 - 1) * 8, dy: (rnd() * 2 - 1) * 8 };
  });

  // initial (messy) placement
  items.forEach(function (it) {
    tl.fromTo(it.el, { x: SX(it.slot) + it.dx, y: SY(it.slot) + it.dy, rotation: it.rot }, { x: SX(it.slot) + it.dx, y: SY(it.slot) + it.dy, rotation: it.rot, duration: 0.01 }, 0);
  });

  // plan the row-by-row selection sort
  const A = items.slice();               // slot -> item
  const counts = [];
  function countOk() { let k = 0; for (let s = 0; s < 30; s++) if (Math.floor(s / 6) === A[s].type) k++; return k; }
  counts.push(countOk());
  function moveTo(it, s, t, up) {
    const settled = Math.floor(s / 6) === it.type;
    const dx = settled ? 0 : it.dx, dy = settled ? 0 : it.dy, rot = settled ? 0 : -it.rot * 0.6;
    tl.to(it.el, { x: SX(s) + dx, y: SY(s) + dy, rotation: rot, duration: 0.52, ease: "power2.inOut" }, t);
    tl.to(it.arc, { y: up ? -46 : 30, scale: up ? 1.18 : 0.92, duration: 0.26, ease: "power2.out" }, t);
    tl.to(it.arc, { y: 0, scale: 1, duration: 0.26, ease: "power2.in" }, t + 0.26);
    it.slot = s;
  }
  for (let r = 0; r < 4; r++) {
    const used = {};
    for (let s = r * 6; s < r * 6 + 6; s++) {
      if (A[s].type === r) {
        // already right: straighten it on the row's beat
        const it = A[s];
        tl.to(it.el, { x: SX(s), y: SY(s), rotation: 0, duration: 0.4, ease: "power2.inOut" }, P[r] + 0.08);
        continue;
      }
      let j = -1;
      for (let q = r * 6 + 6; q < 30; q++) if (!used[q] && A[q].type === r) { j = q; break; }
      used[j] = true;
      const X = A[s], Y = A[j];
      moveTo(Y, s, P[r], true);
      moveTo(X, j, P[r], false);
      A[s] = Y; A[j] = X;
    }
    counts.push(countOk());
  }
  // row 4: everything left is already the right type -> straighten
  for (let s = 24; s < 30; s++) tl.to(A[s].el, { x: SX(s), y: SY(s), rotation: 0, duration: 0.4, ease: "power2.inOut" }, T_LOCK4);
  const LOCKS = [P[0] + 0.55, P[1] + 0.55, P[2] + 0.55, P[3] + 0.55, T_LOCK4 + 0.3];
  glows.forEach(function (g, r) {
    tl.fromTo(g, { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, LOCKS[r]);
    tl.to(g, { opacity: 0, duration: 0.5, ease: "power2.in" }, LOCKS[r] + 0.2);
  });

  // ambient + anticipation jiggle on frame 0
  tl.fromTo("#bag", { y: 0 }, { y: -8, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
  tl.fromTo("#hook", { y: 14 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
  items.forEach(function (it, i) {
    tl.fromTo(it.arc, { rotation: 0 }, { rotation: (i % 2 ? 7 : -7), duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.15 + (i % 6) * 0.04 + Math.floor(i / 6) * 0.05);
  });

  // perfect: diagonal bounce wave + caption swap + 100% AFK chip
  for (let s = 0; s < 30; s++) {
    const it = A[s], d = ((s % 6) + Math.floor(s / 6)) * 0.035;
    tl.to(it.arc, { scale: 1.2, duration: 0.14, ease: "power2.out" }, T_WAVE + d);
    tl.to(it.arc, { scale: 1, duration: 0.3, ease: "power2.inOut" }, T_WAVE + d + 0.14);
  }
  tl.to("#hook", { y: -30, opacity: 0, duration: 0.25, ease: "power2.in" }, T_CAP - 0.1);
  tl.fromTo("#cap .ln", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.8)", stagger: 0.12 }, T_CAP + 0.1);

  // end lockup
  tl.to(["#bag", "#cap"], { opacity: 0.12, scale: 0.94, duration: 0.4, ease: "power2.inOut" }, T_EC - 0.2);
  tl.fromTo("#endLogo", { scale: 0.4, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.8)" }, T_EC);
  KZ.eyePulse(tl, "#eyeEnd", T_EC + 0.15, 3);
  KZ.rise(tl, "#endUrl", T_EC + 0.42, 0.4, 26);
  KZ.rise(tl, "#endAsk", T_EC + 0.78, 0.45, 26);
  tl.to("#logoBox", { y: -10, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_EC + 0.55);
  tl.to("#lock", { opacity: 0, scale: 0.96, duration: 0.2, ease: "power2.in" }, T_LOOP - 0.2);

  // loop seam: back to the mess (one wave) and the hook title
  tl.to("#bag", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, T_LOOP - 0.05);
  tl.to("#cap", { opacity: 0, duration: 0.2 }, T_LOOP - 0.05);
  tl.to("#hook", { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, T_LOOP);
  items.forEach(function (it, i) {
    tl.to(it.el, { x: SX(it.home) + it.dx, y: SY(it.home) + it.dy, rotation: it.rot, duration: 0.42, ease: "power2.inOut" }, T_LOOP + 0.04 + (i % 6) * 0.012 + Math.floor(i / 6) * 0.03);
  });

  // counter (pure function of time): items whose row matches their type
  (function () {
    const n = document.getElementById("cntN"); const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const t = o.t; let k = counts[0];
      for (let r = 0; r < 4; r++) if (t >= P[r] + 0.5) k = counts[r + 1];
      if (t >= T_LOCK4 + 0.3) k = 30;
      if (t >= T_LOOP + 0.3) k = counts[0];
      n.textContent = String(k);
    } }, 0);
  })();

  window.__timelines["main"] = tl;
</script>
</body>
</html>
