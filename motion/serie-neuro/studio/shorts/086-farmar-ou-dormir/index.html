<script>
  /* ---------- F10 helpers ---------- */
  function confetti(tl, sel, at, seed, n, cx, cy, colors) {
    const c = document.querySelector(sel); const r = KZ.rng(seed);
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div"); d.className = "conf";
      d.style.left = cx + "px"; d.style.top = cy + "px"; d.style.background = colors[i % colors.length];
      c.appendChild(d);
      const ang = -Math.PI / 2 + (r() - 0.5) * 2.4, sp = 380 + r() * 420, dur = 0.9 + r() * 0.5;
      tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.02 }, at);
      tl.fromTo(d, { x: 0, y: 0, rotation: 0 }, { x: Math.cos(ang) * sp, y: Math.sin(ang) * sp + 520, rotation: (r() - 0.5) * 900, duration: dur, ease: "power1.out" }, at);
      tl.to(d, { opacity: 0, duration: 0.3 }, at + dur - 0.3);
    }
  }

  const tl = gsap.timeline({ paused: true });
  const D = 18.21;
  const b = KZ.beats(145);                 // beat 0.4138 s, bar 1.655 s
  const T_A = b(4), T_B = b(8), T_CH = b(12), T_WIN = b(16), T_REAL = b(20), T_TW = b(22), T_PR = b(28), T_END = b(36);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#strA", { x: 0 }, { x: 99, duration: T_TW, ease: "none" }, 0);
  tl.fromTo("#strB", { x: 0 }, { x: -99, duration: T_TW, ease: "none" }, 0);

  /* HOOK */
  tl.fromTo("#duel", { scale: 1.12 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0);
  tl.fromTo("#pill", { scale: 1.6, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#nameA", { y: -60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#nameB", { y: 60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.08);
  tl.fromTo("#seam", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 0);
  tl.fromTo("#vs", { scale: 2.6, rotation: -40, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.16);
  KZ.pop(tl, "#letA", 0.24, 0.3);
  KZ.pop(tl, "#letB", 0.32, 0.3);
  tl.to("#vs", { rotation: 8, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.6);

  /* A details: 04:00, clicks, yawn */
  tl.fromTo("#clockA", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, T_A);
  tl.fromTo("#clicksA", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, T_A + 0.1);
  tl.fromTo("#clk", { opacity: 1 }, { opacity: 0.25, duration: 0.2, ease: "steps(1)", yoyo: true, repeat: 5 }, T_A + 0.4);
  const clkEl = document.querySelector("#clkN"), co = { v: 0 };
  tl.fromTo(co, { v: 0 }, { v: 1000, duration: 1.25, ease: "power1.in", onUpdate: function () { clkEl.textContent = co.v >= 999.5 ? "999+" : KZ.fmt(co.v, "int"); } }, T_A + 0.3);
  ["#pl1", "#pl2", "#pl3"].forEach(function (p, i) {
    for (let k = 0; k < 2; k++) {
      const t = T_A + 0.35 + i * 0.13 + k * 0.45;
      if (k === 0) tl.fromTo(p, { y: 0, opacity: 0 }, { y: -50, opacity: 1, duration: 0.2, ease: "power2.out" }, t);
      else tl.fromTo(p, { y: 0, opacity: 1 }, { y: -50, opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
      tl.to(p, { opacity: 0, duration: 0.15 }, t + 0.2);
    }
  });
  tl.fromTo("#yawn", { scale: 0.3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "back.out(2.5)" }, T_A + 0.55);
  KZ.shake(tl, "#nameA", T_A + 0.9, 5, 0.5, 3);

  /* B details: moon, Zzz, real alarm while asleep */
  tl.fromTo("#moon", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, T_B);
  ["#z1", "#z2", "#z3"].forEach(function (z, i) {
    tl.fromTo(z, { y: 20, opacity: 0 }, { y: -30, opacity: 1, duration: 0.5, ease: "power1.out" }, T_B + 0.15 + i * 0.14);
  });
  tl.fromTo("#alarmB", { x: 640, rotation: 6, opacity: 0 }, { x: 0, rotation: -1.5, opacity: 1, duration: 0.36, ease: "back.out(1.6)" }, b(9));
  KZ.shake(tl, "#alarmB", b(9) + 0.36, 8, 0.36, 17);
  tl.fromTo("#alTagB", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, b(9) + 0.3);

  /* CHOOSER: hops A/B on the beat (build) */
  const POS_A = 0, POS_B = 940 - 316;      // chooser top 316 (A) / 940 (B)
  tl.fromTo("#chooser", { opacity: 0, y: POS_A }, { opacity: 1, y: POS_A, duration: 0.08 }, T_CH);
  [[b(13), POS_B], [b(14), POS_A], [b(14.5), POS_B], [b(15), POS_A]].forEach(function (p) {
    tl.to("#chooser", { y: p[1], duration: 0.12, ease: "power3.out" }, p[0]);
  });
  KZ.punch(tl, "#letA", T_CH, 1.25, 0.25);
  KZ.punch(tl, "#letB", b(13), 1.25, 0.25);

  /* B WINS (drop) */
  tl.to("#chooser", { y: POS_B, duration: 0.1, ease: "power3.out" }, T_WIN - 0.1);
  tl.to("#chooser", { opacity: 0, duration: 0.3 }, T_WIN + 0.5);
  tl.to("#pAin", { filter: "grayscale(0.85) brightness(0.55)", duration: 0.25 }, T_WIN);
  tl.to(["#clockA", "#clicksA", "#yawn"], { opacity: 0.25, duration: 0.25 }, T_WIN);
  tl.fromTo("#koS", { scale: 2.6, opacity: 0, rotation: 2 }, { scale: 1, opacity: 1, rotation: -12, duration: 0.14, ease: "power3.in" }, T_WIN - 0.14);
  KZ.shake(tl, "#duel", T_WIN, 9, 0.24, 4);
  KZ.flash(tl, "#flash", T_WIN, 0.35, "#ffffff");
  tl.to("#pBin", { filter: "brightness(1.35) saturate(1.2)", duration: 0.2 }, T_WIN);
  KZ.punch(tl, "#letB", T_WIN, 1.35, 0.4);
  tl.to("#vsW", { scale: 0.62, duration: 0.2, ease: "power3.out" }, T_WIN);
  tl.to(".corner", { opacity: 0, duration: 0.15 }, b(17) - 0.1);
  tl.fromTo("#beltIn", { y: -260, scale: 1.4, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "bounce.out" }, b(17));
  confetti(tl, "#confB", T_WIN + 0.05, 86, 26, 540, 1300, ["#f7c548", "#c6ff3d", "#ffffff", "#c4a1ff"]);

  /* "NA REAL…" — VS flips to "…" */
  tl.to("#vsW", { scale: 0, duration: 0.14, ease: "power3.in" }, T_REAL - 0.12);
  tl.to(".corner", { opacity: 1, duration: 0.2 }, T_REAL);
  tl.fromTo("#realBand", { scaleX: 0, rotation: -4 }, { scaleX: 1, rotation: -4, duration: 0.16, ease: "power3.out" }, T_REAL);
  tl.fromTo("#realT", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, T_REAL + 0.06);
  tl.to("#realBand", { scaleY: 0, duration: 0.18, ease: "power3.in" }, T_TW - 0.2);
  tl.to("#pill", { scale: 0.001, opacity: 0, duration: 0.12 }, T_REAL - 0.1);
  tl.to(["#ko", "#belt"], { opacity: 0, duration: 0.15 }, T_REAL);
  tl.to("#pAin", { filter: "grayscale(0) brightness(1)", duration: 0.3 }, T_REAL);
  tl.to("#pBin", { filter: "brightness(1) saturate(1)", duration: 0.3 }, T_REAL);
  tl.to(["#clockA", "#clicksA", "#yawn"], { opacity: 1, duration: 0.3 }, T_REAL);
  /* panels slam together into one — "dá os dois" */
  tl.to("#pA", { y: 230, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);
  tl.to(["#pB", "#nameB", "#moon", "#alarmB", "#alTagB", "#z1", "#z2", "#z3"], { y: -230, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);

  /* TWIST */
  KZ.flash(tl, "#flash", T_TW, 0.6, "#c4a1ff");
  KZ.slam(tl, "#tw1", T_TW, 1.8);
  KZ.slam(tl, "#tw2", b(23), 1.8);
  KZ.slam(tl, "#tw3", b(24), 2.2);
  tl.fromTo("#twHead", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, b(25));
  KZ.eyePulse(tl, "#eyeT", b(25.6), 2);
  tl.to("#twIn", { opacity: 0, duration: 0.18, ease: "power2.in" }, T_PR - 0.18);

  /* PROOF */
  KZ.pop(tl, "#prTagIn", T_PR + 0.05, 0.3);
  tl.fromTo("#prW", { scale: 0.6, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: -1, duration: 0.4, ease: "back.out(1.7)" }, T_PR);
  KZ.rise(tl, "#prLine", b(29.5), 0.35, 40);
  tl.fromTo("#prC", { scale: 0.3, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.32, ease: "back.out(3)" }, b(32));
  tl.to("#prW", { scale: 1.03, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_PR + 0.5);
  tl.to("#prIn", { scale: 0.94, opacity: 0, duration: 0.2, ease: "power2.in" }, T_END - 0.2);

  /* END CARD */
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T_END + 0.02);
  KZ.eyePulse(tl, "#eye2", T_END + 0.12, 2);
  KZ.rise(tl, "#endUrl", T_END + 0.32, 0.35, 30);
  KZ.rise(tl, "#endAsk", T_END + 0.6, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_END + 0.6);
  KZ.eyePulse(tl, "#eye2", T_END + 1.9, 1);
  tl.to("#endIn", { scale: 0.92, opacity: 0, duration: 0.22, ease: "power2.in" }, D - 0.3);
  // loop bridge: the two corners close back in, so the replay lands on the split hook
  tl.fromTo("#brA", { yPercent: -100 }, { yPercent: 0, duration: 0.3, ease: "power3.in" }, D - 0.32);
  tl.fromTo("#brB", { yPercent: 100 }, { yPercent: 0, duration: 0.3, ease: "power3.in" }, D - 0.32);

  window.__timelines["main"] = tl;
</script>
