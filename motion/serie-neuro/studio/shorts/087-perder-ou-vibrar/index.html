  /* ================= 087 skin: arcade fighter select ================= */

  #selTag { position: absolute; right: -10px; top: -46px; padding: 8px 14px; background: #ff4d2e; font-family: "Press Start 2P", monospace; font-size: 30px; color: #000; }
  /* A portrait: shiny sparkle that dissolves */
  #spark { position: absolute; left: 70px; top: 50px; width: 200px; height: 200px; }

  /* B portrait: the real watch */

  /* verdict */
  #gameover { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; z-index: 8; }
  #gameover span { padding: 18px 26px; background: #000; font-family: "Press Start 2P", monospace; font-size: 64px; color: #ff4d2e; text-shadow: 0 0 16px rgba(255, 77, 46, 0.8); border: 6px solid #ff4d2e; }
  #picked { position: absolute; left: 476px; top: 1290px; z-index: 8; }
  #picked span { display: inline-block; padding: 8px 20px 4px; background: var(--gold); font-family: "Teko", sans-serif; font-weight: 700; font-size: 84px; line-height: 1; color: #000; border: 6px solid #000; text-transform: uppercase; }
  #realBand { position: absolute; left: -60px; right: -60px; top: calc(var(--seamY) - 95px); height: 190px; background: #000; border-top: 8px solid var(--cy); border-bottom: 8px solid var(--cy); display: flex; align-items: center; justify-content: center; z-index: 9; }
  #realBand span { font-family: "Press Start 2P", monospace; font-size: 76px; line-height: 1.3; color: #fff; }

  /* twist */
  #twBg { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 42%, #4c1d95 0%, #1d0b3a 55%, #07060d 100%); }
  #twTxt { position: absolute; left: 90px; right: 120px; top: 330px; display: flex; flex-direction: column; align-items: center; }
  #twTxt div { font-family: "Teko", sans-serif; font-weight: 700; line-height: 0.92; text-transform: uppercase; text-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5); }
  #tw1 { font-size: 118px; color: var(--kz-lav); }
  #tw2 { font-size: 132px; color: #fff; }
  #tw3 { font-size: 132px; color: var(--cy); }
  #twWatch { position: absolute; left: 330px; top: 860px; width: 420px; height: 420px; border-radius: 50%; overflow: hidden; border: 10px solid #fff; box-shadow: 0 0 0 8px #000, 0 0 50px rgba(61, 245, 255, 0.55); }
  #twWatch img { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; object-fit: cover; }
  .ring { position: absolute; left: 330px; top: 860px; width: 420px; height: 420px; border-radius: 50%; border: 8px solid var(--cy); opacity: 0; }
  /* proof */
  #prTag { position: absolute; left: 0; right: 0; top: 250px; display: flex; justify-content: center; }
  #prW { position: absolute; left: 230px; width: 620px; top: 336px; height: 618px; }
  .prCard { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; background: #1b1424; border: 8px solid #fff; box-shadow: 0 0 0 7px #000, 0 30px 70px rgba(0, 0, 0, 0.55); }
  .prCard img { position: absolute; left: 0; top: 0; width: 100%; }
  #prLine { position: absolute; left: 96px; width: 784px; top: 1010px; text-align: center; font: 900 60px "Inter", sans-serif; line-height: 1.14; color: #fff; }
  #prLine b { color: var(--cy); }
  /* end */
  #endBg { position: absolute; inset: 0; background: radial-gradient(70% 40% at 50% 40%, #3b1470 0%, #07060d 72%); }
  .ask { font: 900 64px "Inter", sans-serif; color: #fff; line-height: 1.14; text-align: center; }
  .ask b { color: var(--gold); }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="18.21" data-fps="30">
  <div class="kz-progress"><div id="prog"></div></div>

  <!-- DUEL -->
  <section id="sDuel" class="clip" data-start="0" data-duration="9.1">
    <div class="full" id="duel">
      <div class="panel" id="pA"><div class="pin" id="pAin"><div class="bgfx"></div><div class="speed" id="spA"></div></div></div>
      <div class="panel" id="pB"><div class="pin" id="pBin"><div class="bgfx"></div><div class="speed" id="spB"></div></div></div>
      <div class="frame a" id="frA"><div class="in">
        <div id="spark"><svg viewBox="0 0 100 100"><path d="M50 2 C54 34 66 46 98 50 C66 54 54 66 50 98 C46 66 34 54 2 50 C34 46 46 34 50 2 Z" fill="#ffd84a" /><circle cx="82" cy="18" r="5" fill="#fff6c9" /><circle cx="20" cy="80" r="4" fill="#fff6c9" /></svg></div>
        <div id="pxs"></div>
        <div id="away"><div>você tava</div><div>longe…</div></div>
      </div><span class="ptag2 a">P1</span></div>
      <div class="nm" id="nmA"><div id="a1">Perder</div><div id="a2">o shiny</div></div>
      <div class="frame b" id="frB"><div class="in" id="frBin"><img src="kit/img/prints/smartwatch-alarm--watch.jpg" alt="" /></div><span class="ptag2 b">P2</span></div>
      <div id="frTag"><span class="ptag">print real de cliente</span></div>

  <!-- TWIST -->
  <section id="sTwist" class="clip" data-start="9.1" data-duration="2.49">

      <div id="twTxt"><div id="tw1">com KizuBot</div><div id="tw2">o alarme chega</div><div id="tw3">até no relógio.</div></div>

      <div id="prTag"><span class="ptag" id="prTagIn">print real de cliente</span></div>

  <!-- END CARD -->
  <section id="sEnd" class="clip" data-start="14.9" data-duration="3.31">
    <div id="endBg"></div>
    <div id="brA" style="position:absolute; left:0; right:0; top:0; height:860px; background:linear-gradient(160deg, #ff4d2e 0%, #8a1306 55%, #1f0402 100%); z-index:20"></div>
    <div id="brB" style="position:absolute; left:0; right:0; top:860px; bottom:0; background:linear-gradient(200deg, #7c3aed 0%, #2b0f63 55%, #08031a 100%); z-index:20"></div>
    <div class="kz-end" id="endIn">
      <div style="position:relative; width:560px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" />
        <div class="eye" id="eye2" style="left:177px; top:8px; width:100px; height:100px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk"><div>Já perdeu um shiny</div><div>por estar <b>longe</b>?</div></div>
    </div>

  <div id="flash"></div>

<script>
  const tl = gsap.timeline({ paused: true });
  const D = 18.21;
  const b = KZ.beats(145);
  const T_A = b(4), T_B = b(8), T_CH = b(12), T_WIN = b(16), T_REAL = b(20), T_TW = b(22), T_PR = b(28), T_END = b(36);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#spA", { x: 0 }, { x: -260, duration: T_TW, ease: "none" }, 0);
  tl.fromTo("#spB", { x: 0 }, { x: 260, duration: T_TW, ease: "none" }, 0);

  /* HOOK — arcade select slams in */
  tl.fromTo("#headT", { scale: 1.5, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.2, ease: "steps(3)" }, 0);
  tl.fromTo("#frA", { x: -200, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.22, ease: "power4.out" }, 0);
  tl.fromTo("#frB", { x: -200, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.22, ease: "power4.out" }, 0.06);
  tl.fromTo("#frTag", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
  tl.fromTo("#nmA", { x: 260, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#nmB", { x: 260, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.08);
  tl.fromTo("#seam", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 0);
  tl.fromTo("#vs", { scale: 3, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.26, ease: "back.out(2.2)" }, 0.16);
  tl.to("#vs", { scale: 1.08, duration: 0.41, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.5);
  tl.to("#spark", { rotation: 20, scale: 1.08, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.3);

  /* A: the shiny dissolves — "você tava longe…" */
  const pxs = document.querySelector("#pxs"), r = KZ.rng(87);
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("div"); p.className = "px";
    const gx = 80 + (i % 4) * 46, gy = 60 + Math.floor(i / 4) * 46;
    p.style.left = gx + "px"; p.style.top = gy + "px"; pxs.appendChild(p);
    const t = T_A + 0.2 + r() * 0.5;
    tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.02 }, t);
    tl.fromTo(p, { x: 0, y: 0 }, { x: (r() - 0.5) * 220, y: -80 - r() * 160, duration: 0.7, ease: "power2.out" }, t);
    tl.to(p, { opacity: 0, duration: 0.25 }, t + 0.45);
  }
  tl.to("#spark", { scale: 0.2, opacity: 0, duration: 0.6, ease: "steps(6)" }, T_A + 0.2);
  tl.fromTo("#away", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "steps(3)" }, T_A + 0.8);
  tl.to("#nmA", { opacity: 0.85, duration: 0.2 }, T_A + 0.8);

  /* B: the watch vibrates — real alarm */
  tl.fromTo("#frBin", { scale: 1.25 }, { scale: 1, duration: 0.4, ease: "power3.out" }, T_B);
  KZ.shake(tl, "#frB", b(9), 9, 0.5, 23);
  [["#bz1", b(9)], ["#bz2", b(9) + 0.12]].forEach(function (p) {
    tl.fromTo(p[0], { opacity: 0, x: 0 }, { opacity: 1, x: -16, duration: 0.1 }, p[1]);
    tl.to(p[0], { opacity: 0, duration: 0.2 }, p[1] + 0.35);
  });

  /* CHOOSER — arcade cursor hops */
  const POS_B = 930 - 352;
  tl.fromTo("#sel", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.05 }, T_CH);
  [[b(13), POS_B, "P2", "#a855f7"], [b(14), 0, "P1", "#ff4d2e"], [b(14.5), POS_B, "P2", "#a855f7"], [b(15), 0, "P1", "#ff4d2e"]].forEach(function (p) {
    tl.to("#sel", { y: p[1], borderColor: p[3], duration: 0.08, ease: "power3.out" }, p[0]);
  });

  /* B WINS */
  tl.to("#sel", { y: POS_B, borderColor: "#ffd84a", duration: 0.08 }, T_WIN - 0.08);
  tl.to("#sel", { opacity: 0, duration: 0.05, ease: "steps(1)", yoyo: true, repeat: 5 }, T_WIN + 0.1);
  KZ.flash(tl, "#flash", T_WIN, 0.4, "#ffffff");
  KZ.shake(tl, "#duel", T_WIN, 9, 0.24, 6);
  tl.to("#pAin", { filter: "grayscale(1) brightness(0.45)", duration: 0.2, ease: "steps(3)" }, T_WIN);
  tl.to(["#frA", "#nmA"], { filter: "grayscale(1) brightness(0.55)", duration: 0.2, ease: "steps(3)" }, T_WIN);
  tl.fromTo("#goT", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "steps(4)" }, T_WIN + 0.05);
  tl.to("#pBin", { filter: "brightness(1.3) saturate(1.2)", duration: 0.2 }, T_WIN);
  tl.fromTo("#pkT", { scale: 1.8, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.25, ease: "back.out(2.5)" }, b(17));
  KZ.punch(tl, "#nmB", T_WIN, 1.08, 0.4);

  /* NA REAL… */
  tl.to(["#gameover", "#picked"], { opacity: 0, duration: 0.12 }, T_REAL - 0.1);
  tl.to("#vsW", { scale: 0, duration: 0.14, ease: "power3.in" }, T_REAL - 0.12);
  tl.to(["#pAin", "#frA", "#nmA", "#pBin"], { filter: "grayscale(0) brightness(1) saturate(1)", duration: 0.2 }, T_REAL);
  tl.fromTo("#realBand", { scaleX: 0, rotation: 4 }, { scaleX: 1, rotation: 4, duration: 0.16, ease: "power3.out" }, T_REAL);
  tl.fromTo("#realT", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "steps(4)" }, T_REAL + 0.06);
  tl.to("#realBand", { scaleY: 0, duration: 0.18, ease: "power3.in" }, T_TW - 0.2);
  tl.to("#headT", { opacity: 0, duration: 0.1 }, T_REAL - 0.1);
  tl.to(["#pA", "#frA", "#nmA"], { y: 240, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);
  tl.to(["#pB", "#frB", "#nmB", "#frTag"], { y: -240, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);

  /* TWIST */
  KZ.flash(tl, "#flash", T_TW, 0.6, "#3df5ff");
  KZ.slam(tl, "#tw1", T_TW, 1.8);
  KZ.slam(tl, "#tw2", b(23), 1.8);
  KZ.slam(tl, "#tw3", b(24), 2.0);
  tl.fromTo("#twWatch", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, b(24.5));
  [["#rg1", b(25.5)], ["#rg2", b(26)]].forEach(function (p) {
    tl.fromTo(p[0], { opacity: 0 }, { opacity: 0.9, duration: 0.03 }, p[1]);
    tl.fromTo(p[0], { scale: 1 }, { scale: 1.3, duration: 0.45, ease: "power2.out" }, p[1]);
    tl.to(p[0], { opacity: 0, duration: 0.3 }, p[1] + 0.15);
  });
  KZ.shake(tl, "#twWatch", b(25.5), 8, 0.5, 31);
  tl.fromTo("#twTag", { opacity: 0 }, { opacity: 1, duration: 0.2 }, b(24.8));
  tl.to("#twIn", { scale: 1.04, duration: 0.6, ease: "power1.inOut" }, b(26.4));
  tl.to("#twIn", { opacity: 0, duration: 0.18, ease: "power2.in" }, T_PR - 0.18);

  /* PROOF */
  KZ.pop(tl, "#prTagIn", T_PR + 0.05, 0.3);
  tl.fromTo("#prW", { scale: 0.6, opacity: 0, rotation: 4 }, { scale: 1, opacity: 1, rotation: 1.5, duration: 0.4, ease: "back.out(1.7)" }, T_PR);
  KZ.rise(tl, "#prLine", b(29.5), 0.35, 40);
  tl.to("#prW", { scale: 1.03, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_PR + 0.5);
