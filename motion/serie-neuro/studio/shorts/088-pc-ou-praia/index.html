<script>
  function confetti(tl, sel, at, seed, n, cx, cy, colors) {
    const c = document.querySelector(sel); const r = KZ.rng(seed);
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div"); d.className = "conf";
      d.style.left = cx + "px"; d.style.top = cy + "px"; d.style.background = colors[i % colors.length];
      c.appendChild(d);
      const ang = -Math.PI / 2 + (r() - 0.5) * 2.4, sp = 380 + r() * 420, dur = 0.9 + r() * 0.5;
      tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.02 }, at);
      tl.fromTo(d, { x: 0, y: 0, rotation: 0 }, { x: Math.cos(ang) * sp, y: Math.sin(ang) * sp + 520, rotation: (r() - 0.5) * 900, duration: dur, ease: "power1.out" }, at);
      tl.to(d, { opacity: 0, duration: 0.3 }, at + dur - 0.3);
    }
  }
  const tl = gsap.timeline({ paused: true });
  const D = 18.21;
  const b = KZ.beats(145);
  const T_A = b(4), T_B = b(8), T_CH = b(12), T_WIN = b(16), T_REAL = b(20), T_TW = b(22), T_PR = b(28), T_END = b(36);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#rays", { rotation: 0 }, { rotation: 90, duration: T_TW, ease: "none" }, 0);
  tl.fromTo("#w1", { x: -30 }, { x: 30, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
  tl.fromTo("#w2", { x: 30 }, { x: -30, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 8 }, 0);

  /* HOOK */
  tl.fromTo("#duel", { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0);
  tl.fromTo("#pill", { scale: 1.6, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#mon", { y: -80, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.26, ease: "power4.out" }, 0);
  tl.fromTo("#card", { y: 120, rotation: 4, opacity: 0.6 }, { y: 0, rotation: -2, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.06);
  tl.fromTo("#praia", { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.12);
  tl.fromTo("#seam", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 0);
  tl.fromTo("#vs", { scale: 2.4, rotation: -30, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.16);
  tl.to("#card", { rotation: -1, y: -6, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.5);

  /* A: the whole Saturday passes in front of the PC */
  const ck = document.querySelector("#clkT"), ho = { h: 14 };
  tl.fromTo(ho, { h: 14 }, { h: 23, duration: 1.4, ease: "power1.in", onUpdate: function () { ck.textContent = String(Math.floor(ho.h)).padStart(2, "0") + ":00"; } }, T_A);
  tl.to("#sunbeam", { opacity: 0, scaleX: 0.6, duration: 1.4, ease: "power1.in" }, T_A);
  tl.to(".slat", { opacity: 0.15, duration: 1.4, ease: "power1.in" }, T_A);
  tl.to("#pAin .bgfx", { filter: "brightness(0.7)", duration: 1.4 }, T_A);
  KZ.punch(tl, "#mon", T_A + 1.45, 1.04, 0.3);

  /* B: real print taped to the postcard */
  tl.fromTo("#qtW", { y: 260, rotation: 8, opacity: 0 }, { y: 0, rotation: -2, opacity: 1, duration: 0.38, ease: "back.out(1.7)" }, T_B);
  tl.fromTo("#sun", { scale: 1 }, { scale: 1.12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, T_B);

  /* CHOOSER */
  const POS_B = 900 - 330;
  tl.fromTo("#sel", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.05 }, T_CH);
  [[b(13), POS_B], [b(14), 0], [b(14.5), POS_B], [b(15), 0]].forEach(function (p) { tl.to("#sel", { y: p[1], duration: 0.1, ease: "power3.out" }, p[0]); });

  /* B WINS */
  tl.to("#sel", { y: POS_B, duration: 0.1, ease: "power3.out" }, T_WIN - 0.1);
  tl.to("#sel", { opacity: 0, duration: 0.3 }, T_WIN + 0.5);
  KZ.flash(tl, "#flash", T_WIN, 0.4, "#fff3c4");
  KZ.shake(tl, "#duel", T_WIN, 9, 0.24, 8);
  tl.to("#scrOff", { opacity: 0.92, duration: 0.12, ease: "steps(2)" }, T_WIN);
  tl.to("#pAin", { filter: "grayscale(0.7) brightness(0.6)", duration: 0.25 }, T_WIN);
  tl.fromTo("#postIn", { scale: 2.4, opacity: 0, rotation: 6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.14, ease: "power3.in" }, T_WIN - 0.04);
  tl.to("#rays", { scale: 1.6, opacity: 1, duration: 0.4, ease: "power2.out" }, T_WIN);
  confetti(tl, "#confB", T_WIN + 0.05, 88, 26, 500, 1220, ["#ffd23f", "#10b5c9", "#ffffff", "#ff4f6d"]);

  /* NA REAL… */
  tl.to(["#post"], { opacity: 0, duration: 0.12 }, T_REAL - 0.1);
  tl.to("#vsW", { scale: 0, duration: 0.14, ease: "power3.in" }, T_REAL - 0.12);
  tl.to("#pill", { scale: 0.001, opacity: 0, duration: 0.12 }, T_REAL - 0.1);
  tl.to("#pAin", { filter: "grayscale(0) brightness(1)", duration: 0.25 }, T_REAL);
  tl.to("#scrOff", { opacity: 0, duration: 0.1 }, T_REAL);
  tl.fromTo("#realBand", { scaleX: 0, rotation: -4 }, { scaleX: 1, rotation: -4, duration: 0.16, ease: "power3.out" }, T_REAL);
  tl.fromTo("#realT", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, T_REAL + 0.06);
  tl.to("#realBand", { scaleY: 0, duration: 0.18, ease: "power3.in" }, T_TW - 0.2);
  tl.to("#pA", { y: 240, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);
  tl.to(["#pB", "#card", "#qtW"], { y: -240, duration: 0.3, ease: "power3.in" }, T_TW - 0.32);

  /* TWIST */
  KZ.flash(tl, "#flash", T_TW, 0.6, "#ffd29a");
  KZ.slam(tl, "#tw1", T_TW, 1.8);
  KZ.slam(tl, "#tw2", b(23.2), 1.8);
  KZ.slam(tl, "#tw3", b(24), 2.2);
  tl.fromTo("#twHead", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, b(25));
  KZ.eyePulse(tl, "#eyeT", b(25.6), 2);
  tl.to("#twIn", { opacity: 0, duration: 0.18, ease: "power2.in" }, T_PR - 0.18);

  /* PROOF */
  KZ.pop(tl, "#prTagIn", T_PR + 0.05, 0.3);
  tl.fromTo("#prW", { scale: 0.6, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: -1, duration: 0.4, ease: "back.out(1.7)" }, T_PR);
  tl.fromTo("#prAl", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, T_PR + 0.45);
  KZ.rise(tl, "#prLine", b(29.5), 0.35, 40);
  tl.to("#prW", { scale: 1.03, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_PR + 0.5);
  tl.to("#prIn", { scale: 0.94, opacity: 0, duration: 0.2, ease: "power2.in" }, T_END - 0.2);

  /* END CARD */
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T_END + 0.02);
  KZ.eyePulse(tl, "#eye2", T_END + 0.12, 2);
  KZ.rise(tl, "#endUrl", T_END + 0.32, 0.35, 30);
  KZ.rise(tl, "#endAsk", T_END + 0.6, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_END + 0.6);
  KZ.eyePulse(tl, "#eye2", T_END + 1.9, 1);
  tl.to("#endIn", { scale: 0.92, opacity: 0, duration: 0.22, ease: "power2.in" }, D - 0.3);
  // loop bridge: the two corners close back in, so the replay lands on the split hook
  tl.fromTo("#brA", { yPercent: -100 }, { yPercent: 0, duration: 0.3, ease: "power3.in" }, D - 0.32);
  tl.fromTo("#brB", { yPercent: 100 }, { yPercent: 0, duration: 0.3, ease: "power3.in" }, D - 0.32);

  window.__timelines["main"] = tl;
</script>
