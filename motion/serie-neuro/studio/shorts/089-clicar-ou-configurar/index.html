<body>

      <div class="prod" id="prodA" style="left:118px">
        <div class="ico" id="icoA"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="6" /><path d="M12 3v6" /></svg></div>
        <div class="lab"><div id="a1">Clicar</div><div id="a2">8 mil vezes</div></div>

        <div class="plus" id="pl1" style="left:560px; top:250px">+1</div><div class="plus" id="pl2" style="left:620px; top:280px">+1</div><div class="plus" id="pl3" style="left:680px; top:240px">+1</div>
      </div>
      <div class="prod" id="prodB" style="left:118px">
        <div class="ico" id="icoB"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg></div>
        <div class="lab"><div id="b1">Configurar</div><div id="b2">uma vez?</div></div>

    <div id="brA" style="position:absolute; left:0; right:0; top:0; height:750px; background:linear-gradient(90deg, #26343f 0%, #3a4b58 8%, #1c262e 30%, #141c22 100%); z-index:20"></div>
    <div id="brB" style="position:absolute; left:0; right:0; top:750px; bottom:0; background:linear-gradient(90deg, #1c262e 0%, #26343f 10%, #141c22 40%, #0b1013 100%); z-index:20"></div>

<script>
  const tl = gsap.timeline({ paused: true });
  const D = 18.21;
  const b = KZ.beats(145);
  const T_A = b(4), T_B = b(8), T_CH = b(12), T_WIN = b(16), T_REAL = b(20), T_TW = b(22), T_PR = b(28), T_END = b(36);

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#glare", { x: 0, rotation: 18 }, { x: 1300, rotation: 18, duration: 2.6, ease: "power1.inOut", repeat: 2, repeatDelay: 0.6 }, 0.2);

  /* HOOK */
  tl.fromTo("#duel", { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0);
  tl.fromTo("#marqT", { opacity: 0.3 }, { opacity: 1, duration: 0.18, ease: "steps(3)" }, 0);
  tl.fromTo("#prodA", { y: -60, opacity: 0.55 }, { y: 0, opacity: 1, duration: 0.26, ease: "power4.out" }, 0);
  tl.fromTo("#prodB", { y: 60, opacity: 0.55 }, { y: 0, opacity: 1, duration: 0.26, ease: "power4.out" }, 0.08);
  tl.fromTo("#vs", { scale: 2.4, rotation: -200, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.34, ease: "back.out(1.8)" }, 0.14);
  tl.to("#vs", { rotationY: 360, duration: 1.2, ease: "power1.inOut", repeat: 2, repeatDelay: 0.5 }, 0.8);

  /* A: the click counter explodes */
  tl.fromTo("#ctr", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, T_A);
  const cEl = document.querySelector("#ctr"), co = { v: 0 };
  tl.fromTo(co, { v: 0 }, { v: 8000, duration: 1.3, ease: "power2.in", onUpdate: function () { cEl.textContent = KZ.fmt(co.v, "int"); } }, T_A + 0.1);
  KZ.shake(tl, "#icoA", T_A + 0.2, 7, 1.2, 41);
  ["#pl1", "#pl2", "#pl3"].forEach(function (p, i) {
    for (let k = 0; k < 3; k++) {
      const t = T_A + 0.2 + i * 0.11 + k * 0.38;
      if (k === 0) tl.fromTo(p, { y: 0, opacity: 0 }, { y: -60, opacity: 1, duration: 0.18, ease: "power2.out" }, t);
      else tl.fromTo(p, { y: 0, opacity: 1 }, { y: -60, opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
      tl.to(p, { opacity: 0, duration: 0.12 }, t + 0.18);
    }
  });
  tl.to("#ctr", { color: "#ffffff", backgroundColor: "#ff4a3d", duration: 0.1 }, T_A + 1.4);
  KZ.punch(tl, "#ctr", T_A + 1.4, 1.2, 0.3);

  /* B: one click on SALVAR */
  tl.fromTo("#saveBtn", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)" }, T_B);
  tl.fromTo("#cur", { opacity: 0, x: 140, y: 120 }, { opacity: 1, x: 0, y: 0, duration: 0.35, ease: "power3.out" }, T_B + 0.1);
  tl.to("#cur", { scale: 0.85, duration: 0.06 }, b(9));
  tl.to("#cur", { scale: 1, duration: 0.12 }, b(9) + 0.06);
  tl.to("#saveBtn", { scale: 0.9, duration: 0.06 }, b(9));
  tl.to("#saveBtn", { opacity: 0, duration: 0.08 }, b(9) + 0.08);
  tl.fromTo("#okB", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, b(9) + 0.06);
  tl.to("#cur", { opacity: 0, duration: 0.2 }, b(10.5));

  /* CHOOSER: keypad + shelf glow alternate */
  [[T_CH, "A"], [b(13), "B"], [b(14), "A"], [b(14.5), "B"], [b(15), "A"]].forEach(function (p, i, arr) {
    const nxt = (arr[i + 1] ? arr[i + 1][0] : T_WIN) - 0.02;
    tl.to("#fr" + p[1], { opacity: 1, duration: 0.04 }, p[0]);
    tl.to("#key" + p[1] + " .lit", { opacity: 1, duration: 0.04 }, p[0]);
    tl.to("#fr" + p[1], { opacity: 0, duration: 0.04 }, nxt);
    tl.to("#key" + p[1] + " .lit", { opacity: 0, duration: 0.04 }, nxt);
  });

  /* B WINS: B2 pressed, product B drops into the tray; A is "ESGOTADO" */
  tl.to("#frB", { opacity: 1, duration: 0.04 }, T_WIN);
  tl.to("#keyB .lit", { opacity: 1, duration: 0.04 }, T_WIN);
  tl.to("#keyB", { scale: 0.88, duration: 0.06 }, T_WIN);
  tl.to("#keyB", { scale: 1, duration: 0.2 }, T_WIN + 0.08);
  KZ.flash(tl, "#flash", T_WIN, 0.35, "#e9dcff");
  tl.to("#frB", { opacity: 0, duration: 0.2 }, T_WIN + 0.2);
  tl.to("#prodB", { x: 137, y: 406, scale: 0.62, transformOrigin: "0% 0%", duration: 0.45, ease: "bounce.out" }, T_WIN + 0.15);
  tl.to("#flap", { opacity: 0, duration: 0.1 }, T_WIN + 0.15);
  KZ.shake(tl, "#duel", T_WIN + 0.5, 7, 0.2, 9);
  tl.to("#prodA", { filter: "grayscale(0.85) brightness(0.55)", duration: 0.2 }, T_WIN);
  tl.fromTo("#esgT", { scale: 2.4, opacity: 0, rotation: 4 }, { scale: 1, opacity: 1, rotation: -9, duration: 0.14, ease: "power3.in" }, b(17) - 0.14);

  /* NA REAL… */
  tl.to("#esg", { opacity: 0, duration: 0.12 }, T_REAL - 0.1);
  tl.to("#vsW", { scale: 0, duration: 0.14, ease: "power3.in" }, T_REAL - 0.12);
