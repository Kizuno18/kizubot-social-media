<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>106 Ele não botou fé</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F14 PROVA REAL — "Pop Bold" system (episode dominant = purple) ===== */
  :root { --dom: #8a3cff; --dom-dark: #5d1fd1; --lime: #c6ff3d; --pink: #ff4fd8; --ink: #111111; --paper: #ffffff; }
  #root { background: var(--dom); }
  .pb-bg { position: absolute; inset: 0; background: var(--dom); }
  .pb-dots { position: absolute; inset: -200px; background-image: radial-gradient(rgba(17, 17, 17, 0.16) 3px, transparent 3.5px); background-size: 34px 34px; }
  .pb-blob { position: absolute; border: 5px solid var(--ink); border-radius: 50%; }
  .pb-type { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
    text-shadow: 9px 9px 0 var(--ink); letter-spacing: -0.01em; }
  .pb-chip { display: inline-block; background: var(--ink); color: var(--lime); font: 800 34px "Bricolage Grotesque", sans-serif; letter-spacing: 0.06em;
    padding: 12px 24px 14px; border-radius: 14px; text-transform: uppercase; }
  .pb-block { display: inline-block; background: var(--lime); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 var(--ink);
    border-radius: 18px; -webkit-text-stroke: 0; text-shadow: none; }
  .pb-sticker { position: absolute; display: block; }
  .pb-sticker svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pb-sticker .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    font: 800 30px/1.0 "Bricolage Grotesque", sans-serif; color: var(--ink); text-transform: uppercase; }

  /* hook */
  .pb-hook { position: absolute; left: 90px; right: 90px; top: 250px; height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .hk1 { font-size: 160px; line-height: 1.08; display: block; }
  .hk2 { display: flex; align-items: center; gap: 16px; }
  .hk2 .w { font-size: 160px; line-height: 1.08; display: block; }
  .hk2 .pb-block { font: 800 150px/1.1 "Bricolage Grotesque", sans-serif; padding: 0 24px 6px; display: block; }

  /* story: quote block on top, print card below */
  .pb-quote { position: absolute; left: 90px; right: 120px; top: 258px; height: 300px; display: flex; align-items: center; justify-content: center; }
  .q { position: absolute; display: block; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); border-radius: 26px; box-shadow: 12px 12px 0 var(--ink);
    padding: 22px 34px 26px; font: 800 82px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.015em; opacity: 0; max-width: 860px; text-align: left; }
  .q .tail { position: absolute; left: 70px; bottom: -34px; width: 50px; height: 34px; }
  .q .mk { background-image: linear-gradient(transparent 58%, var(--lime) 58%, var(--lime) 92%, transparent 92%); background-repeat: no-repeat; background-size: 0% 100%; }
  .q .sm { font-size: 60px; }
  .q.big { font-size: 104px; }
  .chip2 { position: absolute; display: block; background: var(--ink); color: var(--lime); font: 800 56px/1.0 "Bricolage Grotesque", sans-serif; white-space: nowrap;
    padding: 14px 28px 18px; border-radius: 16px; opacity: 0; }

  .pb-card { position: absolute; left: 96px; top: 604px; width: 780px; height: 790px; background: var(--paper); border: 5px solid var(--ink); border-radius: 30px;
    box-shadow: 14px 14px 0 var(--ink); padding: 14px; }
  .vp { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 18px; background: #161717; }
  .cam { position: absolute; left: 0; top: 0; width: 742px; transform-origin: 0 0; }
  .cam img { display: block; width: 742px; }
  .hlb { position: absolute; border: 6px solid var(--lime); border-radius: 14px; box-shadow: 0 0 0 4px var(--ink); transform-origin: 0% 50%; opacity: 0; }
  .tab { position: absolute; left: 30px; top: -28px; background: var(--ink); color: #fff; font: 800 30px "Bricolage Grotesque", sans-serif; letter-spacing: 0.05em;
    padding: 8px 20px 10px; border-radius: 12px; text-transform: uppercase; z-index: 3; }
  .rehook { position: absolute; left: 90px; right: 90px; top: 268px; height: 300px; text-align: center; display: flex; align-items: center; justify-content: center; }
  .rh { font-size: 132px; line-height: 1.08; display: block; opacity: 0; }

  /* end card */
  .pb-end-bg { position: absolute; inset: 0; background: var(--ink); }
  .pb-end-dots { position: absolute; inset: -100px; background-image: radial-gradient(rgba(198, 255, 61, 0.12) 3px, transparent 3.5px); background-size: 34px 34px; }
  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(244, 214, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; }
  .pb-ask { font: 800 76px/1.1 "Bricolage Grotesque", sans-serif; color: #fff; max-width: 800px; }
  .pb-ask b { color: var(--lime); }
  .pb-url { font: 800 64px "Bricolage Grotesque", sans-serif; color: #fff; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
  #wipe { position: absolute; left: 540px; top: 960px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ink); z-index: 40; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="15.69" data-fps="30">
  <div class="pb-bg"></div>
  <div class="pb-dots" id="dots"></div>
  <div class="pb-blob" id="blobA" style="left:-160px; top:1240px; width:420px; height:420px; background: var(--lime);"></div>
  <div class="pb-blob" id="blobB" style="right:-120px; top:120px; width:300px; height:300px; background: var(--pink);"></div>

  <!-- HOOK 0 – b4 -->
  <section id="s0" class="clip" data-start="0" data-duration="1.846">
    <div class="pb-hook" id="hk">
      <span class="pb-chip" id="bug" style="margin-bottom: 34px">Prova real</span>
      <span class="pb-type hk1" id="hk1">ELE NÃO</span>
      <div class="hk2"><span class="pb-type w" id="hk2a">BOTOU</span><span class="pb-block" id="hk2b">FÉ.</span></div>
    </div>
    <div class="pb-sticker" id="stA" style="left:96px; top:1010px; width:230px; height:230px;">
      <svg viewBox="-50 -50 100 100"><polygon id="starA" fill="#ff4fd8" stroke="#111" stroke-width="3.5" stroke-linejoin="round" points=""/></svg>
    </div>
  </section>

  <!-- STORY b4 – b28 : one real chat, the camera walks down it -->
  <section id="s1" class="clip" data-start="1.846" data-duration="11.077">
    <div class="pb-quote">
      <div class="q" id="q1">“Eu <span class="mk" id="mk1">não botei fé</span>”<svg class="tail" viewBox="0 0 50 34"><polygon points="0,0 50,0 6,34" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg></div>
      <div class="q big" id="q3">“Bot <span class="mk" id="mk3">joga muito</span> kkk”<svg class="tail" viewBox="0 0 50 34"><polygon points="0,0 50,0 6,34" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg></div>
      <div class="q" id="q4" style="font-size:66px; top:-8px">“o mais top é <span class="mk" id="mk4">bagulho ser virtual</span>”<svg class="tail" viewBox="0 0 50 34"><polygon points="0,0 50,0 6,34" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg></div>
      <div class="chip2" id="c4" style="left:30px; top:206px">= roda com PC desligado</div>
      <div class="q" id="q5a" style="left:0px; top:16px; font-size:70px; white-space:nowrap">“Os <span class="mk" id="mk5">alertas</span>”</div>
      <div class="q" id="q5b" style="left:440px; top:16px; font-size:70px; white-space:nowrap">“No waths”</div>
      <div class="chip2" id="c5" style="left:24px; top:196px">= alarme no WhatsApp</div>
    </div>
    <div class="rehook"><span class="pb-type rh" id="rh">7 DIAS<span style="display:block">DEPOIS…</span></span></div>
    <div id="cardWrap" style="position:absolute; inset:0;">
    <div class="pb-card" id="card">
      <div class="tab">print real de cliente</div>
      <div class="vp">
        <div class="cam" id="cam">
          <img src="kit/img/prints/bot-joga-muito--nao-botei-fe.png" alt="" /><img src="kit/img/prints/bot-joga-muito--quote.png" alt="" />
          <div class="hlb" id="hb1" style="left:4px; top:76px; width:300px; height:52px"></div>
          <div class="hlb" id="hb2" style="left:170px; top:286px; width:568px; height:54px"></div>
          <div class="hlb" id="hb3" style="left:4px; top:617px; width:330px; height:52px"></div>
          <div class="hlb" id="hb4" style="left:4px; top:686px; width:642px; height:52px"></div>
          <div class="hlb" id="hb5" style="left:4px; top:752px; width:212px; height:122px"></div>
        </div>
      </div>
      <div class="pb-sticker" id="stB" style="right:-56px; top:-70px; width:190px; height:190px;">
        <svg viewBox="-50 -50 100 100"><polygon id="starB" fill="#c6ff3d" stroke="#111" stroke-width="3.5" stroke-linejoin="round" points=""/></svg>
        <div class="lbl"><span style="display:block">print<span style="display:block">real</span></span></div>
      </div>
    </div>
    </div>
  </section>

  <!-- END b28 – D -->
  <section id="se" class="clip" data-start="12.923" data-duration="2.767">
    <div class="pb-end-bg"></div>
    <div class="pb-end-dots" id="edots"></div>
    <div class="kz-end" id="sein">
      <div style="position:relative; width:560px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" />
        <div class="eye" id="eye2" style="left:177px; top:8px"></div>
      </div>
      <div class="pb-url" id="endUrl">kizubot.com</div>
      <div class="pb-ask" id="endAsk">Você <b>botaria fé?</b></div>
    </div>
  </section>

  <div id="wipe"></div>
  <div id="flash"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 15.69;
  const B = 60 / 130;                    // funk 130: beat 0.4615 s
  const b = (n) => n * B;

  // star polygons (12 points)
  function starPts(n, r1, r2) {
    const p = [];
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? r2 : r1, a = (Math.PI * i) / n - Math.PI / 2;
      p.push((Math.cos(a) * r).toFixed(2) + "," + (Math.sin(a) * r).toFixed(2));
    }
    return p.join(" ");
  }
  document.getElementById("starA").setAttribute("points", starPts(12, 47, 30));
  document.getElementById("starB").setAttribute("points", starPts(14, 48, 36));

  // ambient
  KZ.drift(tl, "#dots", D, 30, 40, 4.6);
  tl.fromTo("#blobA", { rotation: 0, scale: 1 }, { rotation: 40, scale: 1.08, duration: D, ease: "sine.inOut" }, 0);
  tl.fromTo("#blobB", { y: 0 }, { y: 60, duration: b(4), ease: "sine.inOut", yoyo: true, repeat: Math.floor(D / b(4)) - 1 }, 0);

  // ---------- HOOK ----------
  tl.fromTo("#hk1", { scale: 1.14 }, { scale: 1, duration: 0.28, ease: "power4.out" }, 0);
  tl.fromTo("#bug", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0.05);
  tl.fromTo("#hk2a", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.18);
  tl.fromTo("#hk2b", { scale: 0.2, rotation: -24, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.42, ease: "back.out(2.6)" }, b(0.65));
  KZ.shake(tl, "#hk", b(0.65) + 0.08, 10, 0.22, 4);
  tl.fromTo("#stA", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, b(2));
  tl.to("#stA", { rotation: 60, duration: 1.2, ease: "none" }, b(2) + 0.45);
  tl.to("#hk", { scale: 1.04, duration: b(1.5), ease: "sine.inOut" }, b(2));
  tl.to(["#hk", "#stA"], { y: -900, duration: 0.24, ease: "power3.in" }, b(4) - 0.24);

  // ---------- STORY ----------
  const S = b(4);
  // camera helper: centre a line of the print (base px) at viewport y=vy, zoom s, x offset
  function cam(at, s, py, x, dur, ease, vy) {
    const y = (vy || 380) - s * py;
    tl.to("#cam", { scale: s, x: x || 0, y: y, duration: dur || 0.5, ease: ease || "power3.inOut" }, at);
  }
  function hl(id, at) { tl.fromTo(id, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.32, ease: "power2.out" }, at); }
  function mark(id, at) { tl.fromTo(id, { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.4, ease: "power2.out" }, at); }
  function qIn(id, at) { tl.fromTo(id, { scale: 0.6, opacity: 0, rotation: -5 }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.36, ease: "back.out(2.2)" }, at); }
  function qOut(id, at) { tl.to(id, { scale: 0.7, opacity: 0, duration: 0.16, ease: "power2.in" }, at); }

  // card slams in, camera already on "Eu não botei fé"
  tl.set("#cam", { scale: 1.5, x: 0, y: 20 }, 0);
  tl.fromTo("#card", { y: 1200, rotation: -9 }, { y: 0, rotation: -1.5, duration: 0.45, ease: "power4.out" }, S);
  tl.fromTo("#stB", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, S + b(1));
  tl.to("#stB", { rotation: 90, duration: 10, ease: "none" }, S + b(1) + 0.42);
  hl("#hb1", S + b(1.6));
  qIn("#q1", S + b(1.5));
  mark("#mk1", S + b(2.2));
  cam(S + b(2.6), 1.62, 230, 0, 1.2, "sine.inOut");
  qOut("#q1", b(9) - 0.16);

  // re-hook: 7 dias depois… camera scrolls to the dev question that names KizuBot
  const R = b(9);
  tl.fromTo("#rh", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, R);
  cam(R, 1.3, 347, 742 - 1.3 * 742, 0.55, "power3.inOut");
  hl("#hb2", R + b(1.2));
  tl.to("#rh", { y: -40, opacity: 0, duration: 0.16, ease: "power2.in" }, b(12) - 0.16);

  // DROP: Bot joga muito kkk
  const P = b(12);
  KZ.flash(tl, "#flash", P, 0.55, "#ff4fd8");
  cam(P - 0.05, 2.05, 643, 0, 0.32, "expo.out");
  qIn("#q3", P);
  KZ.shake(tl, "#cardWrap", P + 0.05, 12, 0.24, 9);
  hl("#hb3", P + b(0.5));
  mark("#mk3", P + b(1));
  tl.to("#q3", { scale: 1.05, duration: b(2), ease: "sine.inOut" }, P + b(1.5));
  qOut("#q3", b(17) - 0.16);

  // o mais top é bagulho ser virtual  (= PC desligado)
  const V = b(17);
  cam(V - 0.1, 1.2, 712, 0, 0.45, "power3.inOut");
  qIn("#q4", V);
  hl("#hb4", V + b(0.8));
  mark("#mk4", V + b(1.4));
  tl.fromTo("#c4", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, V + b(2.6));
  qOut(["#q4", "#c4"], b(23) - 0.16);

  // Os alertas / No waths  (= alarme no WhatsApp)
  const A = b(23);
  cam(A - 0.1, 1.75, 813, 0, 0.45, "power3.inOut");
  qIn("#q5a", A);
  qIn("#q5b", A + b(0.6));
  hl("#hb5", A + b(1));
  mark("#mk5", A + b(1.2));
  tl.fromTo("#c5", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, A + b(2.2));
  // pull back: the whole conversation, all lines lit
  cam(A + b(3.4), 0.82, 446, (742 - 0.82 * 742) / 2, 0.6, "power2.inOut", 376);
  tl.to(["#q5a", "#q5b", "#c5"], { y: -30, opacity: 0, duration: 0.2, ease: "power2.in" }, b(28) - 0.45);

  // iris wipe to the end card
  tl.fromTo("#wipe", { scale: 0, opacity: 1 }, { scale: 460, opacity: 1, duration: 0.42, ease: "power3.in" }, b(28) - 0.42);
  tl.to("#wipe", { opacity: 0, duration: 0.01 }, b(28) + 0.02);

  // ---------- END ----------
  const E = b(28);
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, E + 0.04);
  KZ.eyePulse(tl, "#eye2", E + 0.14, 3);
  KZ.rise(tl, "#endUrl", E + 0.42, 0.35, 30);
  KZ.rise(tl, "#endAsk", E + 0.75, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, E + 0.6);
  KZ.drift(tl, "#edots", D, 20, 30, 3);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
