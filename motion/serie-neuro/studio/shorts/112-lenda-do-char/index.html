<script>
  const tl = gsap.timeline({ paused: true });
  const D = 19.45;
  const b = KZ.beats(145);           // beat = 0.414 s, bar = 1.655 s

  /* ---------- F15 horror helpers (inline, shared by 111-115) ---------- */
  const HZ = {};
  HZ.hash = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // seven-segment LED display (SVG), chars like [" ", "3", ":", "3", "3"]
  HZ.seg = function (el, chars) {
    const T = 16, L = 76, V = 74;
    const h = (cx, cy) => [[cx - L / 2, cy], [cx - L / 2 + T / 2, cy - T / 2], [cx + L / 2 - T / 2, cy - T / 2], [cx + L / 2, cy], [cx + L / 2 - T / 2, cy + T / 2], [cx - L / 2 + T / 2, cy + T / 2]];
    const v = (cx, cy) => [[cx, cy - V / 2], [cx + T / 2, cy - V / 2 + T / 2], [cx + T / 2, cy + V / 2 - T / 2], [cx, cy + V / 2], [cx - T / 2, cy + V / 2 - T / 2], [cx - T / 2, cy - V / 2 + T / 2]];
    const S = { a: h(50, 9), g: h(50, 90), d: h(50, 171), f: v(9, 49.5), b: v(91, 49.5), e: v(9, 130.5), c: v(91, 130.5) };
    const MAP = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc", "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg", " ": "" };
    let x = 26, out = "";
    chars.forEach(function (c) {
      if (c === ":") {
        out += '<g class="colon"><rect class="on" x="' + (x + 4) + '" y="50" width="20" height="20" rx="3" transform="skewX(-8)"/><rect class="on" x="' + (x - 6) + '" y="112" width="20" height="20" rx="3" transform="skewX(-8)"/></g>';
        x += 44; return;
      }
      const on = MAP[c] || "";
      out += '<g transform="translate(' + x + ',0) skewX(-8)">';
      "abcdefg".split("").forEach(function (k) {
        out += '<polygon class="' + (on.indexOf(k) >= 0 ? "on" : "off") + '" points="' + S[k].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
      });
      out += "</g>";
      x += 124;
    });
    el.innerHTML = '<svg viewBox="0 0 ' + (x + 6) + ' 182" width="100%">' + out + "</svg>";
    return el.querySelector("svg");
  };
  // low-res VHS grain redrawn on a quantized clock (pure function of time)
  HZ.grain = function (tl, canvas, D, fps) {
    const ctx = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    const img = ctx.createImageData(W, H);
    let last = -1;
    const draw = function (k) {
      const r = KZ.rng(9000 + k * 7), d = img.data;
      for (let y = 0; y < H; y++) {
        const row = 0.75 + 0.5 * r();          // horizontal streaks
        for (let x2 = 0; x2 < W; x2++) {
          const i = (y * W + x2) * 4, vv = Math.min(255, r() * 255 * row);
          d[i] = d[i + 1] = d[i + 2] = vv; d[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    };
    const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const k = Math.floor(o.t * (fps || 15));
      if (k !== last) { last = k; draw(k); }
    } }, 0);
    draw(0);
  };
  // ambient flicker on an overlay between [from, to): pure function of quantized time
  HZ.flicker = function (tl, el, from, to, seed, strength, rate) {
    const o = { t: from };
    tl.fromTo(o, { t: from }, { t: to, duration: to - from, ease: "none", immediateRender: false, onUpdate: function () {
      if (o.t <= from + 0.001) { el.style.opacity = "0"; return; }
      const k = Math.floor(o.t * (rate || 15));
      const hsh = HZ.hash(k * 3.17 + seed);
      el.style.opacity = hsh > 0.88 ? (strength * (0.45 + 0.55 * HZ.hash(k + seed * 2))).toFixed(3) : "0";
    } }, from);
    tl.set(el, { opacity: 0 }, to);
  };
  // RGB-split jitter on a .gl stack (base stays legible)
  HZ.glitch = function (tl, stack, at, dur, amp) {
    const el = typeof stack === "string" ? document.querySelector(stack) : stack;
    const copies = el.querySelectorAll(".gr, .gc");
    const o = { a: 0 };
    tl.set(copies, { opacity: 0.85 }, at);
    tl.fromTo(o, { a: 1 }, { a: 0, duration: dur, ease: "power3.in", immediateRender: false, onUpdate: function () {
      const step = Math.floor(tl.time() * 30);
      copies.forEach(function (c, i) {
        gsap.set(c, { x: (HZ.hash(step * 13 + i * 7) * 2 - 1) * (amp || 12) * o.a, y: (HZ.hash(step * 29 + i * 11) * 2 - 1) * (amp || 12) * 0.35 * o.a });
      });
    } }, at);
    tl.set(copies, { x: 0, y: 0, opacity: 0 }, at + dur);
  };
  // VHS tracking band sweep + tear jitter on a target
  HZ.track = function (tl, at, dur, target, seed) {
    tl.fromTo("#track", { y: -160, opacity: 0.9 }, { y: 1960, opacity: 0.9, duration: dur, ease: "none", immediateRender: false }, at);
    tl.set("#track", { opacity: 0 }, at + dur);
    if (target) {
      const n = 5;
      for (let i = 0; i < n; i++) tl.set(target, { x: (HZ.hash(seed * 5 + i) * 2 - 1) * 26, skewX: (HZ.hash(seed * 9 + i) * 2 - 1) * 4 }, at + i * 0.033);
      tl.set(target, { x: 0, skewX: 0 }, at + n * 0.033);
    }
  };
  // typed narration line
  HZ.type = function (tl, el, text, at, cps) { KZ.typewriter(tl, el, text, at, cps || 40); };
  // gold sparkle burst (deterministic)
  HZ.sparks = function (tl, box, n, at, cx, cy, seed, color) {
    const r = KZ.rng(seed);
    for (let i = 0; i < n; i++) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 40 40"); s.setAttribute("class", "spark");
      s.innerHTML = '<path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" fill="' + (color || "#ffd25a") + '"/>';
      box.appendChild(s);
      const ang = r() * Math.PI * 2, dist = 180 + r() * 360, sc = 0.5 + r() * 1.1;
      tl.fromTo(s, { x: cx - 20, y: cy - 20, scale: 0, opacity: 1, rotation: 0 },
        { x: cx - 20 + Math.cos(ang) * dist, y: cy - 20 + Math.sin(ang) * dist * 0.8 + 60, scale: sc, rotation: r() * 180, duration: 0.9 + r() * 0.5, ease: "power3.out" }, at + r() * 0.08);
      tl.to(s, { opacity: 0, scale: 0, duration: 0.35, ease: "power2.in" }, at + 0.9 + r() * 0.4);
    }
  };


  /* ---------- the night map (deterministic) ---------- */
  const WP = [[160, 620], [300, 520], [470, 560], [620, 440], [780, 470], [840, 330], [700, 230], [520, 280], [360, 230], [210, 330], [160, 470], [160, 620]];
  (function () {
    const r = KZ.rng(112);
    let s = '<rect width="1000" height="800" fill="#0a1d18"/>';
    for (let i = 0; i < 260; i++) s += '<rect x="' + (r() * 1000).toFixed(0) + '" y="' + (r() * 800).toFixed(0) + '" width="' + (4 + r() * 10).toFixed(0) + '" height="3" fill="#123128" opacity="0.8"/>';
    for (let i = 0; i < 26; i++) {
      const x = r() * 1000, y = r() * 800, rr = 26 + r() * 40;
      let near = false; WP.forEach(function (p) { if (Math.hypot(p[0] - x, p[1] - y) < rr + 40) near = true; });
      if (near) continue;
      s += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + rr.toFixed(0) + '" fill="#06120e"/><circle cx="' + (x - rr * 0.25).toFixed(0) + '" cy="' + (y - rr * 0.3).toFixed(0) + '" r="' + (rr * 0.55).toFixed(0) + '" fill="#0e2a22"/>';
    }
    s += '<polyline points="' + WP.map(function (p) { return p.join(","); }).join(" ") + '" fill="none" stroke="#e6d28a" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round" opacity="0.55"/>';
    WP.slice(0, -1).forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="7" fill="none" stroke="#e6d28a" stroke-width="3" opacity="0.6"/>'; });
    document.getElementById("mapSvg").innerHTML = s;
  })();
  // char walks the route: position is a pure function of time
  const charEl = document.getElementById("char");
  const segs = []; let tot = 0;
  for (let i = 0; i < WP.length - 1; i++) { const L = Math.hypot(WP[i + 1][0] - WP[i][0], WP[i + 1][1] - WP[i][1]); segs.push(L); tot += L; }
  function placeChar(t) {
    let d = (t * 120) % tot, i = 0;
    while (d > segs[i]) { d -= segs[i]; i++; }
    const f = d / segs[i], x = WP[i][0] + (WP[i + 1][0] - WP[i][0]) * f, y = WP[i][1] + (WP[i + 1][1] - WP[i][1]) * f;
    const bob = Math.abs(Math.sin(t * 9)) * 4;
    charEl.style.transform = "translate(" + (x - 22).toFixed(1) + "px," + (y - 58 - bob).toFixed(1) + "px) scale(1.5)";
    return [x, y];
  }
  placeChar(0);

  /* ---------- global ---------- */
  KZ.progress(tl, "#prog", 0, D - 0.05);
  HZ.grain(tl, document.getElementById("grain"), D, 10);
  tl.fromTo("#vig", { scale: 1, opacity: 1 }, { scale: 1.06, opacity: 0.85, duration: b(6), ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
  const carets = document.querySelectorAll(".hz-caret"), hud = document.getElementById("scrHud");
  const clk = { t: 0 };
  tl.fromTo(clk, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
    const on = Math.floor(clk.t * 3.4) % 2 === 0;
    carets.forEach(function (c) { c.style.opacity = on ? 1 : 0; });
    placeChar(Math.min(clk.t, 9.931));
    hud.textContent = clk.t < 7.03 ? (clk.t < 4.97 ? "23:58" : "02:17") : (clk.t < 8.69 ? "04:00" : "25/12 04:00");
  } }, 0);

  /* ---------- hook ---------- */
  tl.fromTo("#hk1", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.04);
  tl.fromTo("#hk2", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.2);
  KZ.shake(tl, "#hk2", 0.44, 10, 0.24, 3);
  tl.fromTo("#crt", { scale: 0.96 }, { scale: 1.0, duration: 2.4, ease: "none" }, 0);
  HZ.track(tl, 1.6, 0.4, null, 1);
  tl.to(["#hk1", "#hk2"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 2.483 - 0.14);

  /* ---------- the legend ---------- */
  const L = [["#n1w", "#n1", "Dizem que ele caça 24h por dia.", 2.483], ["#n2w", "#n2", "Ninguém nunca viu ele parar.", 4.966], ["#n3w", "#n3", "Nem às 4h da manhã.", 7.034], ["#n4w", "#n4", "Nem no Natal.", 8.69]];
  L.forEach(function (l, i) {
    tl.set(l[0], { opacity: 1 }, l[3]);
    HZ.type(tl, l[1], l[2], l[3] + 0.05, 48);
    const end = i < 3 ? L[i + 1][3] : 9.5;
    tl.set(l[0], { opacity: 0 }, end);
  });
  tl.fromTo("#map", { scale: 1.0 }, { scale: 1.35, duration: 9.9, ease: "power1.in" }, 0);
  // brand foreshadowing: the char's eye glints once
  tl.fromTo("#charEye", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 3.45);
  tl.to("#charEye", { opacity: 0, duration: 0.15 }, 3.75);
  HZ.flicker(tl, document.getElementById("flick"), 2.5, 9.4, 112, 0.45, 14);
  HZ.track(tl, 6.95, 0.35, "#crt", 2);
  HZ.track(tl, 8.6, 0.35, "#crt", 3);
  tl.to("#crt", { scale: 1.12, duration: 0.6, ease: "power2.in" }, 9.3);
  tl.set("#flick", { opacity: 0.92 }, 9.6);
  tl.set("#flick", { opacity: 0 }, 9.931);

  /* ---------- twist: it's YOUR char (the camera dives into the map) ---------- */
  const TW = 9.931;
  const cp = placeChar(TW); placeChar(0);
  KZ.flash(tl, "#flash", TW, 0.85, "#efe0ff");
  tl.set("#bgViolet", { opacity: 1 }, TW);
  tl.set("#grain", { opacity: 0.02 }, TW);
  tl.set(["#osd1", "#osdTc"], { opacity: 0 }, TW);
  tl.to("#crt", { scale: 1.0, duration: 0.3, ease: "power2.out" }, TW);
  tl.set("#map", { transformOrigin: cp[0] + "px " + (cp[1] - 30) + "px" }, TW);
  tl.fromTo("#map", { scale: 1.35, x: 0, y: 0 }, { scale: 3.0, x: 400 - (cp[0] - 100), y: 400 - (cp[1] - 100), duration: 0.5, ease: "power4.out", immediateRender: false }, TW);
  tl.set("#charEye", { opacity: 1 }, TW);
  tl.fromTo("#ring", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, TW + 0.1);
  tl.fromTo("#plate", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, TW + 0.35);
  tl.to("#lantern", { opacity: 0, duration: 0.3 }, TW);
  tl.to("#scrHud", { opacity: 0, duration: 0.2 }, TW);
  tl.fromTo("#charEye", { scale: 1 }, { scale: 1.6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, TW + 0.1);
  KZ.shake(tl, "#crt", TW + 0.03, 12, 0.3, 11);
  tl.fromTo("#tw1", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, 10.345);
  KZ.pop(tl, "#ch1", 11.1, 0.35);
  KZ.pop(tl, "#ch2", 11.3, 0.35);
  tl.to("#crt", { opacity: 0, scale: 0.94, duration: 0.14, ease: "power2.in" }, 12.414 - 0.14);
  tl.to("#s5in", { opacity: 0, duration: 0.14, ease: "power2.in" }, 12.414 - 0.14);

  /* ---------- proof ---------- */
  const TP = 12.414;
  tl.fromTo("#hudWrap", { x: -500, rotation: -6 }, { x: 0, rotation: -1.5, duration: 0.42, ease: "power3.out" }, TP);
  KZ.pop(tl, "#ptag", TP + 0.35, 0.35);
  tl.fromTo("#hudOld", { opacity: 0 }, { opacity: 1, duration: 0.3 }, TP + 0.5);
  KZ.rise(tl, "#stat", TP + 0.55, 0.4, 30);
  KZ.countUp(tl, "#statN", 0, 8434, TP + 0.6, 0.8, "int", "power2.out");
  tl.fromTo("#qWrap", { y: 260, opacity: 0, rotation: 3 }, { y: 0, opacity: 1, rotation: 0.6, duration: 0.4, ease: "back.out(1.8)" }, 13.65);
  tl.to("#s6in", { opacity: 0, duration: 0.14, ease: "power2.in" }, 15.724 - 0.14);

  /* ---------- end card ---------- */
  const TE = 15.724;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, TE);
  KZ.eyePulse(tl, "#eye7", TE + 0.1, 2);
  KZ.rise(tl, "#endUrl", TE + 0.46, 0.35, 30);
  KZ.rise(tl, "#endAsk", TE + 0.92, 0.4, 30);
  tl.fromTo("#pumpkin", { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, TE + 1.3);
  tl.fromTo("#pkEye", { opacity: 0.3 }, { opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, TE + 1.45);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, TE + 0.9);
  tl.fromTo("#loopCrt", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.in" }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
