  const HZ = {};
  HZ.hash = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // seven-segment LED display (SVG), chars like [" ", "3", ":", "3", "3"]
  HZ.seg = function (el, chars) {
    const T = 16, L = 76, V = 74;
    const h = (cx, cy) => [[cx - L / 2, cy], [cx - L / 2 + T / 2, cy - T / 2], [cx + L / 2 - T / 2, cy - T / 2], [cx + L / 2, cy], [cx + L / 2 - T / 2, cy + T / 2], [cx - L / 2 + T / 2, cy + T / 2]];
    const v = (cx, cy) => [[cx, cy - V / 2], [cx + T / 2, cy - V / 2 + T / 2], [cx + T / 2, cy + V / 2 - T / 2], [cx, cy + V / 2], [cx - T / 2, cy + V / 2 - T / 2], [cx - T / 2, cy - V / 2 + T / 2]];
    const S = { a: h(50, 9), g: h(50, 90), d: h(50, 171), f: v(9, 49.5), b: v(91, 49.5), e: v(9, 130.5), c: v(91, 130.5) };
    const MAP = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc", "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg", " ": "" };
    let x = 26, out = "";
    chars.forEach(function (c) {
      if (c === ":") {
        out += '<g class="colon"><rect class="on" x="' + (x + 4) + '" y="50" width="20" height="20" rx="3" transform="skewX(-8)"/><rect class="on" x="' + (x - 6) + '" y="112" width="20" height="20" rx="3" transform="skewX(-8)"/></g>';
        x += 44; return;
      }
      const on = MAP[c] || "";
      out += '<g transform="translate(' + x + ',0) skewX(-8)">';
      "abcdefg".split("").forEach(function (k) {
        out += '<polygon class="' + (on.indexOf(k) >= 0 ? "on" : "off") + '" points="' + S[k].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
      });
      out += "</g>";
      x += 124;
    });
    el.innerHTML = '<svg viewBox="0 0 ' + (x + 6) + ' 182" width="100%">' + out + "</svg>";
    return el.querySelector("svg");
  };
  // low-res VHS grain redrawn on a quantized clock (pure function of time)
  HZ.grain = function (tl, canvas, D, fps) {
    const ctx = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    const img = ctx.createImageData(W, H);
    let last = -1;
    const draw = function (k) {
      const r = KZ.rng(9000 + k * 7), d = img.data;
      for (let y = 0; y < H; y++) {
        const row = 0.75 + 0.5 * r();          // horizontal streaks
        for (let x2 = 0; x2 < W; x2++) {
          const i = (y * W + x2) * 4, vv = Math.min(255, r() * 255 * row);
          d[i] = d[i + 1] = d[i + 2] = vv; d[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    };
    const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const k = Math.floor(o.t * (fps || 15));
      if (k !== last) { last = k; draw(k); }
    } }, 0);
    draw(0);
  };
  // ambient flicker on an overlay between [from, to): pure function of quantized time
  HZ.flicker = function (tl, el, from, to, seed, strength, rate) {
    const o = { t: from };
    tl.fromTo(o, { t: from }, { t: to, duration: to - from, ease: "none", onUpdate: function () {
      const k = Math.floor(o.t * (rate || 15));
      const hsh = HZ.hash(k * 3.17 + seed);
      el.style.opacity = hsh > 0.88 ? (strength * (0.45 + 0.55 * HZ.hash(k + seed * 2))).toFixed(3) : "0";
    } }, from);
    tl.set(el, { opacity: 0 }, to);
  };
  // RGB-split jitter on a .gl stack (base stays legible)
  HZ.glitch = function (tl, stack, at, dur, amp) {
    const el = typeof stack === "string" ? document.querySelector(stack) : stack;
    const copies = el.querySelectorAll(".gr, .gc");
    const o = { a: 0 };
    tl.set(copies, { opacity: 0.85 }, at);
    tl.fromTo(o, { a: 1 }, { a: 0, duration: dur, ease: "power3.in", immediateRender: false, onUpdate: function () {
      const step = Math.floor(tl.time() * 30);
      copies.forEach(function (c, i) {
        gsap.set(c, { x: (HZ.hash(step * 13 + i * 7) * 2 - 1) * (amp || 12) * o.a, y: (HZ.hash(step * 29 + i * 11) * 2 - 1) * (amp || 12) * 0.35 * o.a });
      });
    } }, at);
    tl.set(copies, { x: 0, y: 0, opacity: 0 }, at + dur);
  };
  // VHS tracking band sweep + tear jitter on a target
  HZ.track = function (tl, at, dur, target, seed) {
    tl.fromTo("#track", { y: -160, opacity: 0.9 }, { y: 1960, opacity: 0.9, duration: dur, ease: "none", immediateRender: false }, at);
    tl.set("#track", { opacity: 0 }, at + dur);
    if (target) {
      const n = 5;
      for (let i = 0; i < n; i++) tl.set(target, { x: (HZ.hash(seed * 5 + i) * 2 - 1) * 26, skewX: (HZ.hash(seed * 9 + i) * 2 - 1) * 4 }, at + i * 0.033);
      tl.set(target, { x: 0, skewX: 0 }, at + n * 0.033);
    }
  };
  // typed narration line
  HZ.type = function (tl, el, text, at, cps) { KZ.typewriter(tl, el, text, at, cps || 40); };
  // gold sparkle burst (deterministic)
  HZ.sparks = function (tl, box, n, at, cx, cy, seed, color) {
    const r = KZ.rng(seed);
    for (let i = 0; i < n; i++) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 40 40"); s.setAttribute("class", "spark");
      s.innerHTML = '<path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" fill="' + (color || "#ffd25a") + '"/>';
      box.appendChild(s);
      const ang = r() * Math.PI * 2, dist = 180 + r() * 360, sc = 0.5 + r() * 1.1;
      tl.fromTo(s, { x: cx - 20, y: cy - 20, scale: 0, opacity: 1, rotation: 0 },
        { x: cx - 20 + Math.cos(ang) * dist, y: cy - 20 + Math.sin(ang) * dist * 0.8 + 60, scale: sc, rotation: r() * 180, duration: 0.9 + r() * 0.5, ease: "power3.out" }, at + r() * 0.08);
      tl.to(s, { opacity: 0, scale: 0, duration: 0.35, ease: "power2.in" }, at + 0.9 + r() * 0.4);
    }
  };


  /* ---------- global layers ---------- */
  KZ.progress(tl, "#prog", 0, D - 0.05);
  HZ.grain(tl, document.getElementById("grain"), D, 10);
  tl.fromTo("#vig", { scale: 1, opacity: 1 }, { scale: 1.07, opacity: 0.85, duration: b(2), ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
  const tc = document.getElementById("osdTc");
  const clk = { t: 0 };
  tl.fromTo(clk, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
    const s = Math.floor(clk.t), f = Math.floor((clk.t % 1) * 30);
    tc.textContent = "SP 00:00:" + String(s).padStart(2, "0") + ":" + String(f).padStart(2, "0");
  } }, 0);
  HZ.flicker(tl, document.getElementById("flick"), 0.5, 7.2, 113, 0.5, 15);

  /* ---------- S1 hook ---------- */
  KZ.slam(tl, "#h1", 0.0, 1.6);
  tl.fromTo("#h2", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, 0.1);
  HZ.glitch(tl, "#h2g", 0.1, 0.4, 18);
  KZ.shake(tl, "#s1in", 0.14, 14, 0.3, 3);
  KZ.slam(tl, "#h3", 0.26, 1.6);
  tl.fromTo("#s1in", { scale: 1.0 }, { scale: 1.08, duration: 1.846, ease: "none", immediateRender: false }, 0);
  HZ.glitch(tl, "#h2g", 1.2, 0.2, 10);
  tl.fromTo("#scr", { opacity: 0.85 }, { opacity: 0.55, duration: 0.12, ease: "none", yoyo: true, repeat: 7 }, 0.3);
  tl.fromTo("#monGlow", { opacity: 0.8, scale: 0.96 }, { opacity: 1, scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
  HZ.track(tl, 1.35, 0.45, null, 1);

  /* ---------- trailer beats (one per two beats, cut on the beat) ---------- */
  [["#sk_b1in", 1.846], ["#sk_b2in", 2.769], ["#sk_b3in", 3.692], ["#sk_b4in", 4.615], ["#sk_b5in", 5.538]].forEach(function (p, i) {
    tl.fromTo(p[0], { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1.15, duration: 0.18, ease: "power3.out" }, p[1]);
    tl.to(p[0], { opacity: 0.35, scaleX: 1.0, duration: 0.6, ease: "power2.out" }, p[1] + 0.18);
  });
  // 8 horas: clock hand sweeps, ticks
  tl.fromTo("#big8", { scale: 1.15, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.846);
  tl.fromTo("#hand", { rotation: -40 }, { rotation: 140, duration: 0.92, ease: "steps(4)" }, 1.846);
  KZ.slam(tl, "#b1t", 1.88, 1.5);
  // clicando: four clicks
  [0, 0.18, 0.36, 0.54].forEach(function (o, i) {
    const t = 2.769 + 0.04 + o;
    tl.fromTo("#cursor", { scale: 1 }, { scale: 0.86, duration: 0.05, ease: "power2.in", immediateRender: i === 0 }, t);
    tl.to("#cursor", { scale: 1, duration: 0.09, ease: "power2.out" }, t + 0.05);
    tl.fromTo("#r" + (i + 1), { scale: 0.2, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out" }, t);
  });
  KZ.slam(tl, "#b2t", 2.8, 1.5);
  // sozinho: far away, tiny, push-in
  tl.fromTo("#b3in", { scale: 1.0 }, { scale: 1.1, duration: 0.92, ease: "none" }, 3.692);
  tl.fromTo("#b3t", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.72);
  tl.fromTo("#eyeGlint", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" }, 4.05);
  tl.to("#eyeGlint", { scaleY: 0.08, duration: 0.06, ease: "power1.in" }, 4.3);
  tl.to("#eyeGlint", { scaleY: 1, duration: 0.06, ease: "power1.out" }, 4.36);
  tl.to("#eyeGlint", { opacity: 0, duration: 0.12, ease: "power1.in" }, 4.46);
  // o sono vem: eyelids close, blink
  tl.fromTo("#b4t", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.64);
  tl.fromTo("#haze", { scale: 1.0, filter: "blur(0px)" }, { scale: 1.12, filter: "blur(6px)", duration: 0.9, ease: "none" }, 4.615);
  tl.fromTo("#lidT", { y: 0 }, { y: 760, duration: 0.6, ease: "power2.inOut" }, 4.62);
  tl.fromTo("#lidB", { y: 0 }, { y: -780, duration: 0.6, ease: "power2.inOut" }, 4.62);
  tl.to("#lidT", { y: 1060, duration: 0.12, ease: "power2.in" }, 5.25);
  tl.to("#lidB", { y: -1060, duration: 0.12, ease: "power2.in" }, 5.25);
  tl.to("#lidT", { y: 300, duration: 0.14, ease: "power2.out" }, 5.4);
  tl.to("#lidB", { y: -300, duration: 0.14, ease: "power2.out" }, 5.4);
  // o shiny... foge.
  tl.fromTo("#star", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 5.538);
  tl.fromTo("#starGlow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 5.538);
  tl.to("#star", { rotation: 20, scale: 1.08, duration: 0.5, ease: "sine.inOut" }, 5.94);
  KZ.rise(tl, "#b5t", 5.6, 0.3, 30);
  tl.to("#star", { x: 330, y: -520, scale: 0.05, rotation: 200, duration: 0.42, ease: "power3.in" }, 6.462);
  tl.to("#starGlow", { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.462);
  tl.to("#b5t", { opacity: 0, duration: 0.1, ease: "power2.in" }, 6.42);
  tl.set("#b6t", { opacity: 1 }, 6.5);

  /* ---------- title card ---------- */
  KZ.flash(tl, "#flash", 7.385, 0.55, "#ff2a2a");

  HZ.glitch(tl, "#tt1g", 7.385, 0.5, 22);
  tl.fromTo("#tt2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 7.5);
  KZ.shake(tl, "#s3in", 7.4, 16, 0.35, 13);

  HZ.type(tl, "#tt3t", "Em breve no seu PC.", 8.08, 34);
  tl.fromTo("#s3in", { scale: 1.0 }, { scale: 1.05, duration: 1.8, ease: "none", immediateRender: false }, 7.385);

  /* ---------- twist: color + funk ---------- */
  const TW = 9.231;

  tl.set("#bgRed", { opacity: 0 }, TW);
  tl.set("#grain", { opacity: 0 }, TW);
  tl.set("#scan", { opacity: 0.45 }, TW);
  tl.set(["#osd1", "#osdTc"], { opacity: 0 }, TW);

  tl.to("#s4in", { opacity: 0, duration: 0.12, ease: "power2.in" }, 11.077 - 0.12);

  /* ---------- claims ---------- */
  tl.fromTo("#wm", { scale: 0.5, opacity: 0, y: -40 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 11.077);

  tl.fromTo("#st2", { scale: 2.6, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 4, duration: 0.24, ease: "power4.out" }, 12.923);
  KZ.shake(tl, "#s5in", 12.96, 10, 0.2, 6);
  tl.to("#s5in", { opacity: 0, duration: 0.12, ease: "power2.in" }, 13.846 - 0.12);

  /* ---------- slogan ---------- */
  KZ.slam(tl, "#sl1", 13.846, 1.7);
  KZ.slam(tl, "#sl2", 14.308, 1.7);
  KZ.rise(tl, "#slSub", 14.75, 0.35, 24);
  tl.to(["#s6in", "#robotWrap"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 15.692 - 0.14);

  /* ---------- end card ---------- */
  const TE = 15.692;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, TE);

  // loop bridge: back to the red trailer darkness
  tl.fromTo("#loopBg", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.in" }, D - 0.4);

  window.__timelines["main"] = tl;
