<script>
  const tl = gsap.timeline({ paused: true });
  const D = 17.714;
  const b = KZ.beats(84);            // beat = 0.714 s, bar = 2.857 s

  /* ---------- F15 horror helpers (inline, shared by 111-115) ---------- */
  const HZ = {};
  HZ.hash = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // seven-segment LED display (SVG), chars like [" ", "3", ":", "3", "3"]
  HZ.seg = function (el, chars) {
    const T = 16, L = 76, V = 74;
    const h = (cx, cy) => [[cx - L / 2, cy], [cx - L / 2 + T / 2, cy - T / 2], [cx + L / 2 - T / 2, cy - T / 2], [cx + L / 2, cy], [cx + L / 2 - T / 2, cy + T / 2], [cx - L / 2 + T / 2, cy + T / 2]];
    const v = (cx, cy) => [[cx, cy - V / 2], [cx + T / 2, cy - V / 2 + T / 2], [cx + T / 2, cy + V / 2 - T / 2], [cx, cy + V / 2], [cx - T / 2, cy + V / 2 - T / 2], [cx - T / 2, cy - V / 2 + T / 2]];
    const S = { a: h(50, 9), g: h(50, 90), d: h(50, 171), f: v(9, 49.5), b: v(91, 49.5), e: v(9, 130.5), c: v(91, 130.5) };
    const MAP = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc", "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg", " ": "" };
    let x = 26, out = "";
    chars.forEach(function (c) {
      if (c === ":") {
        out += '<g class="colon"><rect class="on" x="' + (x + 4) + '" y="50" width="20" height="20" rx="3" transform="skewX(-8)"/><rect class="on" x="' + (x - 6) + '" y="112" width="20" height="20" rx="3" transform="skewX(-8)"/></g>';
        x += 44; return;
      }
      const on = MAP[c] || "";
      out += '<g transform="translate(' + x + ',0) skewX(-8)">';
      "abcdefg".split("").forEach(function (k) {
        out += '<polygon class="' + (on.indexOf(k) >= 0 ? "on" : "off") + '" points="' + S[k].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
      });
      out += "</g>";
      x += 124;
    });
    el.innerHTML = '<svg viewBox="0 0 ' + (x + 6) + ' 182" width="100%">' + out + "</svg>";
    return el.querySelector("svg");
  };
  // low-res VHS grain redrawn on a quantized clock (pure function of time)
  HZ.grain = function (tl, canvas, D, fps) {
    const ctx = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    const img = ctx.createImageData(W, H);
    let last = -1;
    const draw = function (k) {
      const r = KZ.rng(9000 + k * 7), d = img.data;
      for (let y = 0; y < H; y++) {
        const row = 0.75 + 0.5 * r();          // horizontal streaks
        for (let x2 = 0; x2 < W; x2++) {
          const i = (y * W + x2) * 4, vv = Math.min(255, r() * 255 * row);
          d[i] = d[i + 1] = d[i + 2] = vv; d[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    };
    const o = { t: 0 };
    tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
      const k = Math.floor(o.t * (fps || 15));
      if (k !== last) { last = k; draw(k); }
    } }, 0);
    draw(0);
  };
  // ambient flicker on an overlay between [from, to): pure function of quantized time
  HZ.flicker = function (tl, el, from, to, seed, strength, rate) {
    const o = { t: from };
    tl.fromTo(o, { t: from }, { t: to, duration: to - from, ease: "none", immediateRender: false, onUpdate: function () {
      if (o.t <= from + 0.001) { el.style.opacity = "0"; return; }
      const k = Math.floor(o.t * (rate || 15));
      const hsh = HZ.hash(k * 3.17 + seed);
      el.style.opacity = hsh > 0.88 ? (strength * (0.45 + 0.55 * HZ.hash(k + seed * 2))).toFixed(3) : "0";
    } }, from);
    tl.set(el, { opacity: 0 }, to);
  };
  // RGB-split jitter on a .gl stack (base stays legible)
  HZ.glitch = function (tl, stack, at, dur, amp) {
    const el = typeof stack === "string" ? document.querySelector(stack) : stack;
    const copies = el.querySelectorAll(".gr, .gc");
    const o = { a: 0 };
    tl.set(copies, { opacity: 0.85 }, at);
    tl.fromTo(o, { a: 1 }, { a: 0, duration: dur, ease: "power3.in", immediateRender: false, onUpdate: function () {
      const step = Math.floor(tl.time() * 30);
      copies.forEach(function (c, i) {
        gsap.set(c, { x: (HZ.hash(step * 13 + i * 7) * 2 - 1) * (amp || 12) * o.a, y: (HZ.hash(step * 29 + i * 11) * 2 - 1) * (amp || 12) * 0.35 * o.a });
      });
    } }, at);
    tl.set(copies, { x: 0, y: 0, opacity: 0 }, at + dur);
  };
  // VHS tracking band sweep + tear jitter on a target
  HZ.track = function (tl, at, dur, target, seed) {
    tl.fromTo("#track", { y: -160, opacity: 0.9 }, { y: 1960, opacity: 0.9, duration: dur, ease: "none", immediateRender: false }, at);
    tl.set("#track", { opacity: 0 }, at + dur);
    if (target) {
      const n = 5;
      for (let i = 0; i < n; i++) tl.set(target, { x: (HZ.hash(seed * 5 + i) * 2 - 1) * 26, skewX: (HZ.hash(seed * 9 + i) * 2 - 1) * 4 }, at + i * 0.033);
      tl.set(target, { x: 0, skewX: 0 }, at + n * 0.033);
    }
  };
  // typed narration line
  HZ.type = function (tl, el, text, at, cps) { KZ.typewriter(tl, el, text, at, cps || 40); };
  // gold sparkle burst (deterministic)
  HZ.sparks = function (tl, box, n, at, cx, cy, seed, color) {
    const r = KZ.rng(seed);
    for (let i = 0; i < n; i++) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 40 40"); s.setAttribute("class", "spark");
      s.innerHTML = '<path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" fill="' + (color || "#ffd25a") + '"/>';
      box.appendChild(s);
      const ang = r() * Math.PI * 2, dist = 180 + r() * 360, sc = 0.5 + r() * 1.1;
      tl.fromTo(s, { x: cx - 20, y: cy - 20, scale: 0, opacity: 1, rotation: 0 },
        { x: cx - 20 + Math.cos(ang) * dist, y: cy - 20 + Math.sin(ang) * dist * 0.8 + 60, scale: sc, rotation: r() * 180, duration: 0.9 + r() * 0.5, ease: "power3.out" }, at + r() * 0.08);

  };


  /* ---------- global layers ---------- */
  KZ.progress(tl, "#prog", 0, D - 0.05);
  HZ.grain(tl, document.getElementById("grain"), D, 10);
  tl.fromTo("#vig", { scale: 1, opacity: 1 }, { scale: 1.06, opacity: 0.85, duration: b(3), ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
  const carets = document.querySelectorAll(".hz-caret"), tc = document.getElementById("osdTc"), tube = document.getElementById("tube"), cone = document.getElementById("cone2");
  const clk = { t: 0 };
  tl.fromTo(clk, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () {
    const on = Math.floor(clk.t * 3.4) % 2 === 0;
    carets.forEach(function (c) { c.style.opacity = on ? 1 : 0; });
    const s = Math.floor(clk.t), f = Math.floor((clk.t % 1) * 30);
    tc.textContent = "SP 00:00:" + String(s).padStart(2, "0") + ":" + String(f).padStart(2, "0");
    // fluorescent tube flicker (pure function of time)
    const k = Math.floor(clk.t * 15), h = HZ.hash(k * 2.3 + 114);
    const fl = (clk.t < 8.4 && h > 0.84) ? 0.25 : 1;
    tube.style.opacity = fl; cone.style.opacity = 0.5 * fl;
  } }, 0);

  /* ---------- hook ---------- */
  tl.fromTo("#hall", { scale: 1.0 }, { scale: 1.22, duration: 8.4, ease: "power1.in" }, 0);
  tl.fromTo("#hk1", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.04);
  tl.fromTo("#hk2", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0.22);
  KZ.shake(tl, "#hk2", 0.46, 10, 0.25, 4);
  HZ.track(tl, 1.7, 0.4, null, 1);
  tl.to(["#hk1", "#hk2"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 2.3 - 0.14);

  /* ---------- narration ---------- */
  tl.set("#n1w", { opacity: 1 }, 2.3);
  HZ.type(tl, "#n1", "Enquanto você assiste esse vídeo…", 2.34, 40);
  // the eye in the doorway (brand foreshadowing)
  tl.fromTo("#eyeGlint", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" }, 3.5);
  tl.to("#eyeGlint", { scaleY: 0.08, duration: 0.06 }, 3.78);
  tl.to("#eyeGlint", { scaleY: 1, duration: 0.06 }, 3.84);
  tl.to("#eyeGlint", { opacity: 0, duration: 0.15 }, 3.98);
  tl.set("#n1w", { opacity: 0 }, 4.85);
  tl.set("#n2w", { opacity: 1 }, 4.85);
  HZ.type(tl, "#n2", "alguém está jogando no seu lugar.", 4.89, 40);
  // the door opens wider
  tl.fromTo("#slit", { scaleX: 1 }, { scaleX: 5.5, duration: 1.6, ease: "power2.inOut" }, 5.0);
  tl.fromTo("#doorPanel", { attr: { x: 466, width: 164 } }, { attr: { x: 530, width: 100 }, duration: 1.6, ease: "power2.inOut" }, 5.0);
  tl.fromTo("#spillF", { scaleX: 1, opacity: 0.55 }, { scaleX: 2.2, opacity: 0.85, duration: 1.6, ease: "power2.inOut" }, 5.0);
  HZ.flicker(tl, document.getElementById("flick"), 2.3, 7.2, 21, 0.4, 14);
  tl.to("#n2w", { opacity: 0, duration: 0.2 }, 7.25);
  // footsteps: the silhouette approaches in three jumps
  tl.set("#ghostWrap", { opacity: 1 }, 7.4);
  tl.fromTo("#ghostWrap", { scale: 1.0, y: 0 }, { scale: 1.0, y: 0, duration: 0.01, immediateRender: false }, 7.4);
  tl.set("#ghostWrap", { scale: 1.9, y: 150 }, 7.85);

  tl.set("#ghostEye", { opacity: 1 }, 8.2);
  KZ.shake(tl, "#hall", 7.4, 5, 0.15, 31);
  KZ.shake(tl, "#hall", 7.85, 8, 0.15, 32);
  KZ.shake(tl, "#hall", 8.2, 12, 0.15, 33);
  // lights out (5 frames)

  tl.set("#flick", { opacity: 0 }, 8.571);

  const TR = 8.571;

  tl.set("#grain", { opacity: 0.02 }, TR);

  [0, 1, 2, 3].forEach(function (i) { tl.to("#robotWrap", { rotation: i % 2 ? -4 : 4, duration: 0.18, ease: "sine.inOut" }, TR + 0.45 + i * 0.18); });
  tl.to("#robotWrap", { rotation: 0, duration: 0.2, ease: "sine.out" }, TR + 1.17);
  tl.fromTo("#bubble", { scale: 0.3, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.4, ease: "back.out(2.2)" }, 8.9);
  tl.fromTo("#wave", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 9.1);
  [0, 1, 2, 3, 4].forEach(function (i) { tl.to("#wave", { rotation: i % 2 ? -18 : 18, duration: 0.16, ease: "sine.inOut" }, 9.45 + i * 0.16); });
  tl.fromTo("#bubble .l2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.6);
  for (let i = 0; i < 3; i++) { const t = 10.0 + i * b(1); tl.to("#robotWrap", { y: -18, duration: 0.15, ease: "power2.out" }, t); tl.to("#robotWrap", { y: 0, duration: 0.35, ease: "power2.in" }, t + 0.15); }
  tl.to("#s5in", { opacity: 0, duration: 0.14, ease: "power2.in" }, 11.429 - 0.14);

  /* ---------- gameplay real ---------- */
  const TG = 11.429;
  tl.fromTo("#mon", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, TG);
  tl.fromTo("#gpBox", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, TG);
  KZ.pop(tl, "#gptag", TG + 0.35, 0.35);
  KZ.rise(tl, "#gpCap", TG + 0.9, 0.35, 24);
  KZ.pop(tl, "#ch1", TG + 1.45, 0.35);
  KZ.pop(tl, "#ch2", TG + 1.65, 0.35);
  tl.to("#s6in", { opacity: 0, duration: 0.14, ease: "power2.in" }, 14.286 - 0.14);
  tl.to("#gpBox", { opacity: 0, duration: 0.14, ease: "power2.in" }, 14.286 - 0.14);

  /* ---------- end card ---------- */
  const TE = 14.286;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, TE);
  KZ.eyePulse(tl, "#eye7", TE + 0.1, 2);
  KZ.rise(tl, "#endUrl", TE + 0.46, 0.35, 30);
  KZ.rise(tl, "#endAsk", TE + 0.92, 0.4, 30);
  tl.fromTo("#pumpkin", { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, TE + 1.3);
  tl.fromTo("#pkEye", { opacity: 0.3 }, { opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, TE + 1.45);

  tl.fromTo("#loopHall", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.in" }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
