<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>117 13 módulos em 13 segundos</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  /* ===== F16 "Speedrun" system (shared with 116-120) ===== */
  :root { --gold: #ffc93c; --gold2: #ffe08a; --lime: #c6ff3d; --hud: rgba(18, 12, 30, 0.86); --hudline: rgba(168, 85, 247, 0.45); --red: #ff4a4a; }
  .full { position: absolute; inset: 0; }
  #bg { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 30%, #1a0d2e 0%, #07060c 70%); }
  #streakWrap { position: absolute; inset: 0; overflow: hidden; }
  #streaks { position: absolute; left: -400px; top: -200px; width: 1900px; height: 2400px; transform: rotate(14deg); opacity: 0.55;
    background-image: repeating-linear-gradient(90deg, rgba(168, 85, 247, 0) 0 120px, rgba(168, 85, 247, 0.15) 120px 126px, rgba(168, 85, 247, 0) 126px 300px, rgba(255, 201, 60, 0.07) 300px 304px); }
  #glowG { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 45%, rgba(255, 201, 60, 0.3) 0%, rgba(255, 201, 60, 0) 70%); opacity: 0; }
  #glowR { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 30%, rgba(255, 74, 74, 0.28) 0%, rgba(255, 74, 74, 0) 70%); opacity: 0; }
  .kz-scan { opacity: 0.35; }
  .kz-progress { height: 8px; }
  .kz-progress > div { background: linear-gradient(90deg, var(--kz-violet), var(--gold)); }
  .tk { font-family: "Teko", sans-serif; font-weight: 700; text-transform: uppercase; line-height: 0.86; color: var(--kz-ink); }
  .eye { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(244, 214, 255, 1) 0%, rgba(192, 132, 252, 0.85) 30%, rgba(168, 85, 247, 0) 70%); mix-blend-mode: screen; opacity: 0.35; }
  .chiprow { position: absolute; left: 120px; width: 760px; top: 238px; display: flex; align-items: center; justify-content: space-between; }
  .cat { display: flex; align-items: center; gap: 12px; padding: 6px 20px 6px 8px; border-radius: 12px; background: var(--hud); border: 2px solid var(--hudline); font: 700 40px "Rajdhani", sans-serif; letter-spacing: 0.06em; color: var(--kz-ink); }
  .cat .hd { position: relative; width: 50px; height: 48px; }
  .cat .hd img { width: 50px; display: block; }
  .cat b { padding: 2px 12px; border-radius: 8px; background: var(--gold); color: #1a1205; font-weight: 700; }
  .rec { display: flex; align-items: center; gap: 10px; font: 400 30px "JetBrains Mono", monospace; color: var(--kz-lav); letter-spacing: 0.12em; }
  .rec i { width: 18px; height: 18px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px rgba(255, 74, 74, 0.9); }
  .timerbox { position: absolute; left: 100px; width: 808px; height: 214px; border-radius: 28px; background: var(--hud); border: 3px solid var(--hudline); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(124, 58, 237, 0.18); display: flex; align-items: center; justify-content: center; }
  .timer { font: 400 178px "JetBrains Mono", monospace; letter-spacing: -0.02em; color: #fff; line-height: 1; }

  /* S1 */
  #ttl1 { position: absolute; left: 120px; width: 768px; top: 330px; text-align: center; font-size: 152px; white-space: nowrap; }
  #ttl2 { position: absolute; left: 120px; width: 768px; top: 478px; text-align: center; font-size: 144px; white-space: nowrap; color: var(--gold); text-shadow: 0 0 50px rgba(255, 201, 60, 0.35); }

  /* S2 run */
  #hdr { position: absolute; left: 120px; width: 768px; top: 322px; text-align: center; font-size: 72px; white-space: nowrap; }
  #hdr span { color: var(--gold); }
  .meta { position: absolute; left: 140px; width: 728px; top: 640px; display: flex; justify-content: space-between; align-items: center; font: 400 34px "JetBrains Mono", monospace; color: rgba(216, 180, 254, 0.8); }
  .meta b { font-weight: 400; color: var(--lime); }
  .pace { position: absolute; left: 140px; width: 728px; top: 692px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  #paceFill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold) 40%, var(--lime)); transform-origin: 0 50%; }
  .mc { position: absolute; left: 120px; width: 768px; top: 736px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
  .mi { width: 210px; height: 210px; border-radius: 48px; background: linear-gradient(145deg, #a855f7, #6d28d9); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px rgba(124, 58, 237, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.25); }
  .mi svg { width: 124px; height: 124px; }
  .mn { font-family: "Teko", sans-serif; font-weight: 700; font-size: 120px; line-height: 1; text-transform: uppercase; color: #fff; margin-top: 22px; white-space: nowrap; }
  .md { font: 700 66px "Rajdhani", sans-serif; color: var(--kz-lav); line-height: 1; margin-top: -6px; white-space: nowrap; }
  .strip { position: absolute; left: 131px; width: 746px; top: 1240px; display: flex; gap: 8px; }
  .st { width: 50px; height: 50px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(216, 180, 254, 0.18); display: flex; align-items: center; justify-content: center; }
  .st svg { width: 30px; height: 30px; }

  /* S3 peak */
  #all1 { position: absolute; left: 120px; width: 768px; top: 330px; text-align: center; font-size: 180px; white-space: nowrap; }
  #all2 { position: absolute; left: 120px; width: 768px; top: 488px; text-align: center; font-size: 180px; white-space: nowrap; color: var(--gold); text-shadow: 0 0 60px rgba(255, 201, 60, 0.45); }
  #done { position: absolute; left: 0; right: 0; top: 690px; display: flex; justify-content: center; }
  #done span { display: flex; align-items: center; gap: 14px; padding: 8px 28px; border-radius: 14px; background: var(--lime); color: #10200a; font: 700 58px "Rajdhani", sans-serif; letter-spacing: 0.04em; }
  #robotWrap { position: absolute; left: 160px; top: 830px; width: 720px; }
  #robotWrap img { width: 720px; display: block; }
  .fly { position: absolute; left: 0; top: 0; width: 50px; height: 50px; border-radius: 12px; background: var(--lime); }

  .kz-end .kz-url { font: 700 70px "Rajdhani", sans-serif; letter-spacing: 0.02em; }
  .ask { font: 700 66px "Rajdhani", sans-serif; color: var(--kz-ink); max-width: 820px; line-height: 1.05; }
  .ask b { color: var(--gold); font-weight: 700; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="18" data-fps="30">
  <div id="bg"></div>
  <div id="streakWrap"><div id="streaks"></div></div>
  <div id="glowR"></div>
  <div id="glowG"></div>
  <div class="kz-scan"></div>
  <div class="kz-vignette"></div>
  <div class="kz-progress"><div id="prog"></div></div>

  <div id="chipLayer" class="full" style="pointer-events:none; z-index:20">
    <div class="chiprow" id="chiprow">
      <div class="cat"><span class="hd"><img src="kit/img/brand/kizubot-head.png" alt="" /><i class="eye" id="catEye" style="left:13px; top:5px; width:26px; height:26px"></i></span>KIZUBOT% <b>13/13</b></div>
      <div class="rec"><i id="recDot"></i>SPEEDRUN</div>
    </div>
  </div>

  <!-- S1 hook: 0 - 0.5 -->
  <section id="s1" class="clip" data-start="0" data-duration="0.5">
    <div id="s1in" class="full">
      <div class="tk" id="ttl1">13 módulos.</div>
      <div class="tk" id="ttl2">13 segundos.</div>
      <div class="timerbox" id="tbox1" style="top:760px"><div class="timer">0:13.0</div></div>
    </div>
  </section>

  <!-- S2 the run: 0.5 - 13.5 (one module per second) -->
  <section id="s2" class="clip" data-start="0.5" data-duration="13.0">
    <div id="s2in" class="full">
      <div class="tk" id="hdr">13 módulos · <span>13 segundos</span></div>
      <div class="timerbox" id="tbox" style="top:410px"><div class="timer" id="timer">0:13.0</div></div>
      <div class="meta"><span>módulo <b id="cnt">01</b>/13</span><span id="left">faltam 13s</span></div>
      <div class="pace"><div id="paceFill"></div></div>
      <div id="cards"></div>
      <div class="strip" id="strip"></div>
    </div>
  </section>

  <!-- S3 peak: 13.5 - 15.0 -->
  <section id="s3" class="clip" data-start="13.5" data-duration="1.5">
    <div id="s3in" class="full">
      <div class="tk" id="all1">Tudo num</div>
      <div class="tk" id="all2">bot só.</div>
      <div id="done"><span id="doneIn">13 módulos ✓</span></div>
      <div id="robotWrap"><img id="robot" src="kit/img/brand/kizubot-robot.png" alt="" /><div class="eye" id="eye3" style="left:250px; top:30px; width:96px; height:96px"></div></div>
      <div id="flies"></div>
    </div>
  </section>

  <!-- S4 end card: 15.0 - 17.65 -->
  <section id="s4" class="clip" data-start="15.0" data-duration="2.65">
    <div class="kz-end" id="s4in">
      <div style="position:relative; width:560px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" />
        <div class="eye" id="eye4" style="left:177px; top:8px; width:100px; height:100px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk">Qual módulo <b>você mais usaria?</b></div>
    </div>
  </section>

  <!-- S5 loop seam: 17.65 - 18.0 (frame-0 layout) -->
  <section id="s5" class="clip" data-start="17.65" data-duration="0.35">
    <div id="s5in" class="full">
      <div class="tk" id="lt1" style="position:absolute; left:120px; width:768px; top:330px; text-align:center; font-size:152px; white-space:nowrap">13 módulos.</div>
      <div class="tk" id="lt2" style="position:absolute; left:120px; width:768px; top:478px; text-align:center; font-size:144px; white-space:nowrap; color:var(--gold)">13 segundos.</div>
      <div class="timerbox" id="ltb" style="top:760px"><div class="timer">0:13.0</div></div>
    </div>
  </section>

  <div id="flash"></div>
</div>
<script>
  // ---- modules (names from kizubot.com/llms.txt; descriptions from the brief) ----
  var I = {
    route: '<circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6"/>',
    swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>',
    heal: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/><path d="M12 9v6"/><path d="M9 12h6"/>',
    target: '<circle cx="12" cy="12" r="8"/><path d="M12 2v5"/><path d="M12 17v5"/><path d="M2 12h5"/><path d="M17 12h5"/><circle cx="12" cy="12" r="1.4"/>',
    leaf: '<path d="M7 21h10"/><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2-6-7-6 0 4 2 7 7 6z"/>',
    fish: '<path d="M6.5 12c3-5 9-5 12 0-3 5-9 5-12 0z"/><path d="M6.5 12L2 8.5v7z"/><circle cx="15" cy="11" r="0.9"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    cog: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
    card: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.8-2 2-3 3.5-3s2.7 1 3.5 3"/><path d="M15 10h3M15 14h3"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>'
  };
  var M = [
    ["Cavebot", "anda sozinho", "route"], ["Combat", "luta com IA", "swords"], ["Healing", "cura e revive", "heal"],
    ["Catch", "captura", "target"], ["Farming", "coleta recursos", "leaf"], ["Fishing", "pesca no AFK", "fish"],
    ["Alarms", "avisa no zap", "bell"], ["Party", "joga em party", "users"], ["Engine", "HUD e loot", "cog"],
    ["Actions", "50+ condições", "zap"], ["Account", "suas configs", "card"], ["Setup Pokémon", "skills por poke", "sliders"],
    ["Humanização", "ritmo humano", "pulse"]
  ];
  (function () {
    var c = "", s = "", f = "";
    M.forEach(function (m, i) {
      c += '<div class="mc" id="m' + i + '"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + I[m[2]] + '</svg></div><div class="mn">' + m[0] + '</div><div class="md">' + m[1] + "</div></div>";
      s += '<div class="st" id="st' + i + '"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(216,180,254,0.55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + I[m[2]] + "</svg></div>";
      f += '<div class="fly" id="fl' + i + '"></div>';
    });
    document.getElementById("cards").innerHTML = c;
    document.getElementById("strip").innerHTML = s;
    document.getElementById("flies").innerHTML = f;
  })();

  const tl = gsap.timeline({ paused: true });
  const D = 18;
  const b = KZ.beats(120);            // beat = 0.5 s; one module = 2 beats = 1.0 s

  function glint(eye, at, times, first) {
    if (first) tl.set(eye, { opacity: 0.35, scale: 1 }, 0);
    for (var i = 0; i < times; i++) {
      tl.fromTo(eye, { opacity: 0.2, scale: 0.8 }, { opacity: 1, scale: 1.3, duration: 0.18, ease: "power2.out", immediateRender: false }, at + i * 0.45);
      tl.to(eye, { opacity: 0.35, scale: 1, duration: 0.25, ease: "power2.in" }, at + i * 0.45 + 0.18);
    }
  }
  function fmtT(t) {
    var d = Math.floor(t * 10 + 1e-6), s = Math.floor(d / 10), m = Math.floor(s / 60);
    return m + ":" + String(s % 60).padStart(2, "0") + "." + (d % 10);
  }
  function setText(el, at, val) { tl.to({ v: 0 }, { v: 1, duration: 0.01, onUpdate: function () { el.textContent = val; } }, at); }

  // ---- untimed ----
  tl.fromTo("#prog", { scaleX: 0 }, { scaleX: 1, duration: D - 0.05, ease: "power1.out" }, 0);
  tl.fromTo("#streaks", { x: 0 }, { x: -360, duration: D, ease: "none" }, 0);
  tl.fromTo("#chiprow", { y: -12, opacity: 1 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
  glint("#catEye", 0.6, 1, true);
  glint("#catEye", 7.1, 1, false);
  tl.fromTo("#recDot", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "none", repeat: 27, yoyo: true }, 0);
  tl.to("#chiprow", { y: -30, opacity: 0, duration: 0.2, ease: "power2.in" }, 14.8);
  tl.fromTo("#chiprow", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 17.65);

  // ---- S1 hook ----
  tl.fromTo("#ttl1", { scale: 1.03, y: -30 }, { scale: 1, y: 0, duration: 0.22, ease: "power4.out" }, 0);
  tl.fromTo("#ttl2", { scale: 1.03, y: 40 }, { scale: 1, y: 0, duration: 0.22, ease: "power4.out" }, 0.04);
  tl.fromTo("#tbox1", { y: 120 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
  tl.to(["#ttl1", "#ttl2"], { scale: 0.5, y: -60, opacity: 0, duration: 0.12, ease: "power2.in" }, 0.38);

  // ---- S2 the run ----
  tl.fromTo("#hdr", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, b(1));
  tl.fromTo("#tbox", { y: 350 }, { y: 0, duration: 0.25, ease: "power3.out" }, b(1));
  tl.fromTo("#strip", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, b(1) + 0.05);
  (function () {
    var el = document.getElementById("timer"), lf = document.getElementById("left"), o = { t: 13 };
    tl.to(o, { t: 0, duration: 13, ease: "none", onUpdate: function () { el.textContent = fmtT(o.t); lf.textContent = "faltam " + Math.ceil(o.t - 1e-6) + "s"; } }, b(1));
  })();
  tl.fromTo("#paceFill", { scaleX: 1 }, { scaleX: 0, duration: 13, ease: "none" }, b(1));
  tl.set("#timer", { color: "#ffffff", scale: 1 }, 0);
  M.forEach(function (m, i) {
    var t = b(1) + i, card = "#m" + i;
    tl.fromTo(card, { opacity: 0, scale: 1.22, y: 0 }, { opacity: 1, scale: 1, duration: 0.17, ease: "power3.out", immediateRender: false }, t);
    tl.fromTo(card + " .mi", { scale: 0.4, rotation: i % 2 ? 22 : -22 }, { scale: 1, rotation: 0, duration: 0.34, ease: "back.out(2.6)" }, t);
    if (i < M.length - 1) tl.to(card, { opacity: 0, x: -80, duration: 0.1, ease: "power2.in" }, t + 0.9);
    tl.fromTo("#st" + i, { backgroundColor: "rgba(255,255,255,0.06)", borderColor: "rgba(216,180,254,0.18)" }, { backgroundColor: "#c6ff3d", borderColor: "#c6ff3d", duration: 0.12, ease: "none" }, t + 0.06);
    tl.fromTo("#st" + i + " svg", { stroke: "rgba(216,180,254,0.55)" }, { stroke: "#10200a", duration: 0.12, ease: "none" }, t + 0.06);
    tl.fromTo("#st" + i, { scale: 1.35 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.06);
    setText(document.getElementById("cnt"), t, String(i + 1).padStart(2, "0"));
  });
  // last 3 seconds: red pressure
  tl.fromTo("#glowR", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, b(21));
  [b(21), b(23), b(25)].forEach(function (t) {
    tl.fromTo("#timer", { color: "#ff4a4a", scale: 1.08 }, { color: "#ffffff", scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
  });
  KZ.shake(tl, "#tbox", b(25.5), 5, 0.5, 13);
  tl.to("#timer", { color: "#ffc93c", duration: 0.05, ease: "none" }, b(27) - 0.06);

  // ---- S3 peak: everything collapses into one bot ----
  tl.to("#glowR", { opacity: 0, duration: 0.2 }, b(27));
  KZ.flash(tl, "#flash", b(27), 0.85, "#fff4c9");
  tl.fromTo("#glowG", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, b(27));
  tl.to("#glowG", { opacity: 0.45, duration: 0.9, ease: "power2.out" }, b(27) + 0.3);
  tl.to("#glowG", { opacity: 0, duration: 0.3 }, 14.85);
  M.forEach(function (m, i) {
    var sx = 131 + i * 58, sy = 1240;
    tl.fromTo("#fl" + i, { x: sx, y: sy, scale: 1, opacity: 1 }, { x: 515, y: 980, scale: 0.2, opacity: 0, duration: 0.42, ease: "power3.in" }, b(27) + i * 0.018);
  });
  tl.fromTo("#robotWrap", { y: 520, opacity: 0, scale: 0.85 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, b(27) + 0.25);
  glint("#eye3", b(27) + 0.55, 2, true);
  KZ.slam(tl, "#all1", b(27) + 0.05, 1.6);
  KZ.slam(tl, "#all2", b(28), 1.8);
  tl.fromTo("#doneIn", { scale: 0, rotation: -8 }, { scale: 1, rotation: -2, duration: 0.3, ease: "back.out(3)" }, b(28) + 0.2);
  KZ.shake(tl, "#s3in", b(28) + 0.04, 10, 0.25, 3);
  tl.to("#s3in", { opacity: 0, scale: 0.94, duration: 0.17, ease: "power2.in" }, 15.0 - 0.18);

  // ---- S4 end card ----
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, b(30) + 0.04);
  glint("#eye4", b(30) + 0.14, 2, true);
  KZ.rise(tl, "#endUrl", b(31) - 0.1, 0.35, 30);
  KZ.rise(tl, "#endAsk", b(32) - 0.15, 0.4, 30);
