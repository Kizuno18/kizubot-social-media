<script>
  const tl = gsap.timeline({ paused: true });
  const D = 21.15;
  const B = 60 / 122;
  const b = function (n) { return n * B; };

  function burstSvg(n, fill, stroke, sw, seed) {
    const r = KZ.rng(seed); const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n;
      const rr = i % 2 === 0 ? 100 - r() * 5 : 74 + r() * 8;
      pts.push((Math.cos(a) * rr).toFixed(1) + "," + (Math.sin(a) * rr).toFixed(1));
    }
    return '<svg viewBox="-108 -108 216 216"><polygon points="' + pts.join(" ") + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"/></svg>';
  }

  // ---------- the 13 modules (BRIEF.md list) ----------
  const MODS = [
    ["CAVEBOT", "c-yel"], ["COMBATE", "c-wht"], ["CURA", "c-blu"], ["CAPTURA", "c-red"],
    ["FARMING", "c-yel"], ["PESCA", "c-wht"], ["ALARMES", "c-blu"], ["PARTY", "c-red"],
    ["ACTIONS", "c-vio", "50+ CONDIÇÕES · 30+ AÇÕES"], ["HUMANIZAÇÃO", "c-wht"], ["ENGINE", "c-blu"], ["CONTA", "c-red"], ["SETUP POKÉMON", "c-yel"]
  ];
  // land times: slow, then every beat, pause (MAS ESPERA), then faster
  const LAND = [b(4), b(6), b(8), b(10), b(12), b(13), b(14), b(15), b(18), b(20), b(21), b(21.5), b(22)];
  const tower = document.getElementById("tower");
  const rr = KZ.rng(122);
  let topY = 1250;
  const blocks = [];
  MODS.forEach(function (m, i) {
    const h = m[2] ? 170 : 112;
    const w = m[2] ? 760 : Math.round(560 + rr() * 140);
    const cx = 485 + Math.round((rr() * 2 - 1) * 24);
    topY -= h;
    const el = document.createElement("div");
    el.className = "blk " + m[1];
    el.style.left = (cx - w / 2) + "px"; el.style.top = topY + "px"; el.style.width = w + "px"; el.style.height = h + "px";
    el.innerHTML = '<div class="n">' + String(i + 1).padStart(2, "0") + '</div>' + (m[2]
      ? '<div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding-left:40px"><div class="l" style="font-size:80px">' + m[0] + '</div><div class="l2">' + m[2] + '</div></div>'
      : '<div class="l" style="padding-left:40px">' + m[0] + '</div>');
    tower.insertBefore(el, document.getElementById("robotTop"));
    blocks.push({ el: el, top: topY, rot: (rr() * 2 - 1) * 1.6 });
  });
  const towerTop = topY; // world y of the last block's top

  // stamps: one per landing except the ACTIONS one (it gets the big "TEM MAIS!")
  const stampBox = document.getElementById("stampBox");
  const stamps = [];
  const sCols = [["#ffd60a", "#0a1b5e", "#0a1b5e"], ["#fffaf0", "#e3242b", "#e3242b"], ["#1739b8", "#ffd60a", "#ffd60a"]];
  LAND.forEach(function (t, i) {
    if (i === 8) return;
    const right = i % 2 === 0;
    const c = sCols[i % 3];
    const d = document.createElement("div");
    d.className = "burst";
    d.style.left = (right ? 650 : 110) + "px"; d.style.top = (right ? 300 : 316) + "px"; d.style.width = "290px"; d.style.height = "290px";
    d.innerHTML = burstSvg(16, c[0], c[1], 7, 30 + i) + '<div class="bt" style="font-size:60px; color:' + c[2] + '"><div>E TEM</div><div>MAIS!</div></div>';
    stampBox.appendChild(d);
    stamps.push({ el: d, t: t, rot: right ? 8 : -8 });
  });

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#rays", { rotation: 0 }, { rotation: 36, duration: D, ease: "none" }, 0);

  // ---------- S1 hook on the TV, zoom into the screen ----------
  tl.fromTo("#h1", { scale: 1.3 }, { scale: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#h2", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.32, ease: "back.out(2.6)" }, 0.1);
  KZ.shake(tl, "#hk", 0.3, 12, 0.26, 3);
  tl.to("#hk", { scale: 1.05, duration: 1.2, ease: "sine.inOut" }, 0.5);
  tl.fromTo("#scrSun", { rotation: 0 }, { rotation: 30, duration: 1.97, ease: "none" }, 0);
  tl.fromTo("#s1rays", { rotation: 0 }, { rotation: 8, duration: 1.97, ease: "none" }, 0);
  tl.fromTo("#s1robot", { y: 60 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, 0.05);
  KZ.eyePulse(tl, "#eyeS1", 0.6, 2);
  tl.fromTo("#s1in", { scale: 1 }, { scale: 2.6, duration: 0.42, ease: "power3.in" }, b(4) - 0.42);
  KZ.flash(tl, "#flash", b(4), 0.9);

  // ---------- tower ----------
  tl.fromTo("#bugDot", { opacity: 1 }, { opacity: 0.15, duration: 0.45, ease: "steps(1)", yoyo: true, repeat: 41 }, 0);
  const cntEl = document.getElementById("cnt");
  gsap.set("#world", { transformOrigin: "485px 1250px" });
  gsap.set("#tagWrap", { transformOrigin: "360px -40px" });
  gsap.set("#tower", { transformOrigin: "485px 1250px" });
  blocks.forEach(function (bk, i) {
    const t = LAND[i];
    const fd = i === 8 ? 0.2 : 0.26;
    tl.fromTo(bk.el, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t - fd);
    tl.fromTo(bk.el, { y: -1100, rotation: bk.rot * 4 }, { y: 0, rotation: bk.rot, duration: fd, ease: "power2.in" }, t - fd);
    tl.fromTo(bk.el, { scaleY: 0.82, scaleX: 1.06 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t);
    if (i > 0) KZ.shake(tl, "#tower", t, i === 8 ? 16 : 5, 0.18, 20 + i);
    // camera tilt: keep the newest block top near y 560
    const camY = Math.max(0, 650 - bk.top);
    if (camY > 0) tl.to("#world", { y: camY, duration: 0.32, ease: "power2.out" }, t + 0.02);
  });
  tl.to({}, { duration: D, ease: "none", onUpdate: function () { const t = tl.time(); let n = 0; LAND.forEach(function (x) { if (t >= x - 0.001) n++; }); cntEl.textContent = String(n); } }, 0);
  stamps.forEach(function (s) {
    tl.fromTo(s.el, { scale: 0, rotation: s.rot - 40, opacity: 1 }, { scale: 1, rotation: s.rot, duration: 0.24, ease: "back.out(3)" }, s.t);
    tl.to(s.el, { scale: 0.6, opacity: 0, duration: 0.14, ease: "power2.in" }, s.t + 0.42);
  });

  // ---------- MAS ESPERA… TEM MAIS! (7.869) ----------
  const TW = b(16);
  tl.fromTo("#dimW", { opacity: 0 }, { opacity: 1, duration: 0.12 }, TW);
  tl.fromTo("#band", { x: -1250, rotation: 6 }, { x: 0, rotation: 4, duration: 0.24, ease: "power4.out" }, TW);
  tl.fromTo("#moreT", { scale: 0.2, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.3, ease: "back.out(2.6)" }, TW + b(1));
  KZ.shake(tl, "#more", TW + b(1) + 0.2, 14, 0.24, 9);
  KZ.flash(tl, "#flash", LAND[8], 0.75, "#ffd60a");

  // ---------- zoom out: the whole tower + robot on top ----------
  const TZ = b(24);
  const S = 0.41;
  tl.to("#world", { scale: S, y: 1300 - 1250, duration: 0.7, ease: "power3.inOut" }, TZ);
  tl.fromTo("#robotTop", { y: -700, opacity: 1 }, { y: 0, duration: 0.3, ease: "power2.in" }, TZ + 0.55);
  KZ.eyePulse(tl, "#eyeT", TZ + 0.95, 2);
  tl.fromTo("#tower", { rotation: 0 }, { rotation: 1.6, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, TZ + 0.9);
  tl.fromTo("#z1", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, 11.95);
  tl.fromTo("#z2", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.4)" }, 11.95 + b(1));

  // ---------- price (13.77) ----------
  const TP = b(28);
  tl.fromTo("#dimP", { opacity: 0 }, { opacity: 1, duration: 0.15 }, TP);
  tl.fromTo("#tudoT", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "power4.out" }, TP);
  tl.fromTo("#tagWrap", { y: -1100, rotation: 0 }, { y: 0, rotation: 0, duration: 0.34, ease: "power3.out" }, TP + 0.08);
  tl.fromTo("#tagWrap", { rotation: -9 }, { rotation: 6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, TP + 0.4);
  tl.to("#tagWrap", { rotation: 0, duration: 0.4, ease: "sine.out" }, TP + 2.4);
  KZ.flash(tl, "#flash", TP + 0.4, 0.45);
  tl.fromTo("#pnum", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, TP + 0.38);
  tl.fromTo("#p9a", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, b(32));
  tl.fromTo("#p9b", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.4)" }, b(32) + 0.12);

  // ---------- end card (17.705) ----------
  const T9 = b(36);
  tl.fromTo("#endIn", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, T9);
  tl.fromTo("#endRays", { rotation: 0 }, { rotation: -18, duration: D - T9, ease: "none" }, T9);
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, T9 + 0.04);
  KZ.eyePulse(tl, "#eyeEnd", T9 + 0.14, 2);
  KZ.rise(tl, "#endUrl", T9 + 0.42, 0.35, 30);
  tl.fromTo("#endAsk", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, T9 + 0.75);
  tl.to("#endLogoWrap", { scale: 1.04, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, T9 + 0.7);
  const TO = D - 0.44;
  tl.fromTo("#offT", { yPercent: -100 }, { yPercent: 0, duration: 0.17, ease: "power3.in" }, TO);
  tl.fromTo("#offB", { yPercent: 100 }, { yPercent: 0, duration: 0.17, ease: "power3.in" }, TO);
  tl.fromTo("#offLine", { opacity: 0, scaleX: 1 }, { opacity: 1, duration: 0.03 }, TO + 0.13);
  tl.to("#offLine", { scaleX: 0.006, duration: 0.17, ease: "power3.in" }, TO + 0.17);
  tl.to("#offLine", { opacity: 0, duration: 0.06 }, TO + 0.36);

  window.__timelines["main"] = tl;
</script>
