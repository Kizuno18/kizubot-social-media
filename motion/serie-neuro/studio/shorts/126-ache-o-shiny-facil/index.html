<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>126 Ache o shiny em 3 segundos</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
  /* ================= F18 · ACHE O SHINY — series system (puzzle book) ================= */
  :root {
    --f18-paper: #fff3d6; --f18-dot: #f1d9a6; --f18-ink: #17120a; --f18-gold: #ffcf33; --f18-red: #ff4d3d; --f18-lime: #c6ff3d; --f18-sky: #7cc8ff;
  }
  #root { background: var(--f18-paper); }
  .f18-paper { position: absolute; inset: 0; background: var(--f18-paper); }
  #dots { position: absolute; inset: -60px; background-image: radial-gradient(circle, var(--f18-dot) 3.2px, rgba(0,0,0,0) 3.6px); background-size: 30px 30px; }
  .f18-vig { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 45%, rgba(255,255,255,0) 55%, rgba(120, 80, 20, .16) 100%); pointer-events: none; }
  #dark { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, #3b1470 0%, #140a22 60%, #0b0712 100%); opacity: 0; }
  #darkGrid { position: absolute; inset: -200px; opacity: 0;
    background-image: linear-gradient(rgba(168, 85, 247, .14) 2px, transparent 2px), linear-gradient(90deg, rgba(168, 85, 247, .14) 2px, transparent 2px); background-size: 90px 90px; }
  .kz-progress { height: 10px; background: rgba(23, 18, 10, .12); }
  .kz-progress > div { background: linear-gradient(90deg, #ff4d3d, #ffcf33); }

  .f18-title { position: absolute; left: 100px; width: 780px; top: 226px; text-align: center; }
  .swap { position: relative; height: 96px; }
  .swap > * { position: absolute; left: 0; right: 0; top: 0; }
  .t1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 108px; line-height: 1.02; color: var(--f18-ink); letter-spacing: -0.03em; text-transform: uppercase; }
  .t2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 80px; line-height: 1.06; color: var(--f18-ink); letter-spacing: -0.02em; text-transform: uppercase; }
  .mk { position: relative; display: inline-block; padding: 0 14px; }
  .mk::before { content: ""; position: absolute; left: 0; right: 0; top: 18%; bottom: 8%; background: var(--f18-gold); border-radius: 12px; z-index: -1; transform: rotate(-2deg); }
  .t1, .t2 { position: relative; z-index: 1; }

  /* board */
  #boardWrap { position: absolute; left: 100px; top: 492px; width: 780px; height: 890px; }
  .board { position: absolute; inset: 0; border-radius: 40px; background: #fffdf7; border: 7px solid var(--f18-ink); box-shadow: 0 16px 0 var(--f18-ink); }
  #grid { position: absolute; left: 26px; top: 26px; right: 26px; bottom: 26px; display: grid; }
  .cell { display: flex; align-items: center; justify-content: center; }
  .emo { display: block; line-height: 1; font-family: "Noto Color Emoji", sans-serif; will-change: transform; }
  .shiny .emo { filter: hue-rotate(120deg) saturate(1.35) brightness(1.04); }
  #ring { position: absolute; overflow: visible; pointer-events: none; }
  #ring path { fill: none; stroke: var(--f18-red); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }

  /* timer sticker */
  #tbar { position: absolute; left: 100px; top: 424px; width: 690px; height: 44px; border-radius: 22px; background: #fff; border: 6px solid var(--f18-ink); overflow: hidden; }
  #tfill { position: absolute; inset: 0; background: linear-gradient(90deg, #ff4d3d, #ffcf33); transform-origin: 0 50%; }
  #timer { position: absolute; left: 810px; top: 392px; width: 116px; height: 116px; }
  .tm-bg { position: absolute; inset: 0; border-radius: 50%; background: var(--f18-red); border: 6px solid var(--f18-ink); box-shadow: 0 8px 0 var(--f18-ink); }
  .tm-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 76px; color: #fff; opacity: 0; }
  #tm3 { opacity: 1; }
  /* pause sticker */
  .pw { display: flex; justify-content: center; }
  #pause { display: inline-flex; white-space: nowrap; padding: 10px 32px; border-radius: 999px; background: var(--f18-ink); color: var(--f18-gold);
    align-items: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 54px; letter-spacing: -0.01em; text-transform: uppercase; opacity: 0; }
  #pause i { display: inline-block; width: 14px; height: 44px; background: var(--f18-gold); border-radius: 4px; box-shadow: 24px 0 0 var(--f18-gold); margin-right: 42px; }
  #timeUp { position: absolute; left: 100px; width: 780px; top: 760px; text-align: center; text-transform: uppercase; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 190px; color: var(--f18-red);
    -webkit-text-stroke: 8px var(--f18-ink); paint-order: stroke fill; opacity: 0; letter-spacing: -0.03em; }
  #coord { position: absolute; left: 100px; width: 780px; top: 1316px; text-align: center; opacity: 0; }
  #coord span { display: inline-block; padding: 16px 34px; border-radius: 999px; background: var(--f18-ink); color: var(--f18-lime); font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 56px; }
  .spark { position: absolute; left: 0; top: 0; width: 20px; height: 20px; opacity: 0; }
  #sparkField { position: absolute; left: 0; top: 0; width: 0; height: 0; }

  /* product part (dark) */
  .pv { position: absolute; left: 90px; width: 790px; text-align: center; }
  .pv1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 96px; line-height: 1.04; color: var(--f18-ink); text-transform: uppercase; letter-spacing: -0.02em; }
  .pv2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 112px; line-height: 1.04; color: #fff; text-transform: uppercase; letter-spacing: -0.02em; }
  .pv2 em { font-style: normal; color: var(--f18-lime); }
  #printWrap { position: absolute; left: 90px; top: 720px; width: 840px; height: 358px; }
  .f18-print { position: absolute; inset: 0; border-radius: 30px; overflow: hidden; background: #1b1b1f; box-shadow: 0 0 0 4px var(--f18-lime), 0 30px 90px rgba(124, 58, 237, .5); }
  .f18-print img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-bubble { position: absolute; left: 4.8%; right: 3.6%; border-radius: 16px; background: #1f4d3c; }
  .tag { position: absolute; left: 90px; top: 1110px; padding: 10px 20px; border-radius: 999px; background: rgba(8, 5, 14, .85); border: 2px solid var(--f18-lime);
    font: 700 30px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--f18-lime); text-transform: uppercase; }
  .hlp { position: absolute; border-radius: 18px; border: 7px solid var(--f18-gold); box-shadow: 0 0 30px rgba(255, 207, 51, .6); opacity: 0; }
  .claim { position: absolute; left: 90px; width: 790px; top: 1186px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .claim span { padding: 12px 26px; border-radius: 999px; font: 800 46px "Inter", sans-serif; background: #fff; color: #120a1c; }
  .claim span.g { background: var(--f18-gold); }
  .claim span.v { background: #c4a1ff; }
  .claim span.r { background: #ff8a7a; }

  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(244,214,255,1) 0%, rgba(192,132,252,.85) 30%, rgba(168,85,247,0) 70%); mix-blend-mode: screen; }
  .ask { font: 900 64px "Inter", sans-serif; color: #f5f0fa; max-width: 800px; line-height: 1.12; }
  .ask b { color: var(--f18-gold); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="16" data-fps="30">
  <div class="f18-paper"></div>
  <div id="dots"></div>
  <div class="f18-vig"></div>
  <div id="dark"></div>
  <div id="darkGrid"></div>

  <!-- PUZZLE 0 - 8.0 -->
  <section id="pz" class="clip" data-start="0" data-duration="8">
    <div id="pzIn" style="position:absolute; inset:0">
      <div class="f18-title" id="title">
        <div class="t1" id="tA">Ache o <span class="mk">shiny</span></div>
        <div class="swap"><div class="t2" id="tB">em 3 segundos</div><div class="pw"><div id="pause"><i></i>pausa e procura!</div></div></div>
      </div>
      <div id="tbar"><div id="tfill"></div></div>
      <div id="boardWrap">
        <div class="board"></div>
        <div id="grid"></div>
        <svg id="ring" viewBox="0 0 200 200"><path id="ringPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M 30 104 C 22 50, 86 18, 132 30 C 178 44, 190 104, 158 146 C 128 186, 56 184, 34 140 C 22 116, 34 84, 58 66" /></svg>
        <div id="sparkField"></div>
      </div>
      <div id="timer">
        <div class="tm-bg"></div>
        <div class="tm-n" id="tm3">3</div><div class="tm-n" id="tm2">2</div><div class="tm-n" id="tm1">1</div><div class="tm-n" id="tm0">0</div>
      </div>
      <div id="timeUp">tempo!</div>
      <div id="coord"><span>linha 5 · coluna 2</span></div>
    </div>
  </section>

  <!-- PIVOT 6.4 - 8.0 (paper) -->
  <section id="pv" class="clip" data-start="6.4" data-duration="1.6">
    <div class="pv" id="pvA" style="top:300px"><div class="pv1">Você teve</div><div class="pv1">que procurar.</div></div>
  </section>

  <!-- PRODUCT 8.0 - 12.8 (lights off: KizuBot) -->
  <section id="pr" class="clip" data-start="8" data-duration="4.8">
    <div id="prIn" style="position:absolute; inset:0">
      <div class="pv" id="pvB" style="top:290px"><div class="pv2">O KizuBot</div><div class="pv2"><em>detecta sozinho.</em></div></div>
      <div id="printWrap">
        <div class="f18-print" id="print">
          <img src="kit/img/prints/shiny-cubone--alarm.png" alt="" />
        </div>
        <div class="hlp" id="hlp" style="left:0.8%; top:4.5%; width:98%; height:45%"></div>
      </div>
      <div class="tag" id="tag">print real de cliente</div>
      <div class="claim" id="claim">
        <span class="g" id="c1">shiny</span><span class="v" id="c2">mega</span><span class="r" id="c3">boss</span><span id="c4">alarme no zap</span>
      </div>
    </div>
  </section>

  <!-- END 12.8 - 16 -->
  <section id="end" class="clip" data-start="12.8" data-duration="3.2">
    <div class="kz-end" id="endIn" style="padding-right:200px">
      <div style="position:relative; width:540px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" style="width:540px" />
        <div class="eye" id="eye" style="left:169px; top:7px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk">Achou em <b>quantos segundos?</b></div>
    </div>
  </section>

  <div class="kz-progress"><div id="prog"></div></div>
  <div id="flash"></div>
  <div id="blackout"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 16;
  const b = KZ.beats(150);            // beat 0.4 s, bar 1.6 s

  /* ---------- puzzle config (fairness: the shiny is fully inside the readable box) ---------- */
  const COLS = 5, ROWS = 7, EMO = "\u{1F41B}", SH = { r: 4, c: 1 };   // linha 5, coluna 2
  const GW = 780 - 52, GH = 890 - 52;                                  // grid box inside the board
  const CW = GW / COLS, CH = GH / ROWS, FS = Math.floor(Math.min(CW, CH) * 0.78);
  (function () {
    const g = document.getElementById("grid");
    g.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
    g.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (r === SH.r && c === SH.c ? " shiny" : "");
      cell.id = "c" + r + "_" + c;
      const e = document.createElement("span"); e.className = "emo"; e.textContent = EMO; e.style.fontSize = FS + "px";
      cell.appendChild(e); g.appendChild(cell);
    }
    // answer ring + sparkle field centered on the shiny cell (board coords)
    const cx = 26 + (SH.c + 0.5) * CW, cy = 26 + (SH.r + 0.5) * CH, R = Math.min(CW, CH) * 0.78;
    const ring = document.getElementById("ring");
    ring.style.left = (cx - R) + "px"; ring.style.top = (cy - R) + "px"; ring.style.width = (2 * R) + "px"; ring.style.height = (2 * R) + "px";
    const sf = document.getElementById("sparkField"); sf.style.left = cx + "px"; sf.style.top = cy + "px";
  })();

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#dots", { x: 0, y: 0 }, { x: 30, y: 60, duration: D, ease: "none" }, 0);

  /* idle: a gentle wave across the grid so no frame is frozen */
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    tl.fromTo("#c" + r + "_" + c + " .emo", { scale: 1, y: 0 }, { scale: 1.06, y: -4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.2 + ((r + c) % 6) * 0.13);
  }

  /* ---------- hook ---------- */
  tl.fromTo("#tA", { scale: 1.25, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  KZ.slam(tl, "#tB", 0.16, 1.6);
  tl.fromTo("#boardWrap", { y: 40, scale: 0.97 }, { y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0);
  tl.fromTo("#timer", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.4)" }, b(1.5));
  tl.fromTo("#tbar", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out", transformOrigin: "0% 50%" }, b(1.5));
  tl.to("#tB", { y: -30, opacity: 0, duration: 0.15, ease: "power2.in" }, 1.6 - 0.15);
  tl.fromTo("#pause", { scale: 0.5, opacity: 0, rotation: 4 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.3, ease: "back.out(2.4)" }, 1.6);
  tl.to("#pause", { rotation: 2, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.9);

  /* ---------- countdown: exactly 3 seconds (1.6 -> 4.6), ticks land on the 8th-note grid ---------- */
  const T0 = 1.6;
  tl.fromTo("#tfill", { scaleX: 1 }, { scaleX: 0, duration: 3.0, ease: "none" }, T0);
  [["#tm3", "#tm2", T0 + 1], ["#tm2", "#tm1", T0 + 2], ["#tm1", "#tm0", T0 + 3]].forEach(function (s) {
    tl.set(s[0], { opacity: 0 }, s[2]);
    tl.fromTo(s[1], { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, s[2]);
    KZ.shake(tl, "#timer", s[2], 5, 0.18, Math.round(s[2] * 10));
  });
  KZ.shake(tl, "#timer", T0, 4, 0.16, 7);

  /* ---------- time's up: answer ---------- */
  const A = 4.6;
  tl.to("#pause", { scale: 0, opacity: 0, duration: 0.15, ease: "power2.in" }, A - 0.1);
  tl.fromTo("#timeUp", { scale: 2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.22, ease: "power4.out" }, A);
  tl.to("#timeUp", { scale: 0.6, opacity: 0, duration: 0.18, ease: "power2.in" }, A + 0.55);
  tl.to(".cell:not(.shiny) .emo", { opacity: 0.13, duration: 0.3, ease: "power2.out" }, A + 0.55);
  tl.fromTo(".shiny .emo", { scale: 1 }, { scale: 1.38, duration: 0.35, ease: "back.out(3)", immediateRender: false }, A + 0.6);
  tl.to("#ringPath", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, A + 0.62);
  (function () {
    const field = document.getElementById("sparkField");
    const cols = ["#ffcf33", "#ff4d3d", "#7cc8ff", "#c6ff3d"];
    const pr = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const parts = [];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("div"); el.className = "spark";
      const s = 12 + pr(i * 3 + 1) * 14; el.style.width = s + "px"; el.style.height = s + "px"; el.style.background = cols[i % 4];
      el.style.borderRadius = (i % 3 === 0 ? "50%" : "4px"); el.style.border = "3px solid #17120a";
      field.appendChild(el);
      const a = pr(i * 5 + 2) * Math.PI * 2, sp = 300 + pr(i * 7 + 3) * 360;
      parts.push({ el: el, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120 });
    }
    const dr = { T: 0 }, FL = 0.9;
    tl.fromTo(dr, { T: 0 }, { T: 1, duration: FL, ease: "none", onUpdate: function () {
      const t = dr.T * FL, fade = Math.min(1, (1 - dr.T) / 0.3);
      parts.forEach(function (p) { p.el.style.transform = "translate(" + (p.vx * t) + "px," + (p.vy * t + 420 * t * t) + "px) rotate(" + (260 * t) + "deg)"; p.el.style.opacity = String(dr.T === 0 ? 0 : fade); });
    } }, A + 0.62);
  })();
  tl.fromTo("#coord", { y: 30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 0.9);
  tl.to(".shiny .emo", { scale: 1.3, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, A + 1.0);

  /* ---------- pivot: the board slides down, the line lands ---------- */
  const P = 6.4;
  tl.to("#title", { y: -40, opacity: 0, duration: 0.2, ease: "power2.in" }, P - 0.2);
  tl.to(["#timer", "#coord", "#tbar"], { scale: 0.5, opacity: 0, duration: 0.2, ease: "power2.in" }, P - 0.2);
  tl.to("#boardWrap", { y: 330, scale: 0.86, duration: 0.45, ease: "power3.inOut" }, P - 0.15);
  KZ.slam(tl, "#pvA", P + 0.05, 1.6);

  /* ---------- product: lights off ---------- */
  const R = 8.0;
  tl.to("#pzIn", { opacity: 0, duration: 0.01 }, R - 0.01);
  KZ.flash(tl, "#flash", R, 0.9);
  tl.fromTo("#dark", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, R);
  tl.fromTo("#darkGrid", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power2.out" }, R);
  tl.fromTo("#darkGrid", { x: 0, y: 0 }, { x: 45, y: 90, duration: 8, ease: "none", immediateRender: false }, R);
  KZ.slam(tl, "#pvB", R, 1.6);
  tl.fromTo("#printWrap", { y: 120, scale: 0.9, filter: "blur(16px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, R + 0.15);
  KZ.pop(tl, "#tag", R + 0.5, 0.3);
  tl.fromTo("#hlp", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, R + b(2));
  ["#c1", "#c2", "#c3", "#c4"].forEach(function (c, i) { KZ.pop(tl, c, R + b(5) + i * 0.14, 0.32); });
  tl.to("#printWrap", { scale: 1.03, duration: 3.5, ease: "sine.inOut" }, R + 0.7);
  tl.to("#prIn", { opacity: 0, scale: 0.95, duration: 0.18, ease: "power2.in" }, 12.8 - 0.2);

  /* ---------- END ---------- */
  const E = 12.8;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, E + 0.04);
  KZ.eyePulse(tl, "#eye", E + 0.14, 3);
  KZ.rise(tl, "#endUrl", E + 0.45, 0.35, 30);
  KZ.rise(tl, "#endAsk", E + 0.8, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, E + 0.6);
  tl.fromTo("#blackout", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
