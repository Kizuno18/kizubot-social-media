<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>128 Nível impossível</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
  /* ================= F18 · ACHE O SHINY — ep. 128 (impossible, lavender + hazard) ================= */
  :root { --f18-paper: #ece6ff; --f18-dot: #d4c8f7; --f18-ink: #170c2e; --f18-acc: #ffd400; --f18-red: #ff3b5c; --f18-lime: #c6ff3d; --f18-gold: #ffcf33; }
  #root { background: var(--f18-paper); }
  .f18-paper { position: absolute; inset: 0; background: var(--f18-paper); }
  #lines { position: absolute; inset: -100px; background-image: repeating-linear-gradient(0deg, rgba(23, 12, 46, .07) 0 2px, rgba(0,0,0,0) 2px 36px); }
  .f18-vig { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 45%, rgba(255,255,255,0) 55%, rgba(60, 30, 120, .16) 100%); pointer-events: none; }
  #dark { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, #3b1470 0%, #140a22 60%, #0b0712 100%); opacity: 0; }
  #darkGrid { position: absolute; inset: -200px; opacity: 0;
    background-image: linear-gradient(rgba(168, 85, 247, .14) 2px, transparent 2px), linear-gradient(90deg, rgba(168, 85, 247, .14) 2px, transparent 2px); background-size: 90px 90px; }
  .kz-progress { height: 10px; background: rgba(23, 12, 46, .12); }
  .kz-progress > div { background: repeating-linear-gradient(-45deg, #ffd400 0 14px, #170c2e 14px 28px); }

  .f18-title { position: absolute; left: 100px; width: 780px; top: 226px; text-align: center; }
  .warn { display: inline-flex; align-items: center; gap: 14px; padding: 6px 24px; border-radius: 14px; background: var(--f18-acc); color: var(--f18-ink); border: 5px solid var(--f18-ink);
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 44px; text-transform: uppercase; transform: rotate(-2deg); }
  .warn svg { width: 46px; height: 42px; }
  .t1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 120px; line-height: 1.04; color: var(--f18-ink); letter-spacing: -0.035em; text-transform: uppercase; margin-top: 4px; }
  .t1.r { color: var(--f18-red); }
  .t0 { display: flex; align-items: center; justify-content: center; gap: 16px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 88px; line-height: 1; color: var(--f18-ink); text-transform: uppercase; letter-spacing: -0.02em; }
  .t0 svg { width: 84px; height: 76px; }

  /* timer: stopwatch + fuse */
  #tbar { position: absolute; left: 100px; top: 470px; width: 690px; height: 40px; border-radius: 20px; background: #fff; border: 6px solid var(--f18-ink); overflow: hidden; }
  #tfill { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, #ff3b5c 0 18px, #ff6d86 18px 36px); transform-origin: 0 50%; }
  #timer { position: absolute; left: 792px; top: 428px; width: 120px; height: 120px; }
  .tm-bg { position: absolute; inset: 0; border-radius: 50%; background: var(--f18-ink); border: 6px solid var(--f18-acc); box-shadow: 0 8px 0 rgba(23,12,46,.35); }
  .tm-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 74px; color: var(--f18-acc); opacity: 0; }
  #tm4 { opacity: 1; }
  .swapP { position: absolute; left: 100px; width: 780px; top: 1416px; display: flex; justify-content: center; }

  /* board with hazard frame */
  #boardWrap { position: absolute; left: 100px; top: 532px; width: 780px; height: 866px; }
  .hazard { position: absolute; inset: 0; border-radius: 34px; background: repeating-linear-gradient(-45deg, #ffd400 0 26px, #170c2e 26px 52px); box-shadow: 0 14px 0 var(--f18-ink); }
  .board { position: absolute; inset: 16px; border-radius: 22px; background: #fdfcff; }
  #grid { position: absolute; left: 28px; top: 28px; right: 28px; bottom: 28px; display: grid; }
  .cell { display: flex; align-items: center; justify-content: center; }
  .emo { display: block; line-height: 1; font-family: "Noto Color Emoji", sans-serif; will-change: transform; }
  .shiny .emo { filter: hue-rotate(25deg) saturate(1.15); }
  #spot { position: absolute; inset: 16px; border-radius: 22px; opacity: 0; pointer-events: none; }
  #ring { position: absolute; overflow: visible; pointer-events: none; }
  #ring path { fill: none; stroke: var(--f18-red); stroke-width: 11; stroke-linecap: round; }
  #timeUp { position: absolute; left: 100px; width: 780px; top: 800px; text-align: center; text-transform: uppercase; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 190px; color: var(--f18-acc);
    -webkit-text-stroke: 8px var(--f18-ink); paint-order: stroke fill; opacity: 0; letter-spacing: -0.03em; }
  #coord { position: absolute; left: 100px; width: 780px; top: 640px; text-align: center; opacity: 0; }
  #coord span { display: inline-block; padding: 14px 34px; border-radius: 999px; background: var(--f18-acc); color: var(--f18-ink); border: 5px solid var(--f18-ink); font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 56px; }
  .pill { display: inline-flex; white-space: nowrap; align-items: center; padding: 8px 30px; border-radius: 999px; background: var(--f18-ink); color: var(--f18-acc);
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 46px; text-transform: uppercase; opacity: 0; }
  .pill i { display: inline-block; width: 12px; height: 34px; background: currentColor; border-radius: 4px; box-shadow: 22px 0 0 currentColor; margin-right: 40px; }
  .spark { position: absolute; left: 0; top: 0; width: 20px; height: 20px; opacity: 0; }
  #sparkField { position: absolute; left: 0; top: 0; width: 0; height: 0; }

  /* pivot + product */
  .pv { position: absolute; left: 90px; width: 790px; text-align: center; }
  .pv1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 100px; line-height: 1.04; color: var(--f18-ink); text-transform: uppercase; letter-spacing: -0.02em; }
  .pv1 .r { color: var(--f18-red); }
  .pv2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 104px; line-height: 1.04; color: #fff; text-transform: uppercase; letter-spacing: -0.02em; }
  .pv2 em { font-style: normal; color: var(--f18-lime); }
  #cardWrap { position: absolute; left: 110px; top: 640px; width: 500px; height: 531px; }
  .f18-print { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: #15161a; box-shadow: 0 0 0 4px var(--f18-gold), 0 30px 90px rgba(255, 207, 51, .25); }
  .f18-print img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-sprite { position: absolute; left: 30%; top: 8%; width: 40%; height: 22%; border-radius: 40%; background: rgba(170, 140, 120, .7); }
  .ph-t { position: absolute; left: 10%; height: 5%; border-radius: 8px; background: rgba(255,255,255,.3); }
  #quoteWrap { position: absolute; left: 300px; top: 1110px; width: 580px; height: 183px; }
  .qprint { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #1f2327; box-shadow: 0 0 0 4px #fff, 0 20px 60px rgba(0,0,0,.5); }
  .qprint img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-q { position: absolute; left: 4%; height: 26%; border-radius: 10px; background: rgba(255,255,255,.35); }
  .tag { position: absolute; left: 90px; top: 1330px; padding: 10px 20px; border-radius: 999px; background: rgba(8, 5, 14, .85); border: 2px solid var(--f18-lime);
    font: 700 30px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--f18-lime); text-transform: uppercase; }
  .qq { position: absolute; left: 650px; top: 690px; width: 300px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 92px; line-height: 1; color: var(--f18-gold); text-align: left; }

  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(244,214,255,1) 0%, rgba(192,132,252,.85) 30%, rgba(168,85,247,0) 70%); mix-blend-mode: screen; }
  .ask { font: 900 64px "Inter", sans-serif; color: #f5f0fa; max-width: 800px; line-height: 1.12; }
  .ask b { color: var(--f18-acc); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="18" data-fps="30">
  <div class="f18-paper"></div>
  <div id="lines"></div>
  <div class="f18-vig"></div>
  <div id="dark"></div>
  <div id="darkGrid"></div>

  <!-- PUZZLE 0 - 8.0 -->
  <section id="pz" class="clip" data-start="0" data-duration="8">
    <div id="pzIn" style="position:absolute; inset:0">
      <div class="f18-title" id="title">
        <div class="t0" id="warn"><svg viewBox="0 0 46 42"><path d="M23 3 L44 39 H2 Z" fill="#170c2e"/><path d="M23 15 V27 M23 32 V34" stroke="#ffd400" stroke-width="5" stroke-linecap="round"/></svg>Nível</div>
        <div class="t1 r" id="tA">impossível</div>
      </div>
      <div id="tbar"><div id="tfill"></div></div>
      <div id="timer"><div class="tm-bg"></div><div class="tm-n" id="tm4">4</div><div class="tm-n" id="tm3">3</div><div class="tm-n" id="tm2">2</div><div class="tm-n" id="tm1">1</div><div class="tm-n" id="tm0">0</div></div>
      <div id="boardWrap">
        <div class="hazard"></div>
        <div class="board"></div>
        <div id="grid"></div>
        <div id="spot"></div>
        <svg id="ring" viewBox="0 0 200 200"><path id="ringPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M 34 108 C 24 52, 88 20, 134 32 C 180 46, 190 106, 156 148 C 126 186, 56 182, 36 138 C 26 114, 38 84, 60 66" /></svg>
        <div id="sparkField"></div>
      </div>
      <div id="timeUp">tempo!</div>
      <div id="coord"><span>linha 13 · coluna 9</span></div>
    </div>
  </section>

  <!-- PIVOT 8.0 - 9.333 -->
  <section id="pv" class="clip" data-start="8" data-duration="1.333">
    <div class="pv" id="pvA" style="top:640px"><div class="pv1">No olho, é</div><div class="pv1"><span class="r">quase impossível.</span></div></div>
  </section>

  <!-- PRODUCT 9.333 - 14.667 -->
  <section id="pr" class="clip" data-start="9.333" data-duration="5.334">
    <div id="prIn" style="position:absolute; inset:0">
      <div class="pv" id="pvB" style="top:250px"><div class="pv2">O KizuBot</div><div class="pv2"><em>detecta sozinho.</em></div></div>
      <div id="cardWrap">
        <div class="f18-print" id="card">
          <img src="kit/img/prints/shiny-muk--card.png" alt="" />
        </div>
      </div>
      <div id="quoteWrap">
        <div class="qprint" id="qprint">
          <img src="kit/img/prints/shiny-muk--quote.png" alt="" />
        </div>
      </div>
      <div class="qq" id="qq"><div>“tava</div><div>afk”</div></div>
      <div class="tag" id="tag">print real de cliente</div>
    </div>
  </section>

  <!-- END 14.667 - 18 -->
  <section id="end" class="clip" data-start="14.667" data-duration="3.333">
    <div class="kz-end" id="endIn" style="padding-right:200px">
      <div style="position:relative; width:540px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" style="width:540px" />
        <div class="eye" id="eye" style="left:169px; top:7px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk">Achou <b>sem pausar?</b></div>
    </div>
  </section>

  <div class="kz-progress"><div id="prog"></div></div>
  <div id="flash"></div>
  <div id="blackout"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 18;
  const b = KZ.beats(180);            // beat 0.333 s, bar 1.333 s

  /* ---------- puzzle config: mixed animals, one fox shifted 25deg, bottom-right corner ---------- */
  const COLS = 9, ROWS = 13, SH = { r: 12, c: 8 };                     // linha 13, coluna 9
  const SPECIES = ["\u{1F98A}", "\u{1F438}", "\u{1F41F}", "\u{1F980}", "\u{1F40C}", "\u{1F426}"];
  const GW = 780 - 56, GH = 866 - 56, CW = GW / COLS, CH = GH / ROWS, FS = Math.floor(Math.min(CW, CH) * 0.82);
  const rnd = KZ.rng(128);
  (function () {
    const g = document.getElementById("grid");
    g.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)"; g.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const shiny = r === SH.r && c === SH.c;
      let sp = SPECIES[Math.floor(rnd() * SPECIES.length)];
      if (shiny) sp = SPECIES[0];
      const cell = document.createElement("div"); cell.className = "cell" + (shiny ? " shiny" : ""); cell.id = "c" + r + "_" + c;
      const e = document.createElement("span"); e.className = "emo"; e.textContent = sp; e.style.fontSize = FS + "px";
      cell.appendChild(e); g.appendChild(cell);
    }
  })();
  const SX = 28 + (SH.c + 0.5) * CW, SY = 28 + (SH.r + 0.5) * CH;
  (function () {
    const R = Math.min(CW, CH) * 1.05;
    const c = document.getElementById("ring");
    c.style.left = (SX - R) + "px"; c.style.top = (SY - R) + "px"; c.style.width = 2 * R + "px"; c.style.height = 2 * R + "px";
    const sf = document.getElementById("sparkField"); sf.style.left = SX + "px"; sf.style.top = SY + "px";
  })();
  // spotlight: a hole in a dark veil, driven by a proxy (board coords)
  const spotEl = document.getElementById("spot");
  const sp = { x: 390, y: 433, r: 120 };
  function drawSpot() { spotEl.style.background = "radial-gradient(circle at " + (sp.x - 16) + "px " + (sp.y - 16) + "px, rgba(23,12,46,0) 0px, rgba(23,12,46,0) " + sp.r + "px, rgba(23,12,46,.88) " + (sp.r + 26) + "px)"; }
  drawSpot();

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#lines", { y: 0 }, { y: 72, duration: D, ease: "none" }, 0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    tl.fromTo("#c" + r + "_" + c + " .emo", { y: 3 }, { y: -3, duration: 0.333, ease: "sine.inOut", yoyo: true, repeat: 15 }, ((r * 5 + c * 3) % 6) * 0.111);
  }

  /* ---------- hook ---------- */
  tl.fromTo("#tA", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "power4.out" }, 0.12);
  tl.fromTo("#warn", { scale: 1.3, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#boardWrap", { scale: 0.94, y: 30 }, { scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 0);
  KZ.shake(tl, "#title", b(2), 8, 0.25, 9);
  tl.fromTo("#timer", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, b(2));
  tl.fromTo("#tbar", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "power3.out", transformOrigin: "0% 50%" }, b(2));

  /* ---------- countdown: 4 seconds (1.333 -> 5.333) ---------- */
  const T0 = 1.333;
  tl.fromTo("#tfill", { scaleX: 1 }, { scaleX: 0, duration: 4, ease: "none" }, T0);
  for (let k = 1; k <= 4; k++) {
    const at = T0 + k;
    tl.set("#tm" + (5 - k), { opacity: 0 }, at);
    tl.fromTo("#tm" + (4 - k), { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out" }, at);
    KZ.shake(tl, "#timer", at, 5, 0.18, 60 + k);
  }
  // halfway re-hook: the warning chip turns into a hint
  tl.to("#tA", { rotation: 2, scale: 1.05, duration: 0.167, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.333);

  /* ---------- time's up: spotlight sweep to the corner ---------- */
  const A = 5.333;
  tl.fromTo("#timeUp", { scale: 2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.2, ease: "power4.out" }, A);
  tl.to("#timeUp", { scale: 0.6, opacity: 0, duration: 0.15, ease: "power2.in" }, A + 0.45);
  tl.fromTo("#spot", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, A + 0.5);
  tl.fromTo(sp, { x: 390, y: 433, r: 140 }, { x: SX + 16, y: SY + 16, r: 62, duration: 0.8, ease: "power3.inOut", onUpdate: drawSpot }, A + 0.6);
  tl.fromTo(".shiny .emo", { scale: 1 }, { scale: 1.5, duration: 0.3, ease: "back.out(3)", immediateRender: false }, A + 1.4);
  tl.to("#ringPath", { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.inOut" }, A + 1.4);
  (function () {
    const field = document.getElementById("sparkField");
    const cols = ["#ffd400", "#ff3b5c", "#ffffff", "#c6ff3d"];
    const pr = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const parts = [];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("div"); el.className = "spark";
      const s = 12 + pr(i * 3 + 1) * 14; el.style.width = s + "px"; el.style.height = s + "px"; el.style.background = cols[i % 4];
      el.style.borderRadius = (i % 3 === 0 ? "50%" : "4px"); el.style.border = "3px solid #170c2e"; field.appendChild(el);
      const a = -Math.PI / 2 - 0.6 - pr(i * 5 + 2) * 1.8, spd = 320 + pr(i * 7 + 3) * 380;
      parts.push({ el: el, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd });
    }
    const dr = { T: 0 }, FL = 0.9;
    tl.fromTo(dr, { T: 0 }, { T: 1, duration: FL, ease: "none", onUpdate: function () {
      const t = dr.T * FL, fade = Math.min(1, (1 - dr.T) / 0.3);
      parts.forEach(function (p) { p.el.style.transform = "translate(" + (p.vx * t) + "px," + (p.vy * t + 420 * t * t) + "px) rotate(" + (260 * t) + "deg)"; p.el.style.opacity = String(dr.T === 0 ? 0 : fade); });
    } }, A + 1.4);
  })();
  tl.fromTo("#coord", { y: 30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 1.5);
  tl.to("#pzIn", { scale: 0.9, opacity: 0, duration: 0.25, ease: "power3.in" }, 8 - 0.25);

  /* ---------- pivot ---------- */
  KZ.slam(tl, "#pvA", 8.0, 1.6);
  KZ.shake(tl, "#pvA", 8.05, 6, 0.25, 81);

  /* ---------- product ---------- */
  const R = 9.333;
  KZ.flash(tl, "#flash", R, 0.85);
  tl.fromTo("#dark", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, R);
  tl.fromTo("#darkGrid", { opacity: 0, x: 0, y: 0 }, { opacity: 0.6, x: 40, y: 80, duration: 8.6, ease: "none" }, R);
  KZ.slam(tl, "#pvB", R, 1.6);
  tl.fromTo("#cardWrap", { y: 140, rotation: -8, opacity: 0 }, { y: 0, rotation: -3, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, R + 0.2);
  KZ.pop(tl, "#tag", R + 0.5, 0.3);
  tl.fromTo("#quoteWrap", { x: 300, rotation: 6, opacity: 0 }, { x: 0, rotation: 2, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, R + b(5));
  tl.fromTo("#qq", { scale: 0.5, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.35, ease: "back.out(2.4)" }, R + b(8));
  tl.to("#cardWrap", { y: -10, duration: 2.6, ease: "sine.inOut" }, R + 0.7);
  tl.to("#prIn", { opacity: 0, scale: 0.95, duration: 0.18, ease: "power2.in" }, 14.667 - 0.2);

  /* ---------- END ---------- */
  const E = 14.667;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, E + 0.04);
  KZ.eyePulse(tl, "#eye", E + 0.14, 3);
  KZ.rise(tl, "#endUrl", E + 0.45, 0.35, 30);
  KZ.rise(tl, "#endAsk", E + 0.8, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, E + 0.6);
  tl.fromTo("#blackout", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
