<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>129 Ache o boss</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
  /* ================= F18 · ACHE O SHINY — ep. 129 (boss, rose paper) ================= */
  :root { --f18-paper: #ffe4e1; --f18-dot: #f8c4bf; --f18-ink: #1d0a0a; --f18-red: #e8261a; --f18-gold: #ffcf33; --f18-lime: #c6ff3d; }
  #root { background: var(--f18-paper); }
  .f18-paper { position: absolute; inset: 0; background: var(--f18-paper); }
  #xs { position: absolute; inset: -80px; background-image: radial-gradient(circle, var(--f18-dot) 3px, rgba(0,0,0,0) 3.4px), radial-gradient(circle, var(--f18-dot) 3px, rgba(0,0,0,0) 3.4px);
    background-size: 44px 44px; background-position: 0 0, 22px 22px; }
  .f18-vig { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 45%, rgba(255,255,255,0) 55%, rgba(140, 20, 10, .14) 100%); pointer-events: none; }
  #dark { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, #3b1470 0%, #140a22 60%, #0b0712 100%); opacity: 0; }
  #darkGrid { position: absolute; inset: -200px; opacity: 0;
    background-image: linear-gradient(rgba(168, 85, 247, .14) 2px, transparent 2px), linear-gradient(90deg, rgba(168, 85, 247, .14) 2px, transparent 2px); background-size: 90px 90px; }
  .kz-progress { height: 10px; background: rgba(29, 10, 10, .12); }
  .kz-progress > div { background: linear-gradient(90deg, #e8261a, #ff8a65); }

  .f18-title { position: absolute; left: 100px; width: 780px; top: 230px; display: flex; justify-content: center; }
  .chipT { display: inline-flex; align-items: center; gap: 20px; padding: 6px 34px 12px; border-radius: 26px; background: var(--f18-red); border: 7px solid var(--f18-ink); box-shadow: 0 12px 0 var(--f18-ink); transform: rotate(-2deg);
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 104px; line-height: 1.02; color: #fff; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; }
  .swap { position: absolute; left: 100px; width: 780px; top: 404px; height: 60px; }
  .swap > div { position: absolute; inset: 0; display: flex; justify-content: center; }
  .pill { display: inline-flex; white-space: nowrap; align-items: center; padding: 6px 28px; border-radius: 999px; background: var(--f18-ink); color: #ffb4ab;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 44px; text-transform: uppercase; opacity: 0; }
  .pill i { display: inline-block; width: 12px; height: 32px; background: currentColor; border-radius: 4px; box-shadow: 22px 0 0 currentColor; margin-right: 40px; }
  .pill.y { background: var(--f18-gold); color: var(--f18-ink); }
  /* boss-HP timer */
  #hp { position: absolute; left: 100px; top: 478px; width: 780px; opacity: 0; }
  .hp-top { display: flex; justify-content: space-between; align-items: baseline; font: 700 32px "Chakra Petch", sans-serif; letter-spacing: .1em; color: var(--f18-ink); text-transform: uppercase; margin-bottom: 6px; }
  #hpN { font-size: 40px; font-variant-numeric: tabular-nums; color: var(--f18-red); text-transform: none; }
  .hp-track { position: relative; height: 34px; border-radius: 8px; background: #3b0f0c; border: 5px solid var(--f18-ink); overflow: hidden; }
  #hpFill { position: absolute; inset: 0; background: linear-gradient(180deg, #ff6f61, #e8261a 55%, #a5130b); transform-origin: 0 50%; }

  #boardWrap { position: absolute; left: 100px; top: 578px; width: 780px; height: 820px; }
  .board { position: absolute; inset: 0; border-radius: 36px; background: #fffaf9; border: 7px solid var(--f18-ink); box-shadow: 0 14px 0 var(--f18-ink); }
  #grid { position: absolute; left: 26px; top: 26px; right: 26px; bottom: 26px; display: grid; }
  .cell { display: flex; align-items: center; justify-content: center; position: relative; }
  .emo { display: block; line-height: 1; font-family: "Noto Color Emoji", sans-serif; will-change: transform; position: relative; z-index: 1; }
  .aura { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 40, 20, .55) 0%, rgba(255, 40, 20, .22) 45%, rgba(255, 40, 20, 0) 70%); opacity: .45; }
  #xhair { position: absolute; left: 0; top: 0; width: 170px; height: 170px; opacity: 0; }
  #xhairIn { position: absolute; inset: 0; }
  #xhair svg { width: 170px; height: 170px; overflow: visible; }
  #lockTag { position: absolute; left: 0; top: 0; padding: 6px 18px; border-radius: 10px; background: var(--f18-red); border: 4px solid var(--f18-ink); color: #fff; font: 800 40px "Bricolage Grotesque", sans-serif; text-transform: uppercase; opacity: 0; white-space: nowrap; }
  #timeUp { position: absolute; left: 100px; width: 780px; top: 820px; text-align: center; text-transform: uppercase; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 190px; color: var(--f18-red);
    -webkit-text-stroke: 8px var(--f18-ink); paint-order: stroke fill; opacity: 0; letter-spacing: -0.03em; }
  #coord { position: absolute; left: 100px; width: 780px; top: 1300px; text-align: center; opacity: 0; }
  #coord span { display: inline-block; padding: 14px 34px; border-radius: 999px; background: var(--f18-ink); color: var(--f18-gold); font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 56px; }

  /* product */
  .pv { position: absolute; left: 90px; width: 790px; text-align: center; }
  .pv2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 112px; line-height: 1.04; color: #fff; text-transform: uppercase; letter-spacing: -0.02em; }
  .mono { font: 700 76px "JetBrains Mono", monospace; font-variant-ligatures: none; color: var(--f18-lime); letter-spacing: -0.02em; margin-top: 8px; }
  #printWrap { position: absolute; left: 90px; top: 610px; width: 900px; height: 412px; }
  .f18-print { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #202326; box-shadow: 0 0 0 4px var(--f18-lime), 0 30px 90px rgba(124, 58, 237, .5); }
  .f18-print img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-l { position: absolute; left: 6%; height: 10%; border-radius: 10px; background: rgba(255,255,255,.3); }
  .tag { position: absolute; left: 90px; top: 1050px; padding: 10px 20px; border-radius: 999px; background: rgba(8, 5, 14, .85); border: 2px solid var(--f18-lime);
    font: 700 30px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--f18-lime); text-transform: uppercase; }
  .hlp { position: absolute; border-radius: 16px; border: 7px solid var(--f18-gold); box-shadow: 0 0 30px rgba(255, 207, 51, .6); opacity: 0; }
  .claim { position: absolute; left: 90px; width: 790px; top: 1140px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .claim span { padding: 12px 26px; border-radius: 999px; font: 800 50px "Inter", sans-serif; color: #140a0a; opacity: 0; }

  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(244,214,255,1) 0%, rgba(192,132,252,.85) 30%, rgba(168,85,247,0) 70%); mix-blend-mode: screen; }
  .ask { font: 900 64px "Inter", sans-serif; color: #f5f0fa; max-width: 800px; line-height: 1.12; }
  .ask b { color: #ff8a7a; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="16" data-fps="30">
  <div class="f18-paper"></div>
  <div id="xs"></div>
  <div class="f18-vig"></div>
  <div id="dark"></div>
  <div id="darkGrid"></div>

  <!-- PUZZLE 0 - 8.0 -->
  <section id="pz" class="clip" data-start="0" data-duration="8">
    <div id="pzIn" style="position:absolute; inset:0">
      <div class="f18-title"><div class="chipT" id="tA">Ache o boss</div></div>
      <div class="swap">
        <div><span class="pill" id="pause"><i></i>pausa e procura!</span></div>
        <div><span class="pill y" id="hint">dica: ele é maior</span></div>
      </div>
      <div id="hp"><div class="hp-top"><span>tempo</span><span id="hpN">4s</span></div><div class="hp-track"><div id="hpFill"></div></div></div>
      <div id="boardWrap">
        <div class="board"></div>
        <div id="grid"></div>
        <div id="xhair"><div id="xhairIn"><svg viewBox="0 0 170 170">
          <circle cx="85" cy="85" r="62" fill="none" stroke="#e8261a" stroke-width="9" />
          <path d="M85 0 V40 M85 130 V170 M0 85 H40 M130 85 H170" stroke="#1d0a0a" stroke-width="9" stroke-linecap="round" />
          <circle cx="85" cy="85" r="7" fill="#e8261a" />
        </svg></div></div>
        <div id="lockTag">boss!</div>
      </div>
      <div id="timeUp">tempo!</div>
      <div id="coord"><span>linha 8 · coluna 2</span></div>
    </div>
  </section>

  <!-- PRODUCT 8.0 - 12.8 -->
  <section id="pr" class="clip" data-start="8" data-duration="4.8">
    <div id="prIn" style="position:absolute; inset:0">
      <div class="pv" id="pvB" style="top:250px"><div class="pv2">O KizuBot avisa:</div><div class="mono" id="mono">bossDetected</div></div>
      <div id="printWrap">
        <div class="f18-print" id="print">
          <img src="kit/img/prints/boss-tangrowth-electivire--tangrowth.png" alt="" />
        </div>
        <div class="hlp" id="hlp" style="left:1.6%; top:22.6%; width:82%; height:31.5%"></div>
        <div class="hlp" id="hlp2" style="left:1.6%; top:64.6%; width:87%; height:18.4%"></div>
      </div>
      <div class="tag" id="tag">print real de cliente</div>
      <div class="claim"><span id="c1" style="background:#ff8a7a">boss</span><span id="c2" style="background:#ffcf33">drop raro</span><span id="c3" style="background:#c6ff3d">alarme no zap</span></div>
    </div>
  </section>

  <!-- END 12.8 - 16 -->
  <section id="end" class="clip" data-start="12.8" data-duration="3.2">
    <div class="kz-end" id="endIn" style="padding-right:200px">
      <div style="position:relative; width:540px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" style="width:540px" />
        <div class="eye" id="eye" style="left:169px; top:7px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk">Qual boss você <b>mais quer?</b></div>
    </div>
  </section>

  <div class="kz-progress"><div id="prog"></div></div>
  <div id="flash"></div>
  <div id="blackout"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 16;
  const b = KZ.beats(150);            // beat 0.4 s, bar 1.6 s

  /* ---------- puzzle: turtles; the boss is 12% bigger with a faint pulsing red aura ---------- */
  const COLS = 7, ROWS = 9, EMO = "\u{1F422}", BS = { r: 7, c: 1 };            // linha 8, coluna 2
  const GW = 780 - 52, GH = 820 - 52, CW = GW / COLS, CH = GH / ROWS, FS = Math.floor(Math.min(CW, CH) * 0.74);
  (function () {
    const g = document.getElementById("grid");
    g.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)"; g.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const boss = r === BS.r && c === BS.c;
      const cell = document.createElement("div"); cell.className = "cell" + (boss ? " boss" : ""); cell.id = "c" + r + "_" + c;
      if (boss) cell.insertAdjacentHTML("beforeend", '<div class="aura" id="aura"></div>');
      const e = document.createElement("span"); e.className = "emo"; e.textContent = EMO; e.style.fontSize = Math.round(FS * (boss ? 1.12 : 1)) + "px";
      if (!boss && (r + c) % 2) e.style.transform = "scaleX(-1)";   // static mirror for variety (never tweened)
      cell.appendChild(e); g.appendChild(cell);
    }
  })();
  const BX = 26 + (BS.c + 0.5) * CW, BY = 26 + (BS.r + 0.5) * CH;

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#xs", { x: 0, y: 0 }, { x: 44, y: 44, duration: D, ease: "none" }, 0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    tl.fromTo("#c" + r + "_" + c, { x: -3 }, { x: 3, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 6 }, ((r * 2 + c) % 5) * 0.16);
  }
  tl.fromTo("#aura", { opacity: 0.3, scale: 0.9 }, { opacity: 0.6, scale: 1.08, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);

  /* ---------- hook ---------- */
  tl.fromTo("#tA", { scale: 1.14, opacity: 0.6, rotation: -6 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.28, ease: "back.out(2.2)" }, 0);
  tl.fromTo("#boardWrap", { y: 40, scale: 0.96 }, { y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0);
  tl.fromTo("#hp", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, b(2));
  tl.fromTo("#pause", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, b(3));

  /* ---------- countdown: 4 s (1.6 -> 5.6) as a draining boss bar ---------- */
  const T0 = 1.6;
  const hpEl = document.getElementById("hpN"), hpo = { v: 4 };
  tl.fromTo("#hpFill", { scaleX: 1 }, { scaleX: 0, duration: 4, ease: "none" }, T0);
  tl.fromTo(hpo, { v: 4 }, { v: 0, duration: 4, ease: "none", onUpdate: function () { hpEl.textContent = Math.ceil(hpo.v - 1e-6) + "s"; } }, T0);
  for (let k = 0; k < 4; k++) KZ.shake(tl, "#hp", T0 + k, 5, 0.16, 70 + k);
  tl.to("#pause", { scale: 0.5, opacity: 0, duration: 0.15, ease: "power2.in" }, 3.6 - 0.15);
  tl.fromTo("#hint", { scale: 0.5, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 2, duration: 0.3, ease: "back.out(2.4)" }, 3.6);

  /* ---------- time's up: crosshair locks on ---------- */
  const A = 5.6;
  tl.to("#hint", { scale: 0.5, opacity: 0, duration: 0.15, ease: "power2.in" }, A - 0.1);
  tl.fromTo("#timeUp", { scale: 2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.2, ease: "power4.out" }, A);
  tl.to("#timeUp", { scale: 0.6, opacity: 0, duration: 0.15, ease: "power2.in" }, A + 0.4);
  tl.to(".cell:not(.boss)", { opacity: 0.18, duration: 0.3, ease: "power2.out" }, A + 0.45);
  tl.set("#xhair", { opacity: 1 }, A + 0.45);
  tl.fromTo("#xhair", { x: 390 - 85, y: 410 - 85 }, { x: BX - 85, y: BY - 85, duration: 0.6, ease: "power3.inOut" }, A + 0.45);
  tl.fromTo("#xhairIn", { scale: 1.6, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: "power3.inOut" }, A + 0.45);
  KZ.shake(tl, "#boardWrap", A + 1.05, 8, 0.25, 91);
  tl.fromTo(".boss .emo", { scale: 1 }, { scale: 1.35, duration: 0.3, ease: "back.out(3)", immediateRender: false }, A + 1.05);
  tl.fromTo("#lockTag", { x: BX + 40, y: BY - 140, scale: 0.4, opacity: 0 }, { x: BX + 40, y: BY - 130, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 1.1);
  tl.fromTo("#coord", { y: 30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 1.3);
  tl.to("#xhairIn", { scale: 1.08, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, A + 1.4);
  tl.to("#pzIn", { y: 260, opacity: 0, duration: 0.25, ease: "power3.in" }, 8 - 0.25);

  /* ---------- product ---------- */
  const R = 8.0;
  KZ.flash(tl, "#flash", R, 0.85);
  tl.fromTo("#dark", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, R);
  tl.fromTo("#darkGrid", { opacity: 0, x: 0, y: 0 }, { opacity: 0.6, x: 40, y: 80, duration: 8, ease: "none" }, R);
  KZ.slam(tl, "#pvB", R, 1.6);
  tl.fromTo("#mono", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, R + b(1));
  tl.fromTo("#printWrap", { y: 120, scale: 0.9, filter: "blur(16px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, R + 0.2);
  KZ.pop(tl, "#tag", R + 0.55, 0.3);
  tl.fromTo("#hlp", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, R + b(2.5));
  tl.fromTo("#hlp2", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, R + b(4.5));
  ["#c1", "#c2", "#c3"].forEach(function (c, i) { KZ.pop(tl, c, R + b(6) + i * 0.15, 0.32); });
  tl.to("#printWrap", { scale: 1.03, duration: 3.6, ease: "sine.inOut" }, R + 0.7);
  tl.to("#prIn", { opacity: 0, scale: 0.95, duration: 0.18, ease: "power2.in" }, 12.8 - 0.2);

  /* ---------- END ---------- */
  const E = 12.8;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, E + 0.04);
  KZ.eyePulse(tl, "#eye", E + 0.14, 3);
  KZ.rise(tl, "#endUrl", E + 0.45, 0.35, 30);
  KZ.rise(tl, "#endAsk", E + 0.8, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, E + 0.6);
  tl.fromTo("#blackout", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
