<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>130 Ache a mega</title>
<link rel="stylesheet" href="kit/css/fonts.css" />
<link rel="stylesheet" href="kit/css/kz.css" />
<script src="kit/js/gsap.min.js"></script>
<script src="kit/js/kz.js"></script>
<style>
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
  /* ================= F18 · ACHE O SHINY — ep. 130 (mega, sky paper) ================= */
  :root { --f18-paper: #dcefff; --f18-dot: #b6dcfb; --f18-ink: #0b1630; --f18-mag: #e83bd6; --f18-gold: #ffcf33; --f18-lime: #c6ff3d; }
  #root { background: var(--f18-paper); }
  .f18-paper { position: absolute; inset: 0; background: var(--f18-paper); }
  #grid2 { position: absolute; inset: -100px; background-image: linear-gradient(var(--f18-dot) 2px, transparent 2px), linear-gradient(90deg, var(--f18-dot) 2px, transparent 2px); background-size: 52px 52px; opacity: .8; }
  .f18-vig { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 45%, rgba(255,255,255,0) 55%, rgba(20, 60, 120, .14) 100%); pointer-events: none; }
  #dark { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, #3b1470 0%, #140a22 60%, #0b0712 100%); opacity: 0; }
  #darkGrid { position: absolute; inset: -200px; opacity: 0;
    background-image: linear-gradient(rgba(168, 85, 247, .14) 2px, transparent 2px), linear-gradient(90deg, rgba(168, 85, 247, .14) 2px, transparent 2px); background-size: 90px 90px; }
  .kz-progress { height: 10px; background: rgba(11, 22, 48, .12); }
  .kz-progress > div { background: linear-gradient(90deg, #e83bd6, #7cc8ff); }

  .f18-title { position: absolute; left: 100px; width: 780px; top: 226px; text-align: center; }
  .t1 { display: inline-block; white-space: nowrap; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 100px; line-height: 1.02; color: var(--f18-ink); letter-spacing: -0.035em; text-transform: uppercase; }
  .t1 .m { color: var(--f18-mag); }
  .gemT { display: inline-block; width: 74px; height: 74px; vertical-align: -4px; margin-left: 8px; }
  .swap { position: absolute; left: 100px; width: 780px; top: 362px; height: 64px; }
  .swap > div { position: absolute; inset: 0; display: flex; justify-content: center; }
  .pill { display: inline-flex; white-space: nowrap; align-items: center; padding: 6px 28px; border-radius: 999px; background: var(--f18-ink); color: #9fd6ff;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 44px; text-transform: uppercase; opacity: 0; }
  .pill i { display: inline-block; width: 12px; height: 32px; background: currentColor; border-radius: 4px; box-shadow: 22px 0 0 currentColor; margin-right: 40px; }
  .pill.m { background: var(--f18-mag); color: #fff; }
  /* dial timer */
  #timer { position: absolute; left: 788px; top: 432px; width: 130px; height: 130px; }
  .tm-bg { position: absolute; inset: 0; border-radius: 50%; background: #fff; border: 7px solid var(--f18-ink); box-shadow: 0 8px 0 var(--f18-ink); }
  #tmDial { position: absolute; inset: 14px; width: 102px; height: 102px; transform: rotate(-90deg); }
  .tm-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 66px; color: var(--f18-ink); opacity: 0; }
  #tm4 { opacity: 1; }
  #dots4 { position: absolute; left: 100px; top: 470px; width: 680px; height: 54px; display: flex; gap: 14px; align-items: center; }
  .d4 { flex: 1; height: 24px; border-radius: 12px; background: var(--f18-mag); border: 5px solid var(--f18-ink); transform-origin: 50% 50%; }

  #boardWrap { position: absolute; left: 100px; top: 572px; width: 780px; height: 826px; }
  .board { position: absolute; inset: 0; border-radius: 36px; background: #fbfdff; border: 7px solid var(--f18-ink); box-shadow: 0 14px 0 var(--f18-ink); }
  #grid { position: absolute; left: 26px; top: 26px; right: 26px; bottom: 26px; display: grid; }
  .cell { display: flex; align-items: center; justify-content: center; position: relative; }
  .emo { display: block; line-height: 1; font-family: "Noto Color Emoji", sans-serif; will-change: transform; }
  .stone { position: absolute; right: 12%; top: 8%; width: 30px; height: 30px; filter: drop-shadow(0 0 6px rgba(232, 59, 214, .9)); }
  #scan { position: absolute; left: 10px; right: 10px; top: 0; height: 120px; opacity: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(232, 59, 214, 0) 0%, rgba(232, 59, 214, .22) 70%, rgba(232, 59, 214, .9) 96%, rgba(255,255,255,.95) 100%); }
  #ring { position: absolute; overflow: visible; pointer-events: none; }
  #ring path { fill: none; stroke: var(--f18-mag); stroke-width: 11; stroke-linecap: round; }
  #megaTag { position: absolute; left: 0; top: 0; padding: 6px 18px; border-radius: 10px; background: var(--f18-mag); border: 4px solid var(--f18-ink); color: #fff; font: 800 40px "Bricolage Grotesque", sans-serif; text-transform: uppercase; opacity: 0; white-space: nowrap; }
  #timeUp { position: absolute; left: 100px; width: 780px; top: 820px; text-align: center; text-transform: uppercase; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 190px; color: var(--f18-mag);
    -webkit-text-stroke: 8px var(--f18-ink); paint-order: stroke fill; opacity: 0; letter-spacing: -0.03em; }
  #coord { position: absolute; left: 100px; width: 780px; top: 1300px; text-align: center; opacity: 0; }
  #coord span { display: inline-block; padding: 14px 34px; border-radius: 999px; background: var(--f18-ink); color: var(--f18-lime); font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 56px; }
  .spark { position: absolute; left: 0; top: 0; width: 20px; height: 20px; opacity: 0; }
  #sparkField { position: absolute; left: 0; top: 0; width: 0; height: 0; }

  /* pivot + product */
  .pv { position: absolute; left: 90px; width: 790px; text-align: center; }
  .pv1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 104px; line-height: 1.04; color: var(--f18-ink); text-transform: uppercase; letter-spacing: -0.02em; }
  .pv1 .m { color: var(--f18-mag); }
  .pv2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 104px; line-height: 1.04; color: #fff; text-transform: uppercase; letter-spacing: -0.02em; }
  .pv2 em { font-style: normal; color: var(--f18-lime); }
  #qWrap { position: absolute; left: 140px; top: 600px; width: 760px; height: 105px; }
  #cWrap { position: absolute; left: 210px; top: 760px; width: 560px; height: 305px; }
  .f18-print { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: #1e2125; box-shadow: 0 0 0 4px var(--f18-lime), 0 30px 90px rgba(124, 58, 237, .5); }
  .f18-print img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .ph-l { position: absolute; left: 5%; height: 34%; border-radius: 10px; background: rgba(255,255,255,.3); }
  .tag { position: absolute; left: 90px; top: 1100px; padding: 10px 20px; border-radius: 999px; background: rgba(8, 5, 14, .85); border: 2px solid var(--f18-lime);
    font: 700 30px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--f18-lime); text-transform: uppercase; }
  .hlp { position: absolute; border-radius: 14px; border: 7px solid var(--f18-gold); box-shadow: 0 0 30px rgba(255, 207, 51, .6); opacity: 0; }
  .claim { position: absolute; left: 90px; width: 790px; top: 1180px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .claim span { padding: 12px 26px; border-radius: 999px; font: 800 48px "Inter", sans-serif; color: #120a1c; opacity: 0; }

  .eye { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(244,214,255,1) 0%, rgba(192,132,252,.85) 30%, rgba(168,85,247,0) 70%); mix-blend-mode: screen; }
  .ask { font: 900 64px "Inter", sans-serif; color: #f5f0fa; max-width: 800px; line-height: 1.12; }
  .ask b { color: #f59cf0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 45; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="16.5" data-fps="30">
  <div class="f18-paper"></div>
  <div id="grid2"></div>
  <div class="f18-vig"></div>
  <div id="dark"></div>
  <div id="darkGrid"></div>

  <!-- PUZZLE 0 - 8.0 -->
  <section id="pz" class="clip" data-start="0" data-duration="8">
    <div id="pzIn" style="position:absolute; inset:0">
      <div class="f18-title"><div class="t1" id="tA">Ache a <span class="m">mega</span></div></div>
      <div class="swap">
        <div><span class="pill" id="pause"><i></i>pausa e procura!</span></div>
        <div><span class="pill m" id="hint">dica: olha a pedra</span></div>
      </div>
      <div id="dots4"><div class="d4" id="q1"></div><div class="d4" id="q2"></div><div class="d4" id="q3"></div><div class="d4" id="q4"></div></div>
      <div id="timer"><div class="tm-bg"></div>
        <svg id="tmDial" viewBox="0 0 102 102"><circle cx="51" cy="51" r="38" fill="none" stroke="#e5f2ff" stroke-width="22" /><circle id="tmArc" cx="51" cy="51" r="38" fill="none" stroke="#e83bd6" stroke-width="22" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" /></svg>
        <div class="tm-n" id="tm4">4</div><div class="tm-n" id="tm3">3</div><div class="tm-n" id="tm2">2</div><div class="tm-n" id="tm1">1</div><div class="tm-n" id="tm0">0</div></div>
      <div id="boardWrap">
        <div class="board"></div>
        <div id="grid"></div>
        <div id="scan"></div>
        <svg id="ring" viewBox="0 0 200 200"><path id="ringPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M 34 108 C 24 52, 88 20, 134 32 C 180 46, 190 106, 156 148 C 126 186, 56 182, 36 138 C 26 114, 38 84, 60 66" /></svg>
        <div id="sparkField"></div>
        <div id="megaTag">mega!</div>
      </div>
      <div id="timeUp">tempo!</div>
      <div id="coord"><span>linha 3 · coluna 5</span></div>
    </div>
  </section>

  <!-- PIVOT 8.0 - 9.5 -->
  <section id="pv" class="clip" data-start="8" data-duration="1.5">
    <div class="pv" id="pvA" style="top:620px"><div class="pv1">Uma mega</div><div class="pv1"><span class="m">aparece…</span></div></div>
  </section>

  <!-- PRODUCT 9.5 - 13.5 -->
  <section id="pr" class="clip" data-start="9.5" data-duration="4">
    <div id="prIn" style="position:absolute; inset:0">
      <div class="pv" id="pvB" style="top:260px"><div class="pv2">O KizuBot</div><div class="pv2"><em>detecta.</em></div></div>
      <div id="qWrap">
        <div class="f18-print" id="qprint">
          <img src="kit/img/prints/mega-stone-barbaracite.png" alt="" />
        </div>
      </div>
      <div id="cWrap">
        <div class="f18-print" id="cprint">
          <img src="kit/img/prints/mega-stone-barbaracite--card.png" alt="" />
        </div>
        <div class="hlp" id="hlp" style="left:22%; top:30%; width:56%; height:21%"></div>
      </div>
      <div class="tag" id="tag">print real de cliente</div>
      <div class="claim"><span id="c1" style="background:#f59cf0">mega</span><span id="c2" style="background:#ffcf33">shiny</span><span id="c3" style="background:#ff8a7a">boss</span></div>
    </div>
  </section>

  <!-- END 13.5 - 16.5 -->
  <section id="end" class="clip" data-start="13.5" data-duration="3">
    <div class="kz-end" id="endIn" style="padding-right:200px">
      <div style="position:relative; width:540px">
        <img class="kz-end-logo" id="endLogo" src="kit/img/brand/kizubot-logo.png" alt="" style="width:540px" />
        <div class="eye" id="eye" style="left:169px; top:7px"></div>
      </div>
      <div class="kz-url" id="endUrl">kizubot.com</div>
      <div class="ask" id="endAsk">Pegou <b>de primeira?</b></div>
    </div>
  </section>

  <div class="kz-progress"><div id="prog"></div></div>
  <div id="flash"></div>
  <div id="blackout"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = 16.5;
  const b = KZ.beats(120);            // beat 0.5 s, bar 2 s

  /* ---------- puzzle: dragons; the "mega" wears a tiny glowing stone (generic gem, not official art) ---------- */
  const COLS = 7, ROWS = 9, EMO = "\u{1F432}", MG = { r: 2, c: 4 };              // linha 3, coluna 5
  const GW = 780 - 52, GH = 826 - 52, CW = GW / COLS, CH = GH / ROWS, FS = Math.floor(Math.min(CW, CH) * 0.78);
  const GEM = '<svg class="stone" viewBox="0 0 64 64"><path d="M32 4 L56 22 L32 60 L8 22 Z" fill="#f59cf0" stroke="#0b1630" stroke-width="5" stroke-linejoin="round"/><path d="M8 22 H56 M20 22 L32 60 L44 22" stroke="#0b1630" stroke-width="3" fill="none"/></svg>';
  (function () {
    const g = document.getElementById("grid");
    g.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)"; g.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const mega = r === MG.r && c === MG.c;
      const cell = document.createElement("div"); cell.className = "cell" + (mega ? " mega" : ""); cell.id = "c" + r + "_" + c;
      const e = document.createElement("span"); e.className = "emo"; e.textContent = EMO; e.style.fontSize = FS + "px";
      cell.appendChild(e);
      if (mega) cell.insertAdjacentHTML("beforeend", GEM);
      g.appendChild(cell);
    }
    document.getElementById("tA").insertAdjacentHTML("beforeend", GEM.replace('class="stone"', 'class="gemT"'));
  })();
  const MX = 26 + (MG.c + 0.5) * CW, MY = 26 + (MG.r + 0.5) * CH;
  (function () {
    const R = Math.min(CW, CH) * 1.0;
    const c = document.getElementById("ring");
    c.style.left = (MX - R) + "px"; c.style.top = (MY - R) + "px"; c.style.width = 2 * R + "px"; c.style.height = 2 * R + "px";
    const sf = document.getElementById("sparkField"); sf.style.left = MX + "px"; sf.style.top = MY + "px";
  })();

  KZ.progress(tl, "#prog", 0, D - 0.05);
  tl.fromTo("#grid2", { x: 0, y: 0 }, { x: 52, y: -52, duration: D, ease: "none" }, 0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    tl.fromTo("#c" + r + "_" + c + " .emo", { scale: 0.97 }, { scale: 1.04, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, ((r + c * 2) % 7) * 0.07);
  }

  /* ---------- hook ---------- */
  tl.fromTo("#tA", { scale: 1.2, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, 0);
  tl.fromTo("#boardWrap", { y: 50, rotation: 2 }, { y: 0, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 0);
  tl.fromTo("#timer", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.4)" }, b(2));
  tl.fromTo(".d4", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.06 }, b(2));
  tl.fromTo("#pause", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, b(3));

  /* ---------- countdown: 4 s (1.5 -> 5.5), on the beat ---------- */
  const T0 = 1.5;
  tl.to("#tmArc", { attr: { "stroke-dashoffset": 1 }, duration: 4, ease: "none" }, T0);
  for (let k = 1; k <= 4; k++) {
    const at = T0 + k;
    tl.to("#q" + (5 - k), { scale: 0, opacity: 0.2, duration: 0.18, ease: "power2.in" }, at - 0.18);
    tl.set("#tm" + (5 - k), { opacity: 0 }, at);
    tl.fromTo("#tm" + (4 - k), { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, at);
    KZ.shake(tl, "#timer", at, 5, 0.18, 50 + k);
  }
  tl.to("#pause", { scale: 0.5, opacity: 0, duration: 0.15, ease: "power2.in" }, 3.5 - 0.15);
  tl.fromTo("#hint", { scale: 0.5, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 2, duration: 0.3, ease: "back.out(2.4)" }, 3.5);

  /* ---------- time's up: radar scan finds the mega ---------- */
  const A = 5.5;
  tl.to("#hint", { scale: 0.5, opacity: 0, duration: 0.15, ease: "power2.in" }, A - 0.1);
  tl.fromTo("#timeUp", { scale: 2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.2, ease: "power4.out" }, A);
  tl.to("#timeUp", { scale: 0.6, opacity: 0, duration: 0.15, ease: "power2.in" }, A + 0.4);
  tl.set("#scan", { opacity: 1 }, A + 0.4);
  tl.fromTo("#scan", { y: -120 }, { y: 826, duration: 0.55, ease: "power1.inOut" }, A + 0.4);
  tl.to("#scan", { y: MY - 100, duration: 0.3, ease: "power3.out" }, A + 0.95);
  tl.to(".cell:not(.mega)", { opacity: 0.16, duration: 0.3, ease: "power2.out" }, A + 0.95);
  tl.to("#scan", { opacity: 0, duration: 0.25 }, A + 1.25);
  tl.fromTo(".mega .emo", { scale: 1 }, { scale: 1.4, duration: 0.3, ease: "back.out(3)", immediateRender: false }, A + 1.2);
  tl.to("#ringPath", { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.inOut" }, A + 1.2);
  tl.fromTo("#megaTag", { x: MX - 70, y: MY - 150, scale: 0.4, opacity: 0 }, { x: MX - 70, y: MY - 140, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 1.25);
  (function () {
    const field = document.getElementById("sparkField");
    const cols = ["#e83bd6", "#ffcf33", "#7cc8ff", "#c6ff3d"];
    const pr = function (n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const parts = [];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("div"); el.className = "spark";
      const s = 12 + pr(i * 3 + 1) * 14; el.style.width = s + "px"; el.style.height = s + "px"; el.style.background = cols[i % 4];
      el.style.borderRadius = (i % 3 === 0 ? "50%" : "4px"); el.style.border = "3px solid #0b1630"; field.appendChild(el);
      const a = pr(i * 5 + 2) * Math.PI * 2, spd = 300 + pr(i * 7 + 3) * 360;
      parts.push({ el: el, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 120 });
    }
    const dr = { T: 0 }, FL = 0.9;
    tl.fromTo(dr, { T: 0 }, { T: 1, duration: FL, ease: "none", onUpdate: function () {
      const t = dr.T * FL, fade = Math.min(1, (1 - dr.T) / 0.3);
      parts.forEach(function (p) { p.el.style.transform = "translate(" + (p.vx * t) + "px," + (p.vy * t + 420 * t * t) + "px) rotate(" + (260 * t) + "deg)"; p.el.style.opacity = String(dr.T === 0 ? 0 : fade); });
    } }, A + 1.2);
  })();
  tl.fromTo("#coord", { y: 30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, A + 1.4);
  tl.to(".mega .emo", { scale: 1.3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, A + 1.6);
  tl.to("#pzIn", { y: 260, opacity: 0, duration: 0.25, ease: "power3.in" }, 8 - 0.25);

  /* ---------- pivot ---------- */
  KZ.slam(tl, "#pvA", 8.0, 1.6);
  tl.to("#pvA", { scale: 1.05, duration: 1.2, ease: "sine.in" }, 8.3);

  /* ---------- product ---------- */
  const R = 9.5;
  KZ.flash(tl, "#flash", R, 0.85);
  tl.fromTo("#dark", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, R);
  tl.fromTo("#darkGrid", { opacity: 0, x: 0, y: 0 }, { opacity: 0.6, x: 40, y: 80, duration: 7, ease: "none" }, R);
  KZ.slam(tl, "#pvB", R, 1.6);
  tl.fromTo("#qWrap", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, R + 0.2);
  tl.fromTo("#cWrap", { y: 140, scale: 0.9, opacity: 0, rotation: 3 }, { y: 0, scale: 1, opacity: 1, rotation: -1, duration: 0.45, ease: "back.out(1.8)" }, R + b(1.5));
  KZ.pop(tl, "#tag", R + b(2), 0.3);
  tl.fromTo("#hlp", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, R + b(3));
  ["#c1", "#c2", "#c3"].forEach(function (c, i) { KZ.pop(tl, c, R + b(4.5) + i * 0.15, 0.32); });
  tl.to("#cWrap", { scale: 1.03, duration: 2.4, ease: "sine.inOut" }, R + 1.2);
  tl.to("#prIn", { opacity: 0, scale: 0.95, duration: 0.18, ease: "power2.in" }, 13.5 - 0.2);

  /* ---------- END ---------- */
  const E = 13.5;
  tl.fromTo("#endLogo", { scale: 0.3, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, E + 0.04);
  KZ.eyePulse(tl, "#eye", E + 0.14, 3);
  KZ.rise(tl, "#endUrl", E + 0.45, 0.35, 30);
  KZ.rise(tl, "#endAsk", E + 0.8, 0.4, 30);
  tl.to("#endLogo", { scale: 1.04, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, E + 0.6);
  tl.fromTo("#blackout", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
